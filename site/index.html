<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMS 313 Study Route</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive study site for EMS 313 Public Health and Safety: learning route, flashcards, drills and exams.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>/* Layout: app shell — sticky top bar, side rail on desktop, bottom tab bar on phones; reading column ~68ch.
   Palette: clinical teal on a cool mineral neutral; amber = caution, violet = source conflict. */
:root {
  --bg: #F2F5F4; --surface: #FFFFFF; --surface2: #E7EEEC; --ink: #10232A; --muted: #4F656B; --line: #D2DDDA;
  --accent: #0A7A72; --accent-ink: #FFFFFF; --accent-soft: #D3ECE8;
  --good: #1B7A3A; --good-soft: #DCF1E2; --bad: #B3261E; --bad-soft: #F8DDDA;
  --warn: #8A5300; --warn-soft: #FAEBCF; --violet: #5E4699; --violet-soft: #ECE6F7;
  --shadow: 0 1px 2px rgba(16,35,42,.06), 0 4px 16px rgba(16,35,42,.06);
  --f-ui: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --f-en: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --fs: 16px; --r: 12px; --nav-h: 64px;
  --ra-accent: var(--accent); --ra-on-accent: var(--accent-ink); --ra-soft: var(--accent-soft); --ra-surface: var(--surface); --ra-text: var(--ink); --ra-line: var(--line);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C1518; --surface: #132025; --surface2: #1A2A30; --ink: #E2EDEB; --muted: #9AB0B3; --line: #2A3C42;
  --accent: #3DC3B5; --accent-ink: #052320; --accent-soft: #123A36;
  --good: #6FD08C; --good-soft: #14321E; --bad: #FF8F86; --bad-soft: #3B1A18; --warn: #F0B860; --warn-soft: #36280F; --violet: #BBA6EC; --violet-soft: #272040;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0C1518; --surface: #132025; --surface2: #1A2A30; --ink: #E2EDEB; --muted: #9AB0B3; --line: #2A3C42;
  --accent: #3DC3B5; --accent-ink: #052320; --accent-soft: #123A36;
  --good: #6FD08C; --good-soft: #14321E; --bad: #FF8F86; --bad-soft: #3B1A18; --warn: #F0B860; --warn-soft: #36280F; --violet: #BBA6EC; --violet-soft: #272040;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
html { font-size: var(--fs); -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 1rem; line-height: 1.6; margin: 0; overflow-x: hidden }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0 }
.en { font-family: var(--f-en) }
[dir="ltr"] { text-align: left }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.top-in { display: flex; align-items: center; gap: 12px; min-height: 56px; max-width: 1240px; margin: 0 auto }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); min-width: 0 }
.brand b { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; white-space: nowrap }
.brand span { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.top .sp { flex: 1 }
.iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer }
.iconbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
.gbar { height: 4px; background: var(--surface2); position: relative }
.gbar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width .4s }
[dir="rtl"] .gbar i { inset: 0 0 0 auto }

/* shell */
.shell { display: flex; max-width: 1240px; margin: 0 auto; gap: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.rail { display: none }
main { flex: 1; min-width: 0; padding-block: 20px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)) }
.tabs { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px) }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: var(--nav-h); text-decoration: none; color: var(--muted); font-size: .74rem; font-weight: 600 }
.tabs a svg, .rail a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none }
.tabs a.on { color: var(--accent) }
@media (min-width: 960px) {
  .tabs { display: none }
  .rail { display: flex; flex-direction: column; gap: 2px; width: 230px; flex: none; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: flex-start; padding-top: 20px; max-height: calc(100vh - 80px); overflow-y: auto }
  .rail a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 500 }
  .rail a:hover { background: var(--surface2) }
  .rail a.on { background: var(--accent-soft); color: var(--accent); font-weight: 700 }
  .rail .cnt { margin-inline-start: auto; font-family: var(--f-mono); font-size: .75rem; color: var(--muted) }
  main { padding-bottom: 60px }
}
.col { max-width: 760px }

/* generic */
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.small { font-size: .88rem }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.stack { display: flex; flex-direction: column; gap: 14px }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; touch-action: manipulation }
.btn:hover { border-color: var(--accent) }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.ghost { background: transparent }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .9rem }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn[disabled] { opacity: .5; cursor: not-allowed }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface2); color: var(--muted); white-space: nowrap }
.pill.ok { background: var(--good-soft); color: var(--good) }
.pill.past { background: var(--warn-soft); color: var(--warn) }
.pill.edit { background: var(--violet-soft); color: var(--violet) }
.src { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); background: var(--surface2); padding: 1px 8px; border-radius: 6px; white-space: nowrap }
.meter { height: 8px; border-radius: 999px; background: var(--surface2); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 8px 0 }
.title { font-size: 1.6rem; font-weight: 700 }
.sub { font-size: 1.15rem; font-weight: 700 }
input[type=search], input[type=text], select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface) }
textarea { min-height: 110px; font-family: var(--f-mono); font-size: .8rem }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); text-align: center }

/* home */
.hero { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: center }
.ring { --p: 0; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface2) 0); flex: none }
.ring > div { width: 94px; height: 94px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; font-family: var(--f-mono); font-weight: 700; font-size: 1.4rem; line-height: 1.1 }
.ring small { display: block; font-family: var(--f-ui); font-size: .68rem; color: var(--muted); font-weight: 600 }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.35rem; font-variant-numeric: tabular-nums }
.unit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.unit-h { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px }
.unit-n { font-family: var(--f-mono); font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; flex: none }
.unit-h .t { flex: 1; min-width: 0 }
.unit-h h3 { font-family: var(--f-en); font-size: 1.05rem }
.seclist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line) }
.seclist a { display: flex; align-items: center; gap: 10px; padding: 11px 16px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line) }
.seclist li:last-child a { border-bottom: 0 }
.seclist a:hover { background: var(--surface2) }
.chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: .75rem; color: transparent }
.chk.on { background: var(--good); border-color: var(--good); color: var(--accent-ink) }
:root .chk.on { color: #fff }
.seclist .nm { flex: 1; min-width: 0; font-family: var(--f-en) }

/* section reading */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted) }
.crumbs a { color: var(--muted) }
.sec-h { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 16px }
.sec-h h1 { font-family: var(--f-en); font-size: 1.7rem }
.content { display: flex; flex-direction: column; gap: 14px; font-family: var(--f-en); font-size: 1.04rem }
.content p { margin: 0; max-width: 68ch }
.content h3.bh { font-size: 1.15rem; margin-top: 10px; font-family: var(--f-en) }
.content ul, .content ol { margin: 0; padding-inline-start: 1.3em; display: flex; flex-direction: column; gap: 6px; max-width: 68ch }
.blk { position: relative }
.blk > .ra-btn, .lrow .ra-btn { min-height: 32px; padding: 0 10px; font-size: .8rem; margin-top: 4px; font-family: var(--f-ui) }
.term { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: pointer; border-radius: 3px }
.term:hover { background: var(--accent-soft) }
.note { border-radius: var(--r); padding: 12px 14px; background: var(--surface2); border: 1px solid var(--line) }
.note .lab { display: block; font-family: var(--f-ui); font-size: .76rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px }
.note.key { background: var(--accent-soft); border-color: transparent } .note.key .lab { color: var(--accent) }
.note.warn { background: var(--warn-soft); border-color: transparent } .note.warn .lab { color: var(--warn) }
.note.ems { background: var(--surface); } .note.ems .lab { color: var(--muted) }
.note.conflict, .note.added { background: var(--violet-soft); border-color: transparent } .note.conflict .lab, .note.added .lab { color: var(--violet) }
.tblw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
.tblw table { border-collapse: collapse; width: 100%; font-size: .95rem }
.tblw caption { caption-side: top; text-align: start; padding: 10px 12px 4px; font-weight: 700; font-family: var(--f-en) }
.tblw th, .tblw td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; text-align: start }
.tblw th { background: var(--surface2); font-size: .85rem }
.tblw td:first-child { font-weight: 600 }
.tbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 12px 2px; flex-wrap: wrap }
.testing td.h:not(.shown), .testing .hv:not(.shown) { color: transparent; background: repeating-linear-gradient(-45deg, var(--surface2) 0 6px, var(--surface) 6px 12px); cursor: pointer; user-select: none }
.testing td.h:not(.shown) *, .testing .hv:not(.shown) * { color: transparent !important; background: transparent !important; text-decoration: none }
.twocol { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)) }
.twocol > div { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--surface); min-width: 0 }
.twocol h4 { margin: 0 0 6px; font-size: .95rem }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .92rem }
.flow span { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px }
.flow span:last-child { background: var(--accent-soft); border-color: transparent; font-weight: 600 }
.flow em { font-style: normal; color: var(--accent); font-weight: 700 }
.statbig { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px }
.statbig b { font-family: var(--f-mono); font-size: 2.2rem; color: var(--accent) }
.why, .recall li { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--surface) }
.why .q, .recall .q { font-weight: 600 }
.ans { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line) }
.recall { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.rbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px }
.dcards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)) }
.dcard { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.dcard h4 { margin: 0; font-size: 1.08rem }
.dcard dl { margin: 0; display: grid; grid-template-columns: 6.2em 1fr; gap: 4px 10px; font-size: .92rem }
.dcard dt { color: var(--muted); font-weight: 600 }
.dcard dd { margin: 0; min-width: 0 }
.mist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px }
.mist button { width: 100%; text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer }
.mist .fix { color: var(--good); font-weight: 600; margin-top: 4px }
.diag { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow-x: auto }
.diag svg { display: block; width: 100%; max-width: 640px; height: auto; margin: 0 auto }
.diag .dbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-family: var(--f-ui) }
.diag text { font-family: var(--f-en); fill: var(--ink) }
.diag .nd { fill: var(--surface2); stroke: var(--line); stroke-width: 1.5 }
.diag .nd.ac { fill: var(--accent-soft); stroke: var(--accent) }
.diag .ln { stroke: var(--muted); stroke-width: 2; fill: none }
.diag .ar { fill: var(--muted) }
.diag .t1 { font-weight: 700; font-size: 14px }
.diag .t2 { font-size: 11.5px; fill: var(--muted) }
.diag .acc { fill: var(--accent) }
.diag .dot { fill: var(--accent) }
.diag .dotb { fill: var(--warn) }
.diag.hidel .lbl:not(.shown) { fill: transparent; stroke: var(--line); stroke-dasharray: 2 2; cursor: pointer }
.diag .lblbg { fill: transparent; cursor: pointer }

/* widgets: order, sort */
.widget { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px; font-family: var(--f-ui) }
.widget .wt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.widget .wt h4 { margin: 0; font-family: var(--f-en); font-size: 1rem; flex: 1; min-width: 12em }
.chips { display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--f-en) }
.chip { min-height: 40px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; text-align: start; font-size: .92rem }
.chip:hover { border-color: var(--accent) }
.olist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-family: var(--f-en); counter-reset: o }
.olist li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 10px; min-height: 42px; counter-increment: o; cursor: pointer }
.olist li::before { content: counter(o); font-family: var(--f-mono); font-weight: 700; color: var(--accent); width: 1.4em; flex: none }
.olist li.ok { border-style: solid; border-color: var(--good); background: var(--good-soft) }
.olist li.no { border-style: solid; border-color: var(--bad); background: var(--bad-soft) }
.srt { display: flex; flex-direction: column; gap: 10px }
.srt .it { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px }
.srt .it .nm { font-family: var(--f-en); font-weight: 600 }
.srt .it.ok { border-color: var(--good); background: var(--good-soft) }
.srt .it.no { border-color: var(--bad); background: var(--bad-soft) }
.srt .cats { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-en) }
.srt .cats button { min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .86rem }
.srt .cats button.pick { border-color: currentColor; font-weight: 700 }
.fb { font-size: .9rem; font-weight: 600 }
.fb.ok { color: var(--good) } .fb.no { color: var(--bad) }

/* questions */
.qcard { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--f-ui) }
.qtext { font-family: var(--f-en); font-size: 1.06rem; font-weight: 600 }
.opts { display: flex; flex-direction: column; gap: 8px; font-family: var(--f-en) }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: start; width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.45 }
.opt:hover:not([disabled]) { border-color: var(--accent) }
.opt .k { font-family: var(--f-mono); font-weight: 700; color: var(--muted); flex: none; width: 1.2em }
.opt.sel { border-color: var(--accent); background: var(--accent-soft) }
.opt.right { border-color: var(--good); background: var(--good-soft) }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.opt[disabled] { cursor: default }
.expl { border-radius: 10px; padding: 10px 12px; background: var(--surface2); font-family: var(--f-en); font-size: .95rem }
.expl b.ok { color: var(--good) } .expl b.no { color: var(--bad) }
.qnav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center }
.qdots { display: flex; flex-wrap: wrap; gap: 4px }
.qdots button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-mono); font-size: .72rem; cursor: pointer }
.qdots button.a { background: var(--accent-soft); border-color: var(--accent) }
.qdots button.cur { outline: 2px solid var(--accent) }
.timer { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 8px; background: var(--surface2) }
.timer.low { background: var(--bad-soft); color: var(--bad) }
.res-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
.res-table td, .res-table th { padding: 8px 10px; border-top: 1px solid var(--line); text-align: start }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px }

/* flashcards */
.fcard { min-height: 220px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; justify-content: center; gap: 12px; cursor: pointer; font-family: var(--f-en) }
.fcard .front { font-size: 1.2rem; font-weight: 700 }
.fcard .back { font-size: 1.05rem; border-top: 1px dashed var(--line); padding-top: 12px }
.dots3 { display: inline-flex; gap: 4px; vertical-align: middle }
.dots3 i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line) }
.dots3 i.on { background: var(--good); border-color: var(--good) }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px }

/* steps */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: st }
.steps li { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; counter-increment: st }
.steps li .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; background: var(--surface2); flex: none }
.steps li.done .num { background: var(--good); color: var(--surface) }
.steps li.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.steps li .b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px }

/* popover */
.pop { position: fixed; z-index: 40; max-width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 6px }
.pop .en { font-weight: 700 }
.pop .ar { font-size: 1.15rem; font-weight: 700; color: var(--accent) }
.glist { display: flex; flex-direction: column; gap: 8px }
.gitem { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px 14px; display: grid; gap: 4px }
.gitem .row1 { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; align-items: baseline }
.gitem .en { font-weight: 700; direction: ltr }
.gitem .ar { color: var(--accent); font-weight: 700 }
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 2px }
.res { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); text-decoration: none; color: var(--ink) }
.res:hover { border-color: var(--accent) }
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; max-width: calc(100vw - 32px) }
@media (min-width: 960px) { .toast { bottom: 24px } }
.lrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
@media (max-width: 420px) { .title { font-size: 1.35rem } .sec-h h1 { font-size: 1.4rem } }
.diag .ph { display: none }
.diag.hidel .lbl:not(.shown) .ph { display: inline; fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; cursor: pointer }
.diag.hidel .lbl:not(.shown) text { visibility: hidden }
.diag.hidel .lbl { cursor: pointer }
.diag[data-mode="ex"] .m-br, .diag[data-mode="br"] .m-ex { display: none }
.tscroll { overflow-x: auto }
.res-table td { overflow-wrap: anywhere }
main:focus { outline: none }
.sec-h .src { white-space: normal; overflow-wrap: anywhere }
</style>
</head>

<script>window.DATA={"units":[{"id":"ch1","n":1,"title":"Infection Preventionists & Basic Principles","ar":"دور أخصائي مكافحة العدوى والمبادئ الأساسية","file":"CH01 - Tagged.pdf","sections":[{"id":"s1","title":"The field and the Infection Preventionist","src":"Slides 2–6","blocks":[{"t":"p","x":"{ipc|Infection prevention and control} is a rapidly growing field. Inpatient hospitals and other healthcare settings require infection control, and other occupations (public health specialists, {epidemiologist|epidemiologists}, lab techs, etc.) also have roles in supporting prevention and control."},{"t":"p","x":"**{ip|Infection preventionists}** are responsible for a set of critical duties that aim to protect three groups: **patients, healthcare workers and the surrounding community**."},{"t":"h","x":"Certification: CBIC → CIC"},{"t":"p","x":"The **{cbic|Certification Board of Infection Control and Epidemiology (CBIC)}** runs the **{cic|Certification Exam in Infection Control (CIC)}**."},{"t":"table","cap":"CIC: 6 core competencies","quiz":true,"head":["#","Core competency"],"rows":[["1","Identification of disease processes"],["2","{surveillance|Surveillance} & epidemiologic investigation"],["3","Preventing/controlling the transmission of infectious diseases"],["4","Employee/Occupational Health"],["5","Management & communication (leadership)"],["6","Education & research"]]},{"t":"h","x":"APIC: 4 domains"},{"t":"p","x":"The **{apic|Association for Professionals in Infection Control & Epidemiology, Inc. (APIC)}** describes core competencies composed of **4 domains**:"},{"t":"table","cap":"APIC core competencies: 4 domains","quiz":true,"head":["Domain","What it includes"],"rows":[["Leadership","Collaboration, followership, program management, critical thinking skills and communication"],["Infection Prevention & Control Competencies","Epidemiology and surveillance, risk assessment, risk reduction and infection prevention"],["Technology","—"],["Performance improvement & Implementation science","—"]]},{"t":"note","k":"key","x":"Don't mix them up: **CIC = 6 core competencies** (CBIC exam). **APIC = 4 domains**."}],"recall":[{"q":"Infection preventionists aim to protect which three groups?","a":"Patients, healthcare workers and the surrounding community."},{"q":"Which other occupations have roles in supporting prevention and control (slide 2)?","a":"Public health specialists, epidemiologists, lab techs, etc."},{"q":"Which board gives the CIC exam?","a":"CBIC: Certification Board of Infection Control and Epidemiology."},{"q":"List the 6 CIC core competencies.","a":"Identification of disease processes · Surveillance & epidemiologic investigation · Preventing/controlling the transmission of infectious diseases · Employee/Occupational Health · Management & communication (leadership) · Education & research."},{"q":"Name the 4 APIC domains.","a":"Leadership · Infection Prevention & Control Competencies · Technology · Performance improvement & Implementation science."}]},{"id":"s2","title":"The chain of transmission","src":"Slides 7–9","blocks":[{"t":"p","x":"Two basic principles are the core of all efforts to prevent and control diseases: **1. the {chain|chain of transmission}** and **2. the {levels|levels of prevention}**."},{"t":"p","x":"The chain of transmission (chain of infection) has **six links** (slide 8). Figure 1.2 (slide 10), \"Breaking the Chain of Transmission\", lists the infection control and prevention strategies for each link."},{"t":"note","k":"added","x":"The CH01 slides do not state \"break one link and the chain stops\". The Ch02 lecture (slide 7) says it for the hand-transmission chain: \"Break it, and the chain stops.\""},{"t":"svg","id":"chain"},{"t":"table","cap":"The six links with the examples on slide 9","quiz":true,"head":["Link","Examples (slide 9)"],"rows":[["1. {agent|Infectious agent}","Bacteria, viruses, fungi, parasites, {prion|prions}"],["2. {reservoir|Reservoir}","{carrier|Asymptomatic carriers}, water, food, animals"],["3. {exit|Portal of exit}","Blood, secretion, excretions"],["4. {modes|Mode of transmission}","Contact, droplet, airborne"],["5. {entry|Portal of entry}","Respiratory tract, GI tract, {nonintact|non-intact skin}, {mucous|mucous membranes}"],["6. {host|Susceptible host}","Age, {immunocompromised}, surgery, medical conditions, unvaccinated"]]},{"t":"order","id":"c1-chain"},{"t":"note","k":"key","x":"Portal of **entry** includes **non-intact** skin and the GI tract. Intact skin is not on the list. The mucosa of the eyes, nose and mouth is a portal of **entry**, not exit."},{"t":"why","q":"Why is \"primary health strategy\" not a link in the chain?","a":"The six links are agent → reservoir → portal of exit → mode of transmission → portal of entry → susceptible host. A prevention strategy is something you use to break a link. It is not a link itself."}],"recall":[{"q":"Name the six links of the chain of transmission in order.","a":"Infectious agent → Reservoir → Portal of exit → Modes of transmission → Portal of entry → Susceptible host."},{"q":"Give the examples of infectious agents on slide 9.","a":"Bacteria, viruses, fungi, parasites, prions."},{"q":"What are the three portals of exit on slide 9?","a":"Blood, secretion, excretions."},{"q":"What are the three modes of transmission on slide 9?","a":"Contact, droplet, airborne."},{"q":"What makes a host susceptible (slide 9)?","a":"Age, immunocompromised, surgery, medical conditions, unvaccinated."}]},{"id":"s3","title":"Breaking the chain","src":"Slide 10 (Figure 1.2)","blocks":[{"t":"p","x":"Figure 1.2 shows the infection control and prevention strategy that breaks **each** link."},{"t":"table","cap":"Breaking the chain of transmission (Figure 1.2)","quiz":true,"head":["Link","Strategies that break it"],"rows":[["Infectious agent","Disinfection · Sterilization · Effective antimicrobial therapy"],["Reservoirs","Water treatment · Proper food storage · Engineering controls · Environmental cleaning/disinfections"],["Portals of exit","Control of excretions and secretions · Proper disposal of waste and contaminated linen · Proper wound care"],["Modes of transmission","Hand hygiene · PPE · Environmental sanitation · Engineering controls · Equipment disinfection/sterilization"],["Portals of entry","Hand hygiene · Aseptic technique · PPE · Engineering controls"],["Susceptible host","Immunization · Identification of high-risk patients · Treatment of pre-existing conditions · Proper nutrition"]]},{"t":"note","k":"warn","x":"Some strategies appear under more than one link. **Hand hygiene, PPE** and **engineering controls** each break more than one link, so the sorter leaves them out. Each sorter item uses the exact wording of Figure 1.2: \"Sterilization\" on its own is under **Infectious agent**, while \"Equipment disinfection/sterilization\" is under **Modes of transmission**."},{"t":"sort","id":"c1-break"},{"t":"note","k":"conflict","x":"In Figure 1.2, disinfection/sterilization is listed under **Infectious agent**, environmental cleaning/disinfection under **Reservoirs**, and equipment disinfection/sterilization under **Modes of transmission**. A past quiz question (Quiz 2, Q12) asks which link \"decontamination, cleaning, disinfection and sterilization\" interrupts and offers only Portal of exit / Reservoir / Portal of entry / Susceptible host. Of those four, only **Reservoir** carries cleaning/disinfection in the figure."}],"recall":[{"q":"Which strategies break the \"susceptible host\" link?","a":"Immunization, identification of high-risk patients, treatment of pre-existing conditions, proper nutrition."},{"q":"Which strategies break the \"portals of exit\" link?","a":"Control of excretions and secretions, proper disposal of waste and contaminated linen, proper wound care."},{"q":"Which strategies break the \"portals of entry\" link?","a":"Hand hygiene, aseptic technique, PPE, engineering controls."},{"q":"Which strategies break the \"infectious agent\" link?","a":"Disinfection, sterilization, effective antimicrobial therapy."}]},{"id":"s4","title":"Levels of prevention","src":"Slide 11","blocks":[{"t":"svg","id":"levels"},{"t":"table","cap":"Levels of prevention","quiz":true,"head":["Level","Target","Example"],"rows":[["{primary|Primary}","Health of individual (before disease: Vaccines lecture, slide 3)","Vaccination"],["{secondary|Secondary}","Newly ill individual","Early screening and treatment"],["{tertiary|Tertiary}","Recovering individual","Rehabilitation"]]},{"t":"chain","items":["Healthy individual","Vaccinated before exposure","Lower risk of disease","= Primary prevention"]},{"t":"chain","items":["Newly ill individual","Early screening and treatment","Reduce the impact of disease","= Secondary prevention"]},{"t":"chain","items":["Recovering individual","Rehabilitation / physical therapy","Maximize function","= Tertiary prevention"]},{"t":"note","k":"added","x":"The flow steps come from the Vaccines lecture, slide 3 (\"prepares immune defenses before exposure\", \"reduces the risk of disease\", \"act before disease occurs\") and Quiz 1 Q4 wording. Slide 11 gives only the target and one example per level."},{"t":"why","q":"Why is vaccination an example of primary prevention?","a":"Vaccination prepares immune defenses before exposure and reduces the risk of disease and serious complications. Primary prevention means acting before disease occurs (Vaccines lecture, slide 3)."},{"t":"sort","id":"c1-levels"}],"recall":[{"q":"Vaccination of a healthy individual is which level of prevention?","a":"Primary prevention."},{"q":"Screening programs to find affected individuals early are which level?","a":"Secondary prevention."},{"q":"Rehabilitation of a recovering individual is which level?","a":"Tertiary prevention."}]}],"orders":[{"id":"c1-chain","sec":"s2","src":"Slide 8","title":"Put the six links of the chain in order","steps":["Infectious agent","Reservoir","Portal of exit","Mode of transmission","Portal of entry","Susceptible host"]}]  techs have roles in supporting prevention and control.","o":["True","False"],"fix":true,"x":"True. Slide 2 calls infection prevention and control a rapidly growing field and says public health specialists, epidemiologists, lab techs, etc. have roles in supporting prevention and control. (slide 2)","src":"Slide 2"},{"id":"c1q25","sec":"s1","q":"Which of the following is one of the 4 APIC domains?","o":["Performance improvement & Implementation science","Employee/Occupational Health","Education & research","Preventing/controlling the transmission of infectious diseases"],"x":"Performance improvement & Implementation science is an APIC domain, with Leadership, Infection Prevention & Control Competencies and Technology (slide 6). The other three options are CIC core competencies (slide 5). (slides 5–6)","src":"Slides 5–6"},{"id":"c1q26","sec":"s1","q":"CIC core competencies are composed of 4 domains, while APIC lists 6 core competencies.","o":["True","False"],"a":1,"fix":true,"x":"False. It is the other way round: the CIC lists 6 core competencies (slide 5), and APIC core competencies are composed of 4 domains (slide 6). (slides 5–6)","src":"Slides 5–6"},{"id":"c1q8","sec":"s2","q":"The two basic principles at the core of all efforts to prevent and control disease are:","o":["The chain of transmission and levels of prevention","Hand hygiene and personal protective equipment (PPE)","Surveillance and education","Isolation of the ill and quarantine of the exposed"],"x":"The two basic principles are 1. the chain of transmission and 2. the levels of prevention. Hand hygiene and PPE are strategies that break links of the chain (Figure 1.2, slide 10); they are not the principles. (slide 7)","src":"Slide 7"},{"id":"c1q9","sec":"s2","q":"Which is the correct order of the chain of transmission?","o":["Agent → reservoir → portal of exit → mode → portal of entry → host","Agent → portal of exit → reservoir → mode → host → portal of entry","Reservoir → agent → mode → portal of exit → portal of entry → host","Host → portal of entry → mode → reservoir → portal of exit → agent"],"x":"Slide 8 lists the links in this order: infectious agent, reservoir, portals of exit, modes of transmission, portals of entry, susceptible host. The portal of exit comes before the mode of transmission, and the portal of entry comes just before the host. (slide 8)","src":"Slide 8","fix":false},{"id":"c1q10","sec":"s2","q":"Asymptomatic carriers, water, food and animals are examples of which link?","o":["Reservoir","Infectious agent","Portal of exit","Susceptible host"],"x":"Slide 9 lists asymptomatic carriers, water, food and animals under Reservoirs. The infectious agents are the germs themselves: bacteria, viruses, fungi, parasites, prions. (slide 9)","src":"Slide 9"},{"id":"c1q11","sec":"s2","q":"Blood, secretion and excretions are examples of:","o":["Portals of exit","Portals of entry","Reservoirs","Modes of transmission"],"x":"Slide 9 lists blood, secretion and excretions under Portals of exit. The portals of entry are the respiratory tract, GI tract, non-intact skin and mucous membranes. (slide 9)","src":"Slide 9"},{"id":"c1q12","sec":"s2","q":"Which is listed on slide 9 as an infectious agent?","o":["Prions","Water","Mucous membranes","Excretions"],"x":"The infectious agents on slide 9 are bacteria, viruses, fungi, parasites and prions. Water is a reservoir, mucous membranes are a portal of entry and excretions are a portal of exit. (slide 9)","src":"Slide 9"},{"id":"c1q13","sec":"s2","q":"Age, surgery, immunocompromise and being unvaccinated describe the:","o":["Susceptible host","Reservoir","Portal of entry","Infectious agent"],"x":"Slide 9 lists age, immunocompromised, surgery, medical conditions and unvaccinated under Susceptible host. The portals of entry are body routes: respiratory tract, GI tract, non-intact skin, mucous membranes. (slide 9)","src":"Slide 9"},{"id":"c1q27","sec":"s2","q":"The reservoir is the first link in the chain of transmission.","o":["True","False"],"a":1,"fix":true,"x":"False. The chain starts with the infectious agent; the reservoir is the second link. (slide 8)","src":"Slide 8"},{"id":"c1q28","sec":"s2","q":"Prions are listed as an example of an infectious agent in the chain of transmission.","o":["True","False"],"fix":true,"x":"True. Slide 9 lists bacteria, viruses, fungi, parasites and prions as infectious agents. (slide 9)","src":"Slide 9"},{"id":"c1q14","sec":"s3","q":"Immunization and proper nutrition break which link?","o":["Susceptible host","Reservoir","Portal of exit","Infectious agent"],"x":"Figure 1.2 lists immunization, identification of high-risk patients, treatment of pre-existing conditions and proper nutrition under Susceptible host. None of these is listed under the reservoir, exit or agent links. (slide 10)","src":"Slide 10"},{"id":"c1q15","sec":"s3","q":"Water treatment and proper food storage break which link?","o":["Reservoir","Portal of entry","Susceptible host","Mode of transmission"],"x":"Figure 1.2 lists water treatment, proper food storage, engineering controls and environmental cleaning/disinfection under Reservoirs. Water and food are themselves reservoir examples on slide 9. (slide 10)","src":"Slide 10"},{"id":"c1q16","sec":"s3","q":"Proper wound care and proper disposal of contaminated linen break which link?","o":["Portal of exit","Portal of entry","Infectious agent","Susceptible host"],"x":"Figure 1.2 lists control of excretions and secretions, proper disposal of waste and contaminated linen, and proper wound care under Portals of exit. The portal of entry strategies are hand hygiene, aseptic technique, PPE and engineering controls. (slide 10)","src":"Slide 10"},{"id":"c1q17","sec":"s3","q":"Which strategy is listed for BOTH the mode of transmission and the portal of entry links?","o":["Hand hygiene","Immunization","Water treatment","Proper wound care"],"x":"Figure 1.2 lists hand hygiene (and also PPE and engineering controls) under both Modes of transmission and Portals of entry. Immunization is a host strategy, water treatment a reservoir strategy and proper wound care a portal of exit strategy. (slide 10)","src":"Slide 10"},{"id":"c1q18","sec":"s3","q":"Aseptic technique is listed under which link in Figure 1.2?","o":["Portals of entry","Reservoirs","Portals of exit","Susceptible host"],"x":"Figure 1.2 lists hand hygiene, aseptic technique, PPE and engineering controls under Portals of entry. The portal of exit strategies are control of excretions and secretions, waste and linen disposal, and wound care. (slide 10)","src":"Slide 10"},{"id":"c1q22","sec":"s3","q":"Disinfection, sterilization and effective antimicrobial therapy break which link?","o":["Infectious agent","Portal of entry","Portal of exit","Susceptible host"],"x":"Figure 1.2 lists disinfection, sterilization and effective antimicrobial therapy under Infectious agent. Environmental cleaning/disinfection is under Reservoirs, and equipment disinfection/sterilization is under Modes of transmission (compare Quiz 2, Q12). (slide 10)","src":"Slide 10"},{"id":"c1q23","sec":"s3","q":"Environmental sanitation and equipment disinfection/sterilization break which link?","o":["Mode of transmission","Portal of exit","Susceptible host","Portal of entry"],"x":"Figure 1.2 lists hand hygiene, PPE, environmental sanitation, engineering controls and equipment disinfection/sterilization under Modes of transmission. Neither strategy appears under the exit, entry or host links. (slide 10)","src":"Slide 10"},{"id":"c1q29","sec":"s3","q":"Proper wound care is a strategy that breaks the portal of entry link.","o":["True","False"],"a":1,"fix":true,"x":"False. Figure 1.2 lists proper wound care under Portals of exit, with control of excretions and secretions and proper disposal of waste and contaminated linen. The portal of entry strategies are hand hygiene, aseptic technique, PPE and engineering controls. (slide 10)","src":"Slide 10"},{"id":"c1q30","sec":"s3","q":"In Figure 1.2, engineering controls are listed under more than one link.","o":["True","False"],"fix":true,"x":"True. Engineering controls appear under Reservoirs, Modes of transmission and Portals of entry. (slide 10)","src":"Slide 10"},{"id":"c1q19","sec":"s4","q":"Early screening and treatment is an example of:","o":["Secondary prevention","Primary prevention","Tertiary prevention","Not a prevention level: the disease has already started"],"x":"Slide 11: secondary prevention targets the newly ill individual, and its example is early screening and treatment. Prevention does not stop once disease starts: secondary and tertiary levels both come after it. (slide 11)","src":"Slide 11"},{"id":"c1q20","sec":"s4","q":"Tertiary prevention targets the:","o":["Recovering individual","Newly ill individual","Healthy individual","Surrounding community"],"x":"Tertiary prevention targets the recovering individual (example: rehabilitation). The newly ill individual is the secondary target, and health of the individual is the primary target. (slide 11)","src":"Slide 11"},{"id":"c1q21","sec":"s4","q":"Rehabilitation is an example of which level of prevention?","o":["Tertiary","Secondary","Primary","Not a prevention level: it happens after illness"],"x":"Slide 11 gives rehabilitation as the example of tertiary prevention, which targets the recovering individual. Secondary prevention (newly ill) uses early screening and treatment instead. (slide 11)","src":"Slide 11"},{"id":"c1q31","sec":"s4","q":"Early screening and treatment is an example of primary prevention.","o":["True","False"],"a":1,"fix":true,"x":"False. Slide 11 gives early screening and treatment as the example of secondary prevention (newly ill individual). The primary prevention example is vaccination. (slide 11)","src":"Slide 11"},{"id":"c1q32","sec":"s4","q":"Secondary prevention targets the newly ill individual.","o":["True","False"],"fix":true,"x":"True. Slide 11: secondary prevention targets the newly ill individual; its example is early screening and treatment. (slide 11)","src":"Slide 11"},{"id":"p1q1","sec":"s2","q":"The germs (virus/bacteria) that enter the body by coming into contact with the mucosa of the eyes, nose and mouth are called \"portal of exit\".","o":["True","False"],"a":1,"fix":true,"x":"False. Mucous membranes are a portal of ENTRY. The portals of exit are blood, secretion and excretions. (slide 9)","src":"Slide 9","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":1}},{"id":"p1q4","sec":"s4","q":"Which of the following is an example of a secondary prevention strategy?","o":["Screening programs to identify affected individuals to reduce the impact of disease","Give healthy awareness and some advice to public","Vaccination of a healthy individual","Physical therapy to maximize limb function after an infection"],"x":"Secondary prevention targets the newly ill individual, and its example is early screening and treatment, which matches screening programs. Vaccination is primary, and physical therapy after an infection matches tertiary (rehabilitation). (slide 11)","src":"Slide 11","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":4}},{"id":"p1q5","sec":"s2","q":"Which of the following is NOT a potential portal of entry for a pathogen?","o":["Intact skin","Respiratory tract","Mucous membranes in the nostrils","Gastrointestinal tract"],"x":"Slide 9 lists the respiratory tract, GI tract, NON-intact skin and mucous membranes as portals of entry. Intact skin is not on the list. (slide 9)","src":"Slide 9","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":5}},{"id":"p1q7","sec":"s4","q":"Vaccination of a healthy individual is an example of ______.","o":["a primary prevention strategy","a treatment of injured person","a secondary prevention strategy","post-traumatic treatment strategy"],"x":"Primary prevention targets the health of the individual, and its example is vaccination. Secondary prevention is early screening and treatment of the newly ill. (slide 11)","src":"Slide 11","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":7}},{"id":"p1q8","sec":"s2","q":"Because of digestive enzymes, the GI tract does not serve as a portal of entry.","o":["True","False"],"a":1,"fix":true,"x":"False. Slide 9 lists the GI tract as a portal of entry; the slide gives no exception for digestive enzymes. (slide 9)","src":"Slide 9","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":8}},{"id":"p2q12","sec":"s3","q":"Which link in the chain of infection is interrupted by decontamination, cleaning, disinfection, and sterilization?","o":["Reservoir","Portal of exit","Portal of entry","Susceptible host"],"x":"Figure 1.2 lists environmental cleaning/disinfection under Reservoirs; none of the other three options lists cleaning or disinfection. Figure 1.2 also lists disinfection/sterilization under Infectious agent, which is not an option here. (slide 10)","src":"Slide 10","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":12}},{"id":"p2q13","sec":"s2","q":"Intact skin is an/a ______ barrier for microorganisms.","o":["effective","ineffective","reflective","sensitive"],"x":"Slide 9 lists only NON-intact skin as a portal of entry, so intact skin acts as an effective barrier (inferred from slide 9).","src":"Slide 9","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":13}},{"id":"p1q10","sec":"s2","q":"Which of the following is NOT a link in the chain of transmission?","o":["Primary health strategy","Modes of transmission","Infectious agent","Susceptible host"],"x":"The six links are infectious agent, reservoir, portals of exit, modes of transmission, portals of entry and susceptible host. A prevention strategy is used to break a link (Figure 1.2); it is not a link. (slide 8)","src":"Slide 8","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":10}}],"cards":[{"sec":"s1","f":"Infection preventionists protect…","b":"Patients, healthcare workers and the surrounding community.","src":"Slide 3"},{"sec":"s1","f":"Which other occupations support infection prevention and control?","b":"Public health specialists, epidemiologists, lab techs, etc.","src":"Slide 2"},{"sec":"s1","f":"CBIC → ?","b":"Certification Exam in Infection Control (CIC). CBIC = Certification Board of Infection Control and Epidemiology.","src":"Slide 4"},{"sec":"s1","f":"CIC core competencies: how many?","b":"6 (APIC has 4 domains instead).","src":"Slides 5–6"},{"sec":"s1","f":"CIC core competencies 1–3?","b":"1. Identification of disease processes · 2. Surveillance & epidemiologic investigation · 3. Preventing/controlling the transmission of infectious diseases.","src":"Slide 5"},{"sec":"s1","f":"CIC core competencies 4–6?","b":"4. Employee/Occupational Health · 5. Management & communication (leadership) · 6. Education & research.","src":"Slide 5"},{"sec":"s1","f":"APIC core competencies: how many domains, and what are they?","b":"4: Leadership · Infection Prevention & Control Competencies · Technology · Performance improvement & Implementation science.","src":"Slide 6"},{"sec":"s2","f":"Two basic principles of infection prevention","b":"1. Chain of transmission · 2. Levels of prevention.","src":"Slide 7"},{"sec":"s2","f":"Chain of transmission: how many links, and what are links 1–3?","b":"6 links. 1. Infectious agent → 2. Reservoir → 3. Portal of exit.","src":"Slide 8"},{"sec":"s2","f":"Chain of transmission: links 4–6?","b":"4. Mode of transmission → 5. Portal of entry → 6. Susceptible host.","src":"Slide 8"},{"sec":"s2","f":"Infectious agents (examples): bacteria, viruses + which 3 more?","b":"Fungi, parasites, prions.","src":"Slide 9"},{"sec":"s2","f":"Reservoirs (examples)","b":"Asymptomatic carriers, water, food, animals.","src":"Slide 9"},{"sec":"s2","f":"Portals of exit (examples)","b":"Blood, secretion, excretions.","src":"Slide 9"},{"sec":"s2","f":"Modes of transmission (examples)","b":"Contact, droplet, airborne.","src":"Slide 9"},{"sec":"s2","f":"Portals of entry (examples)","b":"Respiratory tract, GI tract, non-intact skin, mucous membranes.","src":"Slide 9"},{"sec":"s2","f":"Susceptible host factors: how many are on slide 9?","b":"5.","src":"Slide 9"},{"sec":"s2","f":"Susceptible host factors: age, immunocompromised + which 3 more?","b":"Surgery, medical conditions, unvaccinated.","src":"Slide 9"},{"sec":"s3","f":"Break the infectious agent link with…","b":"Disinfection, sterilization, effective antimicrobial therapy.","src":"Slide 10"},{"sec":"s3","f":"Break the reservoir link with…","b":"Water treatment, proper food storage, engineering controls, environmental cleaning/disinfection.","src":"Slide 10"},{"sec":"s3","f":"Break the portal of exit link with…","b":"Control of excretions and secretions, proper disposal of waste and contaminated linen, proper wound care.","src":"Slide 10"},{"sec":"s3","f":"Which 3 strategies are listed under BOTH modes of transmission and portals of entry?","b":"Hand hygiene, PPE, engineering controls.","src":"Slide 10"},{"sec":"s3","f":"Break the mode of transmission link with… hand hygiene, PPE, engineering controls + which 2 more?","b":"Environmental sanitation, equipment disinfection/sterilization.","src":"Slide 10"},{"sec":"s3","f":"Break the portal of entry link with…","b":"Hand hygiene, aseptic technique, PPE, engineering controls.","src":"Slide 10"},{"sec":"s3","f":"Break the susceptible host link with…","b":"Immunization, identification of high-risk patients, treatment of pre-existing conditions, proper nutrition.","src":"Slide 10"},{"sec":"s4","f":"Primary prevention: target and example?","b":"Health of individual · Vaccination.","src":"Slide 11"},{"sec":"s4","f":"Secondary prevention: target and example?","b":"Newly ill individual · Early screening and treatment.","src":"Slide 11"},{"sec":"s4","f":"Tertiary prevention: target and example?","b":"Recovering individual · Rehabilitation.","src":"Slide 11"}]},{"id":"ch2","n":2,"title":"Hand Hygiene","ar":"نظافة اليدين","file":"EMS313 Ch02(1).pdf","objSrc":"Slide 2","objectives":["Explain why hand hygiene is essential in infection prevention and EMS practice.","Differentiate between common hand hygiene agents.","Identify the advantages and limitations of alcohol-based hand rub and soap and water.","Explain when and how appropriate hand hygiene should be performed.","Differentiate between transient and resident skin flora.","Identify situations in EMS that require hand hygiene.","Explain why gloves do not replace hand hygiene.","Apply hand-hygiene principles to common paramedic scenarios."],"sections":[{"id":"s1","title":"Why hand hygiene comes first","src":"Slides 3–5","blocks":[{"t":"p","x":"{hh|Hand hygiene} is **the most effective way to prevent the spread of infection**. It is recommended by the **CDC (2002)** and the **WHO (2009)** as the first line of infection prevention."},{"t":"ul","items":["The chapter follows **Category {ia|IA} and {ib|IB}** recommendations, the strongest level.","IA: strongly recommended, supported by strong studies. IB: strongly recommended, supported by some studies and strong reasoning.","Both are **equally binding**. The letter shows the strength of the evidence, not the strength of the rule.","Hand hygiene protects **two people: the patient and the provider**."]},{"t":"stat","n":"40%","x":"average hand hygiene compliance of healthcare workers in observational studies (range 5% to 81%)"},{"t":"h","x":"Hands touch everything"},{"t":"ul","items":["Hands touch the patient, the equipment, and you. Every contact can pick up or leave microorganisms.","Microorganisms **survive on hands for several minutes**, long enough to reach the next surface or patient.","**Moisture increases transfer**: wet hands and wet skin areas move more microorganisms than dry ones.","**More contacts per hour = more risk**: busy shifts create more opportunities and lower compliance."]},{"t":"note","k":"ems","x":"A patient with a chest infection coughs inside the ambulance for 20 minutes. Droplets land on the rails, the monitor, the oxygen tubing and your hands. Every surface you touch afterwards becomes part of the transmission route."},{"t":"h","x":"1847: General Hospital of Vienna"},{"t":"table","cap":"1847 hand-washing intervention","head":["Doctors' ward","Midwives' ward"],"rows":[["Doctors came directly from the autopsy room to deliver babies → **high death rate** of mothers after childbirth.","Midwives did not perform autopsies → **much lower death rate**."]]},{"t":"p","x":"**The intervention:** hand washing with an **antiseptic solution** was made compulsory before entering the ward, and deaths fell sharply. This was the **first intervention trial comparing an antiseptic against plain soap**. The evidence has been clear for more than 170 years. The difficulty is **behaviour, not knowledge**."}],"recall":[{"q":"Which two organizations recommend hand hygiene as the first line of infection prevention, and in which years?","a":"CDC (2002) and WHO (2009)."},{"q":"What is the difference between Category IA and IB?","a":"IA: supported by strong studies. IB: supported by some studies and strong reasoning. Both are strongly recommended and equally binding."},{"q":"Average hand hygiene compliance in observational studies?","a":"40% (range 5% to 81%)."},{"q":"What did the 1847 Vienna intervention make compulsory?","a":"Hand washing with an antiseptic solution before entering the ward. Deaths fell sharply."}]},{"id":"s2","title":"Skin flora and how hands carry germs","src":"Slides 6–7","blocks":[{"t":"table","cap":"Transient vs resident flora (don't mix them up)","quiz":true,"head":["","{transient|Transient flora}","{resident|Resident flora}"],"rows":[["Where","Surface layers of the skin","Attached to deeper layers"],["Removed by hand hygiene?","Yes, easily removed by hand washing","Difficult to remove"],["Link to {hai|healthcare-associated infection}","Most often the cause","Less often the cause"],["In EMS terms","Picked up from the last patient, the stretcher or the monitor","Your own permanent skin bacteria; normal and protective"]]},{"t":"note","k":"key","x":"Transient flora is **easy to remove and the most dangerous**."},{"t":"why","q":"Transient flora is easy to remove. Why is it still the most dangerous?","a":"It sits on the surface layers and is picked up from the last patient, the stretcher or the monitor, so it is **most often the cause** of healthcare-associated infection. Resident flora is your own permanent, normal and protective skin bacteria and is less often the cause (slide 6)."},{"t":"p","x":"**What increases transfer of transient flora?** The type of microorganism · the number present · the level of moisture. Highest-risk body areas for colonisation: **perineal and groin area**, then armpits, trunk and upper limbs."},{"t":"h","x":"Five steps for transmission through hands"},{"t":"order","id":"c2-hands"},{"t":"chain","items":["Microorganisms on patient/surfaces/equipment","Transfer to provider's hands","Survive on hands for minutes","Hand hygiene missed, done badly or with wrong agent","Next patient contaminated"]},{"t":"note","k":"key","x":"**Step 4 is the only step the provider fully controls.** Break it, and the chain stops."}],"recall":[{"q":"Which flora is most often the cause of healthcare-associated infection?","a":"Transient flora: on the surface layers, easily removed."},{"q":"Three things that increase transfer of transient flora?","a":"Type of microorganism, number present, level of moisture."},{"q":"Which of the 5 transmission steps does the provider fully control?","a":"Step 4: hand hygiene (missed, done badly or with the wrong agent)."}]},{"id":"s3","title":"Methods and agents","src":"Slides 8–10, 13–14","blocks":[{"t":"table","cap":"Hand hygiene is one term with several methods","quiz":true,"head":["Method","What it is","Effect"],"rows":[["{handwash|Hand washing}","Plain (non-antimicrobial) soap and water","Removes dirt and transient flora; **does not kill**"],["{antisepticwash|Antiseptic hand wash}","Soap containing an antiseptic agent, with water","Removes and kills"],["{handrub|Antiseptic hand rub}","Alcohol-based product rubbed on all surfaces until dry. No water","Fast, kills, no sink needed"],["{surgical|Surgical hand antisepsis}","Antiseptic wash or rub of hands **and forearms** before sterile procedures","Removes transient flora and **reduces resident flora**"]]},{"t":"note","k":"warn","x":"**{soiled|Visibly soiled} hands** (dirt you can see, or blood/body fluids such as faeces or urine) **need soap and water. An alcohol rub is not enough.**"},{"t":"p","x":"Hand-hygiene agents differ in **effectiveness, safety, {residual|residual activity} and skin tolerance**."},{"t":"h","x":"Plain soap"},{"t":"twocol","a":{"h":"What it does","items":["Works by **detergent (cleaning) action, not by killing**","Removes dirt, soil and organic material such as blood","Can remove transient flora","The correct choice when hands are visibly soiled"]},"b":{"h":"Limitations","items":["Little or no antimicrobial activity","May fail to remove pathogens","Repeated washing can paradoxically **increase** bacterial counts on the skin","Skin irritation and dryness with frequent use"]}},{"t":"note","k":"ems","x":"A trauma patient bleeds onto your gloves and wrist. After removing gloves, use soap and water first. The soap will not kill what is there, but it removes the blood, and blood must be removed before any antiseptic can work properly."},{"t":"h","x":"Alcohol-based hand rub: how it works"},{"t":"chain","items":["Ethanol or isopropanol","{denature|Denatures} (breaks down) microbial proteins","Needs water for the reaction","Effective at 60%–95%"]},{"t":"ul","items":["Effective concentration: **60% to 95%** alcohol mixed with water.","**Above 95% is LESS effective** because the reaction needs water. Without water, alcohol evaporates before it can denature proteins.","The most effective agent for routine hand hygiene by healthcare personnel.","Kills (laboratory data): gram-positive and gram-negative bacteria including {mdro|multidrug-resistant organisms}, Mycobacterium tuberculosis, many fungi, most {enveloped|enveloped viruses} (influenza, HIV, herpes simplex).","Hepatitis B and C are enveloped, but the evidence at 60–70% alcohol is less certain."]},{"t":"why","q":"Which is stronger for hand hygiene: 70% alcohol or 99% alcohol? Why?","a":"70%. Above 95% is less effective because the reaction needs water. Without water, alcohol evaporates before it can denature proteins."},{"t":"h","x":"Other hand hygiene agents"},{"t":"table","cap":"Other agents (1 of 2)","quiz":true,"head":["Agent","Advantages","Disadvantages","FDA / cautions"],"rows":[["{chg|Chlorhexidine gluconate (CHG)}","Works well against gram-positive; effective against enveloped viruses; **substantial residual activity**; minimally affected by organic material such as blood","Less effective against gram-negative, fungi, non-enveloped viruses; minimally effective against M. tuberculosis; does not kill spores; inactivated by natural soaps and hand creams (anionic emulsifying agents)","Conjunctivitis and severe corneal damage reported with 1% chlorhexidine; keep away from the eyes"],["{pcmx|Chloroxylenol (PCMX)}","Good activity against gram-negative, mycobacteria and certain viruses; only minimally affected by organic matter","Contradictory data; needs a longer time to work; less residual activity than chlorhexidine; neutralised by non-ionic surfactants","FDA: not enough information to classify as safe and effective"],["{hexachlorophene|Hexachlorophene}","{bacteriostatic|Bacteriostatic}; good activity against S. aureus; cumulative effect with repeated use; residual activity","Less effective against gram-negative, fungi and mycobacteria; only modestly effective after a single use; toxic, absorbed through the skin","FDA: not generally recognised as safe and effective as an antiseptic hand wash, especially for infant bathing"]]},{"t":"table","cap":"Other agents (2 of 2)","quiz":true,"head":["Agent","Advantages","Disadvantages","FDA / notes"],"rows":[["{iodophor|Iodine and iodophors}","Effective against gram-positive and gram-negative, some spore-forming bacteria, mycobacteria, viruses and fungi; most formulations contain **7.5% to 10% povidone-iodine**","Iodine causes skin irritation and discolouration; iodophor effectiveness depends on pH, temperature, exposure time and inorganic material","Widely used; iodophors are less irritating than free iodine"],["{quats|Quaternary ammonium compounds}","More effective against gram-negative; some activity against lipophilic viruses","Less effective against gram-positive; minimally effective against mycobacteria and fungi; decreased by organic matter such as blood; not compatible with anionic detergents","FDA: several compounds have insufficient data to be classified as safe and effective for an antiseptic hand wash"],["{triclosan|Triclosan}","Non-ionic, colourless, **0.2% to 2%** in antimicrobial soaps; most effective against gram-positive including MRSA; reasonably effective against mycobacteria and Candida; some persistent activity; not substantially affected by organic matter","Less effective against gram-negative, especially Pseudomonas aeruginosa; affected by pH, surfactants, emollients, humectants and ionic properties","FDA 1994: insufficient data to classify as safe and effective; FDA inquiry into safety and efficacy"]]},{"t":"p","x":"**How to compare any agent:** what is its spectrum, how fast does it act, does it keep working after application (residual activity), and does blood or organic material stop it?"},{"t":"note","k":"ems","x":"For EMS practice (added for EMS 313 in the lecture): **chlorhexidine is the agent to remember, for its residual activity**. Povidone-iodine is used for skin preparation before injections and needs contact time; wiping and injecting immediately wastes it."}],"recall":[{"q":"Which method removes dirt and transient flora but does not kill?","a":"Hand washing with plain (non-antimicrobial) soap and water."},{"q":"Effective alcohol concentration range, and why is >95% worse?","a":"60%–95%. The reaction needs water; above 95% alcohol evaporates before it denatures proteins."},{"q":"Which agent is \"the one to remember\" for EMS and why?","a":"Chlorhexidine (CHG), for its residual (persistent) activity."},{"q":"Which agents have residual/persistent activity? Which has none?","a":"CHG (substantial), hexachlorophene, triclosan (some), PCMX (less than CHG). Alcohol has none."},{"q":"Povidone-iodine concentration in most hand-hygiene formulations?","a":"7.5% to 10%."},{"q":"Which enveloped viruses have less certain evidence at 60–70% alcohol?","a":"Hepatitis B and C (slide 10)."}]},{"id":"s4","title":"Alcohol rub vs soap and water","src":"Slides 11–12, 15","blocks":[{"t":"twocol","a":{"h":"Alcohol: advantages","items":["Fast: works in seconds","More effective than other agents for routine hand hygiene","Best option against multidrug-resistant organisms","Covers gram-positive, gram-negative, fungi and TB","No sink needed, so it suits the field"]},"b":{"h":"Alcohol: limitations","items":["Poor against **bacterial spores ({cdiff|C. difficile})**, protozoan cysts and **{nonenveloped|non-enveloped viruses}** (e.g. {norovirus|norovirus})","No persistent or residual activity: the effect ends when hands are dry","Less effective when blood or organic material is present","Flammable and volatile, a storage issue in a hot ambulance"]}},{"t":"note","k":"key","x":"**Three situations where alcohol fails:** visibly soiled hands · C. difficile · non-enveloped viruses such as norovirus. In all three, use **soap and water**."},{"t":"table","cap":"Alcohol-based hand rub vs soap and water: not interchangeable","quiz":true,"head":["","Alcohol-based hand rub","Soap and water"],"rows":[["Speed","20 to 30 seconds; no sink needed","40 to 60 seconds; needs sink and towels"],["Kills or removes?","Kills most bacteria, fungi, enveloped viruses","Removes mechanically; plain soap does not kill"],["Spores and non-enveloped viruses","Poor (C. difficile, norovirus)","Removed by washing and rinsing"],["Visibly soiled hands","Not effective; blood reduces activity","Required"],["Residual activity","None","None (plain soap)"],["Skin","Less irritating than frequent washing","Dryness and irritation with repeated use"],["In EMS","Between routine patient contacts; at the point of care; pocket bottle","After blood or body-fluid contact; diarrhoea calls; when hands are visibly dirty"]]},{"t":"note","k":"key","x":"**Default in the field: alcohol-based hand rub.** Switch to soap and water when hands are visibly soiled, or after C. difficile or norovirus exposure."},{"t":"sort","id":"c2-method"}],"recall":[{"q":"Name the three situations where alcohol fails.","a":"Visibly soiled hands, C. difficile (spores), non-enveloped viruses such as norovirus."},{"q":"How long does a hand rub take vs a hand wash?","a":"Rub 20–30 seconds; wash 40–60 seconds."},{"q":"Does alcohol have residual activity?","a":"No. The effect ends when the hands are dry."}]},{"id":"s5","title":"Technique: the six rubbing steps","src":"Slides 16–18","blocks":[{"t":"p","x":"Hand rub and hand wash share the **same six rubbing steps (steps 2 to 7)** from the WHO \"How to handrub / How to handwash\" posters."},{"t":"twocol","a":{"h":"Alcohol-based hand rub · 20–30 s","items":["1a, 1b: Apply a palmful of the product in a cupped hand and cover all surfaces","2 to 7: The six rubbing steps, then keep rubbing until the hands are dry"]},"b":{"h":"Soap and water · 40–60 s","items":["0, 1: Wet hands with water, then apply enough soap to cover all surfaces","2 to 7: The same six rubbing steps","8, 9, 10: Rinse with water, dry thoroughly with a single-use towel, use the towel to turn off the tap"]}},{"t":"order","id":"c2-six"},{"t":"order","id":"c2-wash"},{"t":"twocol","a":{"h":"Most often missed","items":["Fingertips and under the nails (step 7)","Thumbs (step 6)","Between the fingers (steps 3 and 4)","Backs of the hands and wrists"]},"b":{"h":"Hand rub: two rules","items":["**If your hands are dry in 10 seconds, you used too little.**","Never wipe or shake the hands to speed up drying. The product must finish working."]}},{"t":"p","x":"**Why steps 9 and 10 matter (handwash):** wet hands transfer far more microorganisms than dry hands, so dry thoroughly with a single-use towel. You touched the tap with contaminated hands before washing, so use the towel to turn it off or the contamination comes back."},{"t":"note","k":"conflict","x":"**The numbers you will see:** hand rub **20–30 seconds, until dry (WHO)**; handwash **40–60 seconds** for the whole procedure (WHO). **At least 15 seconds** of rubbing is the **CDC minimum** quoted in the source deck (slide 17). Slide 29 gives the fix for rubbing too fast as \"about 30 seconds\"."},{"t":"h","x":"Spot the mistake (slide 18)"},{"t":"mistakes","intro":"Ahmed finishes a trauma call. There is blood on his gloves. Tap each line that contains a hand-hygiene error.","lines":[["He removes the gloves and wipes his hands with an alcohol wipe.",true,"Blood = visibly soiled → soap and water first; alcohol does not work through blood."],["He dries his hands on his uniform trousers.",true,"Dry thoroughly with a single-use towel."],["He picks up his personal phone and writes the patient report.",true,"Phone stays out of the patient compartment, or is disinfected after every patient."],["At the next call he puts on new gloves and begins the assessment.",true,"Hand hygiene is needed before putting on gloves (glove sequence)."],["After the shift he refills the half-empty hand-rub bottle in the ambulance drawer.",true,"Never top up a partly full dispenser: contamination risk. Use pre-filled bottles."]]}],"recall":[{"q":"Which areas are most often missed?","a":"Fingertips/under the nails (step 7), thumbs (step 6), between the fingers (steps 3–4), backs of hands and wrists."},{"q":"Your hands are dry 10 seconds after a rub. What does that mean?","a":"You used too little product."},{"q":"Why use the towel to turn off the tap?","a":"You touched the tap with contaminated hands before washing; otherwise the contamination comes back."}]},{"id":"s6","title":"Surgical hand antisepsis","src":"Slides 19–20","blocks":[{"t":"p","x":"**{surgical|Surgical hand antisepsis}** is pre-operative cleansing of the **hands and forearms** with antiseptic agents. It **removes transient flora and reduces resident flora**."},{"t":"ul","items":["Most effective products: formulations of **60% to 95% alcohol alone**; **50% to 95% alcohol combined** with a quaternary ammonium compound, hexachlorophene or chlorhexidine gluconate; waterless, alcohol-based rubs.","**Why add chlorhexidine?** Alcohol kills fast but stops working when dry. A long operation inside a warm, moist glove lets resident flora regrow. Chlorhexidine keeps working for hours.","Before putting on sterile gloves, use an **antimicrobial soap or an alcohol-based hand rub with persistent activity** [CDC and WHO, IB]."]},{"t":"table","cap":"Key recommendations","quiz":true,"head":["Recommendation","Source"],"rows":[["Artificial nails are prohibited in settings that require surgical hand antisepsis","WHO IB"],["Brushes are not recommended","WHO IB"],["Scrub hands and forearms for the length of time suggested by the manufacturer","CDC and WHO IB"],["Long scrub times are not necessary","CDC and WHO IB"],["Before an alcohol-based surgical scrub with persistent activity, prewash hands and forearms with non-antimicrobial soap, then dry them","CDC IB"],["Use enough alcohol-based hand rub to keep hands and forearms wet throughout the procedure","WHO IB"],["After applying the alcohol-based product, dry hands and forearms thoroughly before putting on sterile gloves","CDC and WHO IB"],["Use an antimicrobial soap or alcohol-based hand rub with persistent activity before putting on sterile gloves","CDC and WHO IB"]]},{"t":"chain","items":["Brushes / long scrubs","Damage the skin","Bring resident flora up from deeper layers","Bacterial count rises instead of falling"]},{"t":"note","k":"key","x":"The product's **contact time** does the work, not scrubbing."}],"recall":[{"q":"Surgical hand antisepsis covers which body areas, and what does it do to flora?","a":"Hands and forearms. Removes transient flora and reduces resident flora."},{"q":"Why add chlorhexidine to a surgical rub?","a":"Alcohol stops working when dry; resident flora regrows in a warm, moist glove; chlorhexidine keeps working for hours."},{"q":"Why are brushes and long scrubs not recommended?","a":"They damage skin and bring resident flora up from deeper layers, so the count rises."}]},{"id":"s7","title":"Choosing products, and gloves","src":"Slides 21–23","blocks":[{"t":"table","cap":"Choose an agent that staff will use","quiz":true,"head":["Rule","Why","Category"],"rows":[["Low potential for irritation","Even when used many times per shift","IB"],["Ask the staff","Feel, fragrance and skin tolerance decide whether people use it","IB"],["Cost is not the main factor","A cheap product that dries the skin lowers compliance and costs more","CDC IB · WHO II"],["**Never top up a partly full dispenser**","Contamination risk. Use pre-filled bags or bottles","IA"],["Provide hand lotion or cream","Skin protection is part of infection control, but the cream must be compatible with the agent","IA"],["Teach skin care","Education programmes should include how to reduce irritation and damage","IB"]]},{"t":"p","x":"Product compatibility: ask the manufacturer about the risk of product contamination [WHO IB] and about using hand lotions, creams or alcohol-based antiseptics together [CDC IB, WHO II]. EMS: a pocket-sized bottle per provider; bottles are never refilled in the ambulance drawer; a compatible hand cream is stocked at the station in dry, hot weather."},{"t":"h","x":"Gloves do not replace hand hygiene"},{"t":"order","id":"c2-gloves"},{"t":"twocol","a":{"h":"Why gloves are not enough","items":["Gloves can have tiny holes you cannot see","Hands become contaminated while removing gloves","The warm, moist space inside a glove lets bacteria multiply on your skin","**WHO Category IB: the use of gloves does not reduce the need for hand hygiene**"]},"b":{"h":"Four glove rules (CDC and WHO, IB)","items":["Remove gloves after caring for the patient","Dispose of gloves after use","**Never use the same pair for more than one patient**","**Never wash gloves for re-use**","Also: no artificial nails or extenders when in direct contact with patients (IB)"]}}],"recall":[{"q":"What is the correct glove sequence?","a":"Hand hygiene → put on gloves → patient care → remove gloves → hand hygiene."},{"q":"Give three reasons gloves are not enough.","a":"Tiny invisible holes; hands contaminated during removal; warm moist glove lets bacteria multiply."},{"q":"What is the rule about a partly full dispenser, and its category?","a":"Never top it up (contamination risk); use pre-filled bags/bottles. Category IA."}]},{"id":"s8","title":"The ambulance, compliance and the five moments","src":"Slides 24–28","blocks":[{"t":"p","x":"**Indirect transmission in the ambulance:** Patient → paramedic hand → monitor → paramedic hand → next patient."},{"t":"note","k":"added","x":"In the lecture, slide 24 (the contaminated ambulance) is marked \"ADDED FOR EMS 313 · NOT IN ORIGINAL CHAPTER 2\". The point-of-care box on slide 26 and the Before/After EMS lists on slide 27 are also marked as added for EMS 313; the WHO five moments are from the original chapter."},{"t":"p","x":"**{hightouch|High-touch surfaces}:** monitor and cables · stretcher rails and straps · BP cuff and stethoscope · radio and tablet · door handles and grab rails · your personal phone. Consecutive patients in the same vehicle share every surface you touched between them, unless the surfaces were cleaned and your hands were too."},{"t":"note","k":"ems","x":"**The phone problem:** a phone touched during patient care is rarely cleaned and goes home with you. Keep it out of the patient compartment, or disinfect it after every patient."},{"t":"h","x":"Why compliance fails (average 40%, range 5–81%)"},{"t":"table","cap":"Barriers","quiz":true,"head":["Type","Barriers"],"rows":[["System","Sinks far away or too few · lack of soap and paper towels · lack of time · understaffed or overcrowded wards · agents that irritate and dry the skin"],["Beliefs","\"Gloves are enough\" · patient seen as low risk · lack of knowledge of guidelines · forgetfulness · scepticism about the value · disagreement with the policy"],["Culture","No role model among peers or supervisors · no feedback · no institutional priority · no active promotion · no safety climate"]]},{"t":"ul","items":["Compliance is **lower before patient contact than after**. Providers protect themselves more than the patient.","Compliance **falls as the number of opportunities per hour rises**, which is when it matters most.","Compliance is **lower at night** than by day, **lower among physicians** than nurses, and **lower after a clean task** than a dirty one."]},{"t":"why","q":"Why is compliance lower before patient contact than after?","a":"Providers protect themselves more than the patient (slide 25). Slide 28's \"right timing\" rule answers this: hand hygiene **before as much as after**, five moments, every call."},{"t":"h","x":"What improves compliance"},{"t":"table","cap":"Improvement strategies","quiz":true,"head":["Strategy","Detail","Category"],"rows":[["Monitor and give feedback","Monitor compliance with hand-hygiene practices and policies and feed results back to staff","CDC and WHO IA"],["Institutional priority","Administrative support and funding","CDC and WHO IB"],["Education that targets the barriers","Address the factors that influence compliance, not only the products","WHO IA"],["Multimodal, with senior executives","Multi-faceted, multimodal, with support from senior executives","WHO IA"],["Multidisciplinary programmes","Include easy access to alcohol-based hand rub","CDC IA"],["Product where care happens","Hand rub at the room entrance, bedside, pocket-si
