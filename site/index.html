 4","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":14}},{"id":"p2q15","sec":"s4","q":"Which type of transmission-based precautions should be implemented for patients infected with influenza virus, Neisseria meningitidis and group A Streptococcus (invasive disease)?","o":["Droplet Precautions","Standard Precautions","Contact Precautions","Airborne Precautions"],"x":"Slides 5 and 16.","src":"Slides 5, 16","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":15}}],"cards":[{"sec":"s1","f":"Direct vs indirect contact","b":"Direct: skin to skin. Indirect: through a rail, cuff, cable, or a hand that touched them."},{"sec":"s1","f":"Droplet: size, distance, mask","b":">5 µm · about 2 m then falls · surgical mask."},{"sec":"s1","f":"Airborne: size, distance, mask","b":"≤5 µm droplet nuclei · far, stays suspended for hours · fit-tested N95."},{"sec":"s1","f":"Airborne diseases (Box 3.1)","b":"Tuberculosis, measles (rubeola), chickenpox (varicella)."},{"sec":"s1","f":"Droplet examples (slide 5)","b":"Pertussis, influenza, rhinovirus, SARS-CoV, group A strep, N. meningitidis."},{"sec":"s2","f":"Donning order","b":"Hand hygiene → gown → mask/respirator → goggles/face shield → gloves (cuffs over sleeves)."},{"sec":"s2","f":"Doffing order","b":"Gloves → goggles/face shield → gown → mask/respirator (by ties) → hand hygiene."},{"sec":"s2","f":"When do you put PPE on / take it off?","b":"On: whenever blood/body fluids could reach you. Off: before leaving the patient's room (ambulance: at the compartment door)."},{"sec":"s3","f":"Gloves: which materials?","b":"Latex or nitrile, never vinyl. New pair for every patient; HH before and after."},{"sec":"s3","f":"Gown: when, and two rules people miss","b":"When clothes could be soiled / uncontained secretions. Don't gown just to enter a high-risk unit; take it off + HH before leaving."},{"sec":"s3","f":"Aerosol-generating procedures (slide 12)","b":"Bronchoscopy, suctioning the airway, endotracheal intubation → full protection."},{"sec":"s3","f":"Surgical vs procedure vs N95","b":"Surgical: FDA-cleared, fluid-resistant, droplets+splashes. Procedure: not FDA-cleared, droplet barrier. N95: fit-tested, airborne (TB, measles, chickenpox)."},{"sec":"s4","f":"Standard precautions","b":"Every patient, every time. All blood, body fluids, secretions, excretions (except sweat), broken skin, mucous membranes = infectious."},{"sec":"s4","f":"Contact precautions","b":"Single room if possible; gown + gloves on entry; equipment stays/cleaned; room cleaned at least daily. Draining wounds, faecal incontinence. Category IB."},{"sec":"s4","f":"Droplet precautions","b":"Surgical mask on you; surgical mask on patient when moved + cough etiquette; private room preferred; no special air handling."},{"sec":"s4","f":"Airborne precautions","b":"Fit-tested N95+; mask on patient; negative-pressure AIIR (HEPA/outside); non-immune staff away from measles, chickenpox, smallpox."},{"sec":"s5","f":"Isolation vs quarantine","b":"Isolation: ill/diagnosed, in hospital during treatment, while infectious. Quarantine: exposed, may become ill, contact limited until clear."}]},{"id":"ch4","n":4,"title":"Cleaning, Disinfection & Sterilization","ar":"التنظيف والتطهير والتعقيم","file":"EMS313 Ch04(1).pdf","sections":[{"id":"s1","title":"Key definitions","src":"Slides 3–6","blocks":[{"t":"p","x":"Used equipment can carry pathogens to the next patient, and hands move pathogens between equipment and people. **Cleaning removes contamination. Disinfection kills remaining susceptible organisms.** Include stretcher rails, monitor controls, cables and door handles."},{"t":"table","cap":"Key definitions (don't mix them up)","quiz":true,"head":["Term","Meaning","Example"],"rows":[["{cleaning|Cleaning}","Removes soil and many microorganisms by **physical action**","Detergent and friction"],["{disinfection|Disinfection}","Destroys many or all pathogens, **usually excluding bacterial spores**","Approved surface disinfectant"],["{sterilization|Sterilization}","Destroys **all microbial life, including bacterial spores**","Validated steam cycle"],["{decontamination|Decontamination}","Makes an item **safe to handle, use, or discard**","A combination of appropriate methods"]]},{"t":"note","k":"key","x":"The required method depends on **how the item will be used**."},{"t":"table","cap":"Antiseptic vs disinfectant","quiz":true,"head":["Agent","Where it is used","Example"],"rows":[["{antiseptic|Antiseptic}","Living tissue, especially skin","A skin preparation before IV insertion"],["{disinfectant|Disinfectant}","Equipment and environmental surfaces","A product for a stretcher or monitor"]]},{"t":"p","x":"The chemical name alone does not tell you the correct use. **Check the product label.**"},{"t":"table","cap":"Microorganisms and disinfectant terms","quiz":true,"head":["Term","Simple meaning"],"rows":[["{vegetative|Vegetative bacteria}","Bacteria in their growing, active form"],["{spore|Bacterial spore}","A resistant survival form produced by some bacteria"],["Bactericidal / virucidal / fungicidal","Kills bacteria / viruses / fungi"],["{tuberculocidal|Tuberculocidal}","Kills Mycobacterium tuberculosis under the stated conditions"],["{sporicidal|Sporicidal}","Kills bacterial spores under the stated conditions"]]},{"t":"note","k":"warn","x":"A product that kills ordinary bacteria **may still leave bacterial spores**."}],"recall":[{"q":"Disinfection vs sterilization: what is the difference?","a":"Disinfection destroys many or all pathogens, usually NOT bacterial spores. Sterilization destroys all microbial life including spores."},{"q":"Define decontamination.","a":"Makes an item safe to handle, use, or discard (a combination of appropriate methods)."},{"q":"Antiseptic vs disinfectant?","a":"Antiseptic: living tissue/skin (skin prep before IV). Disinfectant: equipment and surfaces (stretcher, monitor)."}]},{"id":"s2","title":"Spaulding classification","src":"Slides 7–10","blocks":[{"t":"svg","id":"spaulding"},{"t":"table","cap":"{spaulding|Spaulding classification}","quiz":true,"head":["Item class","Body contact","Minimum processing","EMS example"],"rows":[["{critical|Critical}","Sterile tissue or the bloodstream","Must be sterile","Single-use IV cannula"],["{semicritical|Semicritical}","Mucous membranes or non-intact skin","High-level disinfection","Reusable laryngoscope blade"],["{noncritical|Noncritical}","Intact skin","Low-level disinfection","Blood-pressure cuff"]]},{"t":"note","k":"key","x":"**Clean reusable items before** the required disinfection or sterilization process."},{"t":"twocol","a":{"h":"Critical items","items":["Enter sterile tissue or the bloodstream","Examples: IV cannulas and intraosseous (IO) needles","Must be sterile before use","Check the sealed package, expiry date and single-use label","**Discard single-use devices after use. Do not use a wet or damaged sterile package.**"]},"b":{"h":"Semicritical items","items":["Contact mucous membranes or broken skin","Examples: reusable laryngoscope blades and some endoscopes","Clean first, then **at least high-level disinfection**","A surface wipe alone does not meet this requirement","Follow the blade's instructions; they may require sterilization"]}},{"t":"p","x":"**Noncritical items** contact intact skin: blood-pressure cuffs and stethoscopes. Clean and disinfect between patients as directed, with a compatible product and the **full labelled contact time**. Cuffs and stethoscopes usually need low-level disinfection; blood or specific pathogens may require a different disinfectant."},{"t":"sort","id":"c4-spaulding"}],"recall":[{"q":"Spaulding: three classes with body contact and minimum processing?","a":"Critical: sterile tissue/bloodstream → sterile. Semicritical: mucous membranes/non-intact skin → high-level disinfection. Noncritical: intact skin → low-level disinfection."},{"q":"EMS example for each Spaulding class?","a":"Critical: single-use IV cannula (also IO needles). Semicritical: reusable laryngoscope blade. Noncritical: BP cuff (stethoscope)."},{"q":"Is a surface wipe enough for a laryngoscope blade?","a":"No. Clean, then at least high-level disinfection (or sterilize if instructions require)."}]},{"id":"s3","title":"Cleaning comes first","src":"Slides 11–12","blocks":[{"t":"chain","items":["Blood and tissue left on an item","Shield microorganisms + reduce disinfectant activity","Disinfectant cannot reach / works less","So clean first, promptly"]},{"t":"ul","items":["Water, detergent and friction remove contamination.","**Clean promptly**: dried material is harder to remove.","**{enzymatic|Enzymatic cleaners}** help break down organic material. **Disinfection is still required.**","Brushing helps remove soil from instrument surfaces and joints."]},{"t":"order","id":"c4-clean"},{"t":"table","cap":"Steps in cleaning reusable equipment","quiz":true,"head":["Step","What to do"],"rows":[["1. Preparation","Wear appropriate PPE. Separate dirty equipment from clean supplies"],["2. Disassembly","Open joints and separate removable parts as the instructions allow"],["3. Cleaning","Use the specified detergent and friction. Reach hinges and accessible channels"],["4. Rinsing and inspection","Remove cleaning residue and check for remaining soil or damage"],["5. Next stage","Proceed to the required disinfection or sterilization, then dry and store as directed"]]}],"recall":[{"q":"Why must items be cleaned before disinfection?","a":"Blood and tissue shield microorganisms, and organic material reduces disinfectant activity."},{"q":"Five steps of cleaning reusable equipment?","a":"Preparation → Disassembly → Cleaning → Rinsing and inspection → Next stage (disinfection/sterilization, dry, store)."},{"q":"Do enzymatic cleaners replace disinfection?","a":"No. They help break down organic material; disinfection is still required."}]},{"id":"s4","title":"Levels of disinfection, contact time and choosing a product","src":"Slides 13–15","blocks":[{"t":"table","cap":"Levels of disinfection","quiz":true,"head":["Level","Expected action","Typical application"],"rows":[["{lld|Low-level}","Kills most vegetative bacteria, some fungi, and some viruses","Noncritical equipment"],["{ild|Intermediate-level}","Also kills mycobacteria and most viruses and fungi. **Does not reliably kill spores**","Selected contaminated surfaces"],["{hld|High-level}","Kills all microorganisms **except potentially large numbers of bacterial spores**","Semicritical equipment"]]},{"t":"p","x":"Sterilization destroys all microbial life, including spores, through a **validated process**."},{"t":"h","x":"{contacttime|Contact time} for surface disinfection"},{"t":"ul","items":["Read the product label before use.","Apply enough disinfectant to wet the required surface.","**Keep it wet for the full labelled contact time.**","If it dries early, reapply as the label directs.","Example only: a 3-minute contact time means **3 full minutes of wet contact**."]},{"t":"h","x":"Selection of a disinfectant"},{"t":"ol","items":["Identify the item class and the required level of disinfection.","Check the product's claims against the expected pathogen.","Confirm compatibility with the device material.","Follow the labelled dilution, contact time, temperature, and use-life.","Check required PPE, ventilation, rinsing, and storage."]},{"t":"note","k":"warn","x":"A chemical name or a \"**kills 99.9%**\" claim does not establish suitability for every device."}],"recall":[{"q":"Which disinfection level kills mycobacteria but does not reliably kill spores?","a":"Intermediate-level."},{"q":"High-level disinfection kills everything except…?","a":"Potentially large numbers of bacterial spores."},{"q":"What does a \"3-minute contact time\" mean?","a":"3 full minutes of wet contact; reapply if it dries early."}]},{"id":"s5","title":"Chemical agents","src":"Slides 16–21","blocks":[{"t":"twocol","a":{"h":"Alcohols (ethanol, isopropyl)","items":["Act rapidly against many bacteria, fungi and viruses","**Do not kill bacterial spores**","Unsuitable for sterilization or high-level disinfection of a laryngoscope blade","Rapid evaporation can prevent adequate contact time","Repeated use may damage some plastics and rubber; flammable"]},"b":{"h":"Chlorine compounds","items":["**Sodium hypochlorite** is the active ingredient in many bleach products","Appropriate formulations act against a broad range of microorganisms","Used for **blood spills** or specific pathogen contamination","Blood and organic material can reduce activity","Irritates skin and eyes, bleaches fabric, corrodes metal","**Never mix bleach with acids, ammonia, or other cleaning chemicals**"]}},{"t":"h","x":"{quats|Quaternary ammonium compounds} (\"quats\")"},{"t":"ul","items":["Occur in many products for **noncritical equipment and surfaces**.","Typical formulations act against **vegetative bacteria and enveloped viruses**.","Basic quats have **limited activity against spores, mycobacteria and many non-enveloped viruses**.","Combination products may have different claims. Check the label.","Enveloped viruses have an outer lipid layer; non-enveloped viruses often resist more agents."]},{"t":"table","cap":"Agents for high-level disinfection","quiz":true,"head":["Agent","Main role","Important limitation"],"rows":[["{glutaraldehyde|Glutaraldehyde}","High-level disinfection with correct exposure; active against mycobacteria","Can fix protein to equipment; irritating vapour"],["{opa|Ortho-phthalaldehyde (OPA)}","High-level disinfection of compatible reusable devices","Can stain protein and irritate eyes; limited sporicidal activity"],["{peracetic|Peracetic acid systems}","Controlled processing of compatible devices","Strong oxidizer; requires a validated system and cycle"]]},{"t":"p","x":"These agents require **trained staff, appropriate PPE, and the complete processing instructions**."},{"t":"table","cap":"Hydrogen peroxide formulations","quiz":true,"head":["Formulation","Use","Key point"],"rows":[["Hydrogen peroxide","Surface disinfection or high-level disinfection, depending on the product","Concentration and labelled conditions determine the level"],["Improved / accelerated hydrogen peroxide","Formulations with additives that improve antimicrobial action","Claims and contact times vary by product"]]},{"t":"note","k":"warn","x":"An ordinary household peroxide bottle **does not automatically qualify** as a high-level disinfectant."},{"t":"table","cap":"Other chemical agents","quiz":true,"head":["Agent","Main point","Limitation"],"rows":[["{formaldehyde|Formaldehyde}","An older disinfectant and chemical sterilant in specific applications","Hazardous fumes and carcinogenicity limit its healthcare use"],["{iodophor|Iodophors}","Iodine combined with a carrier. Products exist for skin or surfaces","Skin and surface formulations are not interchangeable"],["{phenolics|Phenolics}","Some products disinfect noncritical surfaces","Unsuitable for high-level disinfection. Special precautions around neonates"]]},{"t":"sort","id":"c4-agent"}],"recall":[{"q":"Why is alcohol unsuitable for a laryngoscope blade?","a":"It does not kill spores, evaporates fast (short contact time); unsuitable for sterilization or HLD of a blade."},{"q":"Active ingredient of bleach, and one safety rule?","a":"Sodium hypochlorite. Never mix bleach with acids, ammonia or other cleaning chemicals."},{"q":"Three high-level disinfection agents?","a":"Glutaraldehyde, ortho-phthalaldehyde (OPA), peracetic acid systems."},{"q":"What limits formaldehyde?","a":"Hazardous fumes and carcinogenicity."}]},{"id":"s6","title":"Other methods, endoscopes and sterilization","src":"Slides 22–26","blocks":[{"t":"table","cap":"Other methods of microbial control","quiz":true,"head":["Method","How it works","Limitation"],"rows":[["Antimicrobial metals","Some metal ions inhibit or kill microorganisms","Specialized application. Does not replace routine processing"],["{uvc|Ultraviolet C (UV-C)}","Controlled exposure can inactivate microorganisms","Shadows and soil reduce action. Equipment and dose matter"],["{pasteurization|Pasteurization}","Hot-water treatment reduces microorganisms","**Does not reliably destroy spores. It is not sterilization**"]]},{"t":"p","x":"Additional technologies do **not remove the need for the required cleaning process**."},{"t":"h","x":"Endoscopes and internal channels"},{"t":"ul","items":["A **{lumen|lumen}** is a channel inside a device; blood, secretions and microorganisms can remain in it.","A **bronchoscope** contacts airway mucosa and needs **at least high-level disinfection**.","Scopes that enter **sterile tissue require sterilization**.","**Cleaning must reach the channels.** Disinfecting only the outside is insufficient."]},{"t":"h","x":"Sterilization"},{"t":"ul","items":["Destroys all forms of microbial life, including bacterial spores.","Critical reusable devices require a **validated** sterilization process.","**Steam is preferred** for compatible items that tolerate heat and moisture.","Heat-sensitive devices need a compatible **low-temperature method**.","Safe packaging and storage protect the item after processing. A damaged or wet sterile package compromises safe use."]},{"t":"p","x":"**{autoclave|Autoclave}**: uses **steam under pressure**; steam transfers heat and destroys microorganisms. Common cycles use **121°C or 132°C**; the required time varies. Steam must reach every item during the validated cycle. Follow the cycle specified for the device, packaging and load."},{"t":"table","cap":"Low-temperature sterilization","quiz":true,"head":["Method","Typical application","Key consideration"],"rows":[["{eto|Ethylene oxide (EtO)}","Compatible items that cannot tolerate steam","Toxic gas. Requires controlled processing and aeration"],["Hydrogen peroxide vapour / gas plasma","Compatible heat-sensitive devices","Material and lumen restrictions vary by system"],["Liquid chemical sterilant systems","Selected immersible devices under validated conditions","Rinsing and immediate-use requirements may limit storage"]]},{"t":"p","x":"Select the method from the **device's validated instructions**."}],"recall":[{"q":"Autoclave: what does it use and at what temperatures?","a":"Steam under pressure; common cycles 121°C or 132°C (time varies)."},{"q":"Which low-temperature sterilant is a toxic gas that needs aeration?","a":"Ethylene oxide (EtO)."},{"q":"Is pasteurization sterilization?","a":"No. Hot water reduces microorganisms but does not reliably destroy spores."},{"q":"A bronchoscope needs at least…?","a":"High-level disinfection (it contacts airway mucosa); cleaning must reach the channels."}]},{"id":"s7","title":"Why processing fails, safety and the EMS case","src":"Slides 27–31","blocks":[{"t":"table","cap":"Factors that reduce effectiveness","quiz":true,"head":["Factor","Why it matters"],"rows":[["Soil or a high microbial load","Material shields organisms and may consume the chemical"],["Hinges, crevices, and lumens","The agent may not reach every contaminated surface"],["Resistant organisms or {biofilm|biofilm}","Some organisms and protective layers resist the process"],["Wrong concentration or expired solution","The product may no longer achieve its labelled effect"],["Incorrect time, temperature, or pH","The process falls outside its validated working conditions"]]},{"t":"h","x":"Safe work practices"},{"t":"ul","items":["Wear gloves and add gown, eye and face protection when splash exposure is likely.","Use ventilation required by the product and processing system.","Keep chemicals labelled and follow their **safety data sheets**.","**Never mix chemicals or improvise concentrations.**","Separate dirty equipment from clean equipment, then perform hand hygiene.","Gloves for patient care may not provide adequate protection against every chemical."]},{"t":"h","x":"EMS case: after a patient transport"},{"t":"table","cap":"Identify the class, choose the action, explain one failure","quiz":true,"head":["Item","Appropriate action","Common failure"],"rows":[["Reusable laryngoscope blade (secretions and dried blood around the hinge)","Clean the hinge and all surfaces. Apply at least high-level disinfection, or sterilize as instructed","Only wiping the visible surface"],["Wet IV cannula package (unopened, lay in a pool of fluid)","Remove it from use and discard the compromised single-use device","Assuming a closed pack is still sterile"],["BP cuff and stretcher (patient vomited)","Remove vomit. Use a compatible approved product with the necessary pathogen claim and full contact time","Wrong product or early drying"]]},{"t":"note","k":"key","x":"**Critical: sterile. Semicritical: at least high-level disinfection. Noncritical: usually low-level disinfection.** Follow device instructions, the product label and the service's infection-control procedure."}],"recall":[{"q":"Name five factors that reduce effectiveness of disinfection/sterilization.","a":"Soil/high microbial load · hinges, crevices, lumens · resistant organisms/biofilm · wrong concentration/expired · incorrect time, temperature or pH."},{"q":"A sealed IV cannula package is wet. What do you do?","a":"Remove it from use and discard it. A wet package is no longer sterile."},{"q":"Common failure when processing a laryngoscope blade?","a":"Only wiping the visible surface (hinge not cleaned; no HLD)."}]}],"orders":[{"id":"c4-clean","sec":"s3","src":"Slide 12","title":"Steps in cleaning reusable equipment","steps":["Preparation: PPE, separate dirty from clean","Disassembly: open joints, separate parts","Cleaning: detergent and friction, hinges and channels","Rinsing and inspection","Next stage: disinfection or sterilization, then dry and store"]}],"sorts":[{"id":"c4-spaulding","sec":"s2","src":"Slides 7–10, 23","title":"Spaulding class for each item","cats":["Critical","Semicritical","Noncritical"],"items":[["Single-use IV cannula",0],["Intraosseous (IO) needle",0],["Reusable laryngoscope blade",1],["Bronchoscope (airway mucosa)",1],["Blood-pressure cuff",2],["Stethoscope",2],["Scope that enters sterile tissue",0],["Item that contacts non-intact skin",1]]},{"id":"c4-agent","sec":"s5","src":"Slides 16–21","title":"Match the agent to its main use/limit","cats":["High-level disinfection","Surfaces / noncritical","Limited by fumes / toxicity"],"items":[["Glutaraldehyde",0],["Ortho-phthalaldehyde (OPA)",0],["Peracetic acid system",0],["Quaternary ammonium compounds",1],["Phenolics",1],["Formaldehyde",2]]}],"questions":[{"id":"c4q1","sec":"s1","q":"Which process destroys ALL microbial life, including bacterial spores?","o":["Sterilization","Disinfection","Cleaning","Decontamination"],"x":"Slide 4.","src":"Slide 4"},{"id":"c4q2","sec":"s1","q":"Disinfection destroys many or all pathogens, usually EXCLUDING:","o":["Bacterial spores","Enveloped viruses","Vegetative bacteria","Fungi"],"x":"Slide 4.","src":"Slide 4"},{"id":"c4q3","sec":"s1","q":"Cleaning removes soil and many microorganisms by:","o":["Physical action (detergent and friction)","A validated steam cycle under pressure at 121°C","Chemical killing of spores","Ultraviolet exposure"],"x":"Slide 4.","src":"Slide 4"},{"id":"c4q4","sec":"s1","q":"\"Makes an item safe to handle, use, or discard\" defines:","o":["Decontamination","Sterilization","Antisepsis","Pasteurization"],"x":"Slide 4.","src":"Slide 4"},{"id":"c4q5","sec":"s1","q":"A skin preparation before IV insertion is an example of:","o":["An antiseptic","A disinfectant","A sterilant","A detergent"],"x":"Slide 5: antiseptic = living tissue.","src":"Slide 5"},{"id":"c4q6","sec":"s1","q":"\"Tuberculocidal\" means the product:","o":["Kills Mycobacterium tuberculosis under the stated conditions","Kills bacterial spores","Kills all viruses","Prevents TB from spreading through the air in the ambulance compartment"],"x":"Slide 6.","src":"Slide 6"},{"id":"c4q7","sec":"s1","q":"A bacterial spore is:","o":["A resistant survival form produced by some bacteria","Bacteria in their growing, active form, easily killed by alcohol","A virus without an envelope","A fungal cell wall"],"x":"Slide 6.","src":"Slide 6"},{"id":"c4q8","sec":"s2","q":"In the Spaulding classification, a reusable laryngoscope blade is:","o":["Semicritical: at least high-level disinfection","Critical: must be sterile","Noncritical: low-level disinfection","Single-use only"],"x":"Slides 7, 9.","src":"Slides 7, 9"},{"id":"c4q9","sec":"s2","q":"Items that enter sterile tissue or the bloodstream are:","o":["Critical","Semicritical","Noncritical","Environmental"],"x":"Slide 7.","src":"Slide 7"},{"id":"c4q10","sec":"s2","q":"A blood-pressure cuff is a ______ item requiring ______.","o":["Noncritical; low-level disinfection","Semicritical; high-level disinfection","Critical; sterilization","Noncritical; sterilization"],"x":"Slides 7, 10.","src":"Slides 7, 10"},{"id":"c4q11","sec":"s2","q":"Semicritical items contact:","o":["Mucous membranes or non-intact skin","Intact skin only","Sterile tissue or the bloodstream","Environmental surfaces only"],"x":"Slide 7.","src":"Slide 7"},{"id":"c4q12","sec":"s2","q":"Which is an example of a critical item?","o":["Intraosseous (IO) needle","Stethoscope","Laryngoscope blade","Stretcher rail"],"x":"Slide 8: IV cannulas and IO needles.","src":"Slide 8"},{"id":"c4q13","sec":"s2","q":"Before using a critical item, you should check:","o":["Sealed package, expiry date and single-use label","Only the colour of the package","That it was wiped with a surface disinfectant for the full contact time","The contact time of the disinfectant"],"x":"Slide 8.","src":"Slide 8"},{"id":"c4q14","sec":"s3","q":"Why must reusable items be cleaned before disinfection?","o":["Blood and tissue shield microorganisms and reduce disinfectant activity","Cleaning sterilizes the item","Disinfectants only work on wet items","Cleaning shortens the disinfectant contact time required by the label to zero"],"x":"Slides 7, 11.","src":"Slide 11"},{"id":"c4q15","sec":"s3","q":"Enzymatic cleaners:","o":["Help break down organic material, but disinfection is still required","Replace the need for disinfection because they remove all organic material","Sterilize heat-sensitive devices","Are used only on intact skin"],"x":"Slide 11.","src":"Slide 11"},{"id":"c4q16","sec":"s3","q":"In cleaning reusable equipment, which step comes right after disassembly?","o":["Cleaning with detergent and friction","Rinsing and inspection","Preparation and PPE","Sterilization"],"x":"Slide 12: preparation → disassembly → cleaning → rinsing/inspection → next stage.","src":"Slide 12"},{"id":"c4q17","sec":"s3","q":"Why clean promptly after use?","o":["Dried material is harder to remove","Disinfectants expire within minutes","Spores multiply only when dry","Steam cannot reach wet items"],"x":"Slide 11.","src":"Slide 11"},{"id":"c4q18","sec":"s4","q":"Which disinfection level kills mycobacteria but does NOT reliably kill spores?","o":["Intermediate-level","Low-level","High-level","Sterilization"],"x":"Slide 13.","src":"Slide 13"},{"id":"c4q19","sec":"s4","q":"High-level disinfection kills all microorganisms except:","o":["Potentially large numbers of bacterial spores","Enveloped viruses such as influenza, HIV and herpes simplex","Mycobacteria","Vegetative bacteria"],"x":"Slide 13.","src":"Slide 13"},{"id":"c4q20","sec":"s4","q":"Low-level disinfection is typically used for:","o":["Noncritical equipment","Semicritical equipment","Critical equipment","Sterile tissue"],"x":"Slide 13.","src":"Slide 13"},{"id":"c4q21","sec":"s4","q":"A disinfectant has a 3-minute contact time, but the surface dries after 1 minute. You should:","o":["Reapply as the label directs to keep it wet for 3 minutes","Accept it, because one application is enough whatever the label says","Wipe it dry immediately","Switch to plain water"],"x":"Slide 14.","src":"Slide 14"},{"id":"c4q22","sec":"s4","q":"Which is the FIRST step when selecting a disinfectant?","o":["Identify the item class and required level of disinfection","Choose the cheapest product","Choose any product whose label says it \"kills 99.9%\" of germs","Check the colour of the product"],"x":"Slide 15.","src":"Slide 15"},{"id":"c4q23","sec":"s5","q":"Which statement about alcohols as disinfectants is correct?","o":["They do not kill bacterial spores","They are suitable for sterilizing laryngoscope blades","They provide long contact time because they evaporate slowly","They protect plastics and rubber"],"x":"Slide 16.","src":"Slide 16"},{"id":"c4q24","sec":"s5","q":"The active ingredient in many bleach products is:","o":["Sodium hypochlorite","Glutaraldehyde","Isopropyl alcohol","Ortho-phthalaldehyde"],"x":"Slide 17.","src":"Slide 17"},{"id":"c4q25","sec":"s5","q":"Which is a safety rule for chlorine compounds?","o":["Never mix bleach with acids or ammonia","Always mix bleach with ammonia for strength","Bleach is safe on all metals","Bleach works better in blood"],"x":"Slide 17.","src":"Slide 17"},{"id":"c4q26","sec":"s5","q":"Typical quaternary ammonium formulations act against:","o":["Vegetative bacteria and enveloped viruses","Bacterial spores and mycobacteria","Non-enveloped viruses only","All microorganisms including spores"],"x":"Slide 18.","src":"Slide 18"},{"id":"c4q27","sec":"s5","q":"Which high-level disinfectant can fix protein to equipment and has an irritating vapour?","o":["Glutaraldehyde","Peracetic acid","Ortho-phthalaldehyde (OPA)","Hydrogen peroxide"],"x":"Slide 19.","src":"Slide 19"},{"id":"c4q28","sec":"s5","q":"Which agent is a strong oxidizer requiring a validated system and cycle?","o":["Peracetic acid systems","Glutaraldehyde","Phenolics","Quats"],"x":"Slide 19.","src":"Slide 19"},{"id":"c4q29","sec":"s5","q":"Ortho-phthalaldehyde (OPA) has which limitation?","o":["Can stain protein, irritate eyes; limited sporicidal activity","Can fix protein to equipment and gives off an irritating vapour","Toxic gas requiring aeration","Unsuitable around neonates"],"x":"Slide 19.","src":"Slide 19"},{"id":"c4q30","sec":"s5","q":"Which agent is unsuitable for high-level disinfection and needs special precautions around neonates?","o":["Phenolics","Glutaraldehyde","Peracetic acid","Ortho-phthalaldehyde"],"x":"Slide 21.","src":"Slide 21"},{"id":"c4q31","sec":"s5","q":"What limits formaldehyde's healthcare use?","o":["Hazardous fumes and carcinogenicity","It cannot kill vegetative bacteria","It is inactivated by water","It is too expensive"],"x":"Slide 21.","src":"Slide 21"},{"id":"c4q32","sec":"s5","q":"Regarding hydrogen peroxide, which is correct?","o":["Concentration and labelled conditions determine the level","A household bottle is always a high-level disinfectant","It is only used for skin antisepsis","All products have the same contact time"],"x":"Slide 20.","src":"Slide 20"},{"id":"c4q33","sec":"s6","q":"Pasteurization:","o":["Reduces microorganisms but does not reliably destroy spores","Is a form of sterilization that destroys all spores with hot water","Uses ultraviolet light","Uses ethylene oxide gas"],"x":"Slide 22.","src":"Slide 22"},{"id":"c4q34","sec":"s6","q":"UV-C action is reduced by:","o":["Shadows and soil","Steam and pressure","Detergent residue only","Room temperature"],"x":"Slide 22.","src":"Slide 22"},{"id":"c4q35","sec":"s6","q":"A bronchoscope contacts airway mucosa. It needs at least:","o":["High-level disinfection","Low-level disinfection","Cleaning only","Intermediate-level disinfection"],"x":"Slide 23.","src":"Slide 23"},{"id":"c4q36","sec":"s6","q":"The preferred sterilization method for items that tolerate heat and moisture is:","o":["Steam","Ethylene oxide","Hydrogen peroxide gas plasma","Liquid chemical sterilant"],"x":"Slide 24.","src":"Slide 24"},{"id":"c4q37","sec":"s6","q":"Common autoclave cycles use:","o":["121°C or 132°C","60°C or 95°C","37°C or 50°C","200°C or 250°C"],"x":"Slide 25.","src":"Slide 25"},{"id":"c4q38","sec":"s6","q":"Which low-temperature method is a toxic gas that requires aeration?","o":["Ethylene oxide (EtO)","Hydrogen peroxide gas plasma","Liquid chemical sterilant","Steam"],"x":"Slide 26.","src":"Slide 26"},{"id":"c4q39","sec":"s6","q":"For devices with internal channels (lumens), which statement is correct?","o":["Cleaning must reach the channels; disinfecting only the outside is insufficient","Wiping the outside is enough","Lumens never hold secretions","Lumens only need low-level disinfection, because secretions cannot enter internal channels"],"x":"Slide 23.","src":"Slide 23"},{"id":"c4q40","sec":"s7","q":"An unopened IV cannula package is wet after lying in a pool of fluid. What do you do?","o":["Remove it from use and discard it","Use it because the package is still closed","Dry it and return it to stock","Wipe it with alcohol and use it"],"x":"Slides 8, 30: common failure = assuming a closed pack is still sterile.","src":"Slides 8, 30"},{"id":"c4q41","sec":"s7","q":"Which factor reduces effectiveness because \"the agent may not reach every contaminated surface\"?","o":["Hinges, crevices and lumens","Wrong concentration","Incorrect pH","Expired solution"],"x":"Slide 27.","src":"Slide 27"},{"id":"c4q42","sec":"s7","q":"After a patient vomits on the stretcher and BP cuff, the common failure is:","o":["Wrong product or early drying","Using too much contact time","Sterilizing the cuff","Discarding the stretcher"],"x":"Slide 30.","src":"Slide 30"},{"id":"c4q43","sec":"s7","q":"Which is a safe work practice when processing equipment?","o":["Never mix chemicals or improvise concentrations","Patient-care gloves protect against every chemical","Store dirty and clean equipment together","Skip ventilation if the room is small"],"x":"Slide 28.","src":"Slide 28"}],"cards":[{"sec":"s1","f":"Cleaning vs disinfection vs sterilization vs decontamination","b":"Cleaning: removes soil (physical action). Disinfection: kills many/all pathogens, usually not spores. Sterilization: all life incl. spores. Decontamination: safe to handle/use/discard."},{"sec":"s1","f":"Antiseptic vs disinfectant","b":"Antiseptic: living tissue/skin (IV skin prep). Disinfectant: equipment/surfaces (stretcher, monitor)."},{"sec":"s1","f":"Vegetative bacteria vs bacterial spore","b":"Vegetative: growing, active form. Spore: resistant survival form."},{"sec":"s1","f":"Tuberculocidal / sporicidal","b":"Kills M. tuberculosis / kills bacterial spores (under stated conditions)."},{"sec":"s2","f":"Spaulding: critical","b":"Sterile tissue/bloodstream → must be sterile (single-use IV cannula, IO needle)."},{"sec":"s2","f":"Spaulding: semicritical","b":"Mucous membranes / non-intact skin → at least high-level disinfection (laryngoscope blade)."},{"sec":"s2","f":"Spaulding: noncritical","b":"Intact skin → low-level disinfection (BP cuff, stethoscope)."},{"sec":"s3","f":"Cleaning reusable equipment: 5 steps","b":"Preparation → Disassembly → Cleaning → Rinsing & inspection → Next stage."},{"sec":"s4","f":"Low / intermediate / high-level disinfection","b":"Low: most vegetative bacteria, some fungi/viruses (noncritical). Intermediate: + mycobacteria, most viruses/fungi, not reliably spores. High: all except large numbers of spores (semicritical)."},{"sec":"s4","f":"Contact time","b":"Keep the surface wet for the full labelled time; reapply if it dries early."},{"sec":"s5","f":"Alcohols (disinfectant use)","b":"Rapid; no spores; evaporate fast; damage plastics/rubber; flammable; not for blade HLD/sterilization."},{"sec":"s5","f":"Chlorine (bleach)","b":"Sodium hypochlorite; broad; blood spills; reduced by organic matter; irritates, bleaches, corrodes; never mix with acids/ammonia."},{"sec":"s5","f":"Quats (disinfectant use)","b":"Noncritical surfaces; vegetative bacteria + enveloped viruses; limited vs spores, mycobacteria, non-enveloped viruses."},{"sec":"s5","f":"HLD agents and limits","b":"Glutaraldehyde (fixes protein, vapour) · OPA (stains, eye irritation, limited sporicidal) · Peracetic acid (strong oxidizer, validated system)."},{"sec":"s5","f":"Formaldehyde / iodophors / phenolics","b":"Formaldehyde: fumes, carcinogenic. Iodophors: iodine + carrier, skin vs surface not interchangeable. Phenolics: noncritical surfaces, not HLD, neonates."},{"sec":"s6","f":"Autoclave","b":"Steam under pressure, 121°C or 132°C; steam must reach every item; validated cycle."},{"sec":"s6","f":"Low-temperature sterilization methods","b":"EtO (toxic gas, aeration) · H₂O₂ vapour/gas plasma (material & lumen limits) · liquid chemical sterilant (immediate use)."},{"sec":"s6","f":"Pasteurization / UV-C / antimicrobial metals","b":"Pasteurization: hot water, not sterilization. UV-C: shadows/soil reduce action. Metals: specialized, not routine."},{"sec":"s7","f":"Factors that reduce effectiveness","b":"Soil/high load · hinges, crevices, lumens · resistant organisms/biofilm · wrong concentration/expired · wrong time, temperature, pH."}]},{"id":"ch6","n":6,"title":"Vaccines & Vaccine-Preventable Diseases","ar":"اللقاحات والأمراض التي يمكن الوقاية منها باللقاحات","file":"EMS313 Vaccines English.pptx","sections":[{"id":"s1","title":"Principles of immunity","src":"Slides 3–6","blocks":[{"t":"p","x":"Vaccination prepares immune defenses **before exposure**, reducing the risk of disease and serious complications. An **{antigen|antigen}** is a substance the immune system can recognize. Vaccines present antigens (or instructions to make them) without requiring the natural disease. Vaccination is **primary prevention**: act before disease occurs."},{"t":"table","cap":"Active vs passive immunity (don't mix them up)","quiz":true,"head":["Feature","{active|Active immunity}","{passive|Passive immunity}"],"rows":[["Source","The body makes its own response","Ready-made antibodies are received"],["Onset","Develops over days to weeks","Immediate protection"],["Duration","Often long-lasting; memory develops","Temporary; usually weeks to months"],["Examples","Vaccination or natural infection","Maternal antibodies; immune globulin"]]},{"t":"note","k":"key","x":"**Active = build a response. Passive = receive antibodies.**"},{"t":"h","x":"How active immunity develops"},{"t":"order","id":"c6-active"},{"t":"ul","items":["A **primary series** builds protection; **{booster|booster} doses** may reinforce it.","**Protection is not immediate after the first dose.**","Vaccine type, age and immune status affect the strength and duration of the response (notes)."]},{"t":"h","x":"When passive immunity is useful"},{"t":"ul","items":["Maternal antibodies cross the placenta and protect the newborn temporarily.","{ig|Immune globulin} gives rapid protection after selected exposures.","Examples: **hepatitis B immune globulin ({hbig|HBIG})** and **tetanus immune globulin ({tig|TIG})**.","Depending on the situation, a clinician may give both ready-made antibodies and a vaccine (notes)."]}],"recall":[{"q":"Active vs passive immunity: source, onset, duration?","a":"Active: own response, days–weeks, long-lasting with memory. Passive: ready-made antibodies, immediate, temporary (weeks–months)."},{"q":"Two examples of immune globulin products on slide 6?","a":"HBIG (hepatitis B immune globulin) and TIG (tetanus immune globulin)."},{"q":"Why may boosters be needed?","a":"A primary series builds protection; boosters reinforce it. Memory cells support a faster response later."}]},{"id":"s2","title":"Vaccine types","src":"Slides 7–12","blocks":[{"t":"table","cap":"Main vaccine types","quiz":true,"head":["Type","What is used?","Examples"],"rows":[["{live|Live attenuated}","A weakened, living organism","MMR; varicella"],["{inactivated|Inactivated}","An organism that cannot replicate","IPV; hepatitis A"],["{toxoid|Toxoid}","An inactivated bacterial toxin","Tetanus; diphtheria"],["{subunit|Protein subunit} / {recombinant|recombinant}","Selected antigens","Hepatitis B; acellular pertussis"],["{polysaccharide|Polysaccharide}","Capsule sugars alone","PPSV23"],["{conjugate|Conjugate}","Capsule sugars linked to protein","Hib; PCV; MenACWY"]]},{"t":"note","k":"key","x":"These categories can overlap: **recombinant describes how an antigen is made**, so a recombinant vaccine may also be a subunit vaccine."},{"t":"twocol","a":{"h":"Live attenuated","items":["Contain a weakened form of the organism","The vaccine organism **replicates** to stimulate immunity","Examples: MMR, varicella","**Generally avoided during pregnancy and in severe immunosuppression**","Live attenuated does **not** mean unable to replicate","Reversion risk of certain oral polio vaccines should not be generalized to every live vaccine (notes)"]},"b":{"h":"Inactivated","items":["Organisms killed or inactivated","**Cannot replicate** or cause infection from vaccine organisms","Several doses may be needed","Examples: IPV, hepatitis A","A non-live vaccine can still cause expected local or systemic reactions (injection-site pain, temporary fever)"]}},{"t":"twocol","a":{"h":"Toxoid","items":["Some bacteria cause disease mainly through a **toxin**","A toxoid is a toxin treated to remove its harmful activity","Vaccination produces antibodies that **neutralize the toxin**","Examples: tetanus, diphtheria","**The immune target is the toxin**","Explains why a patient with the disease may need **antitoxin** (notes)"]},"b":{"h":"Subunit and recombinant","items":["Subunit: selected parts of a pathogen","**Acellular pertussis** uses purified bacterial antigens","Recombinant technology produces an antigen in engineered cells","Examples: **hepatitis B, HPV, recombinant zoster**","Hepatitis B is one example of recombinant vaccination, not the only one"]}},{"t":"table","cap":"Polysaccharide vs conjugate (don't mix them up)","quiz":true,"head":["Feature","Plain polysaccharide","Conjugate"],"rows":[["Antigen","Capsule sugar alone","Capsule sugar linked to a protein"],["Immune response","Mainly **T-cell independent**","Recruits **T-cell help**"],["Young children","**Weak response below age 2 years**","Effective responses in infancy"],["Examples","PPSV23; Vi typhoid vaccine","Hib; PCV; MenACWY"]]},{"t":"chain","items":["Capsule sugar alone","Weak infant response (T-cell independent)","Link sugar to a protein","T-cell help → stronger response + memory"]},{"t":"sort","id":"c6-types"}],"recall":[{"q":"Name the six vaccine types with one example each.","a":"Live attenuated (MMR) · Inactivated (IPV) · Toxoid (tetanus) · Subunit/recombinant (hepatitis B) · Polysaccharide (PPSV23) · Conjugate (Hib)."},{"q":"Why are live vaccines avoided in pregnancy?","a":"The vaccine organism replicates; live vaccines are generally avoided in pregnancy and severe immunosuppression."},{"q":"Why is conjugation better for infants?","a":"Linking capsule sugar to protein recruits T-cell help → effective response under 2 years + immune memory."}]},{"id":"s3","title":"Safe vaccination and the EMS approach","src":"Slides 13–14","blocks":[{"t":"ul","items":["Check the record, age, health status, and vaccine-specific precautions.","A **severe allergic reaction** to a previous dose or component requires assessment.","Use the correct product, dose, route, and schedule.","Maintain the required **{coldchain|cold chain}** and document each dose.","Eligibility and storage requirements depend on the specific vaccine.","Immunodeficiency does not rule out every vaccine: non-live vaccines may be appropriate, although the response may be weaker (notes)."]},{"t":"h","x":"An EMS approach to suspected infection"},{"t":"order","id":"c6-ems"},{"t":"table","cap":"Three steps","quiz":true,"head":["Step","What to do"],"rows":[["1. Recognize and assess","Use the history, symptoms, and ABCDE assessment"],["2. Protect","Apply Standard Precautions and add route-specific precautions"],["3. Stabilize and communicate","Treat immediate threats, pre-alert the hospital, and report exposures"]]},{"t":"p","x":"Use local EMS protocols and occupational-health pathways. A clinical photograph alone cannot confirm the diagnosis (notes)."}],"recall":[{"q":"Three steps of the EMS approach to suspected infection?","a":"Recognize and assess → Protect → Stabilize and communicate."},{"q":"Name four checks for safe vaccination practice.","a":"Record/age/health status/precautions; severe allergy assessment; correct product, dose, route, schedule; cold chain + documentation."}]},{"id":"s4","title":"Varicella and shingles (VZV)","src":"Slides 15–16, 34–35","blocks":[{"t":"dcards","items":[{"name":"Varicella (chickenpox)","agent":"{vzv|Varicella-zoster virus (VZV)}: primary infection","clue":"Itchy rash in **crops**: spots, blisters and crusts **coexist** (lesions at different stages)","spread":"Airborne particles + contact with blister fluid","prec":"**Airborne + Contact** (plus Standard)","vaccine":"Varicella vaccine: **live attenuated**, prevents primary infection","note":"Complications: skin infection, pneumonia, encephalitis. Severe illness more likely in adults, pregnancy, immunosuppression. Contagious **before the rash until all lesions crust**.","src":"Slides 15–16"},{"name":"Shingles (herpes zoster)","agent":"**Reactivation** of latent VZV after chickenpox","clue":"Pain, burning or tingling, then a **one-sided** blistering rash along a **{dermatome|dermatome}**","spread":"VZV from shingles can cause **chickenpox** in a susceptible contact","prec":"Cover lesions; precautions depend on extent of disease and immune status","vaccine":"**Recombinant zoster vaccine (RZV)**: **non-live**, two-dose series","note":"Persistent nerve pain = **{phn|postherpetic neuralgia}**. Eye involvement or widespread disease needs urgent evaluation. Saudi MOH: adults **50+** and immunocompromised adults **18+**.","src":"Slides 34–35"}]},{"t":"table","cap":"Varicella vs shingles (don't mix them up)","quiz":true,"head":["","Varicella","Shingles"],"rows":[["What","Primary VZV infection","Reactivation of latent VZV"],["Rash","Itchy, in crops, all stages together, widespread","One-sided, grouped blisters along a dermatome, painful"],["Vaccine","Varicella vaccine (live attenuated)","RZV (non-live, 2 doses)"],["Key point","Airborne + contact precautions","RZV is **not a substitute** for the varicella vaccine"]]},{"t":"note","k":"conflict","x":"Varicella precautions: Ch3 lists chickenpox under **airborne** (slides 6, 17). The vaccines lecture adds **contact** for blister fluid: **Airborne + Contact** (slides 16, 38). They do not contradict each other; the vaccines lecture is more complete."},{"t":"p","x":"For mild breakthrough cases with lesions that do not crust, guidance uses a period of **24 hours without new lesions** (notes, slide 16). Gloves alone are insufficient."}],"recall":[{"q":"Varicella: route and precautions?","a":"Airborne particles + contact with blister fluid → Airborne + Contact precautions (in addition to Standard)."},{"q":"Until when is a varicella patient contagious?","a":"From before the rash until all lesions crust."},{"q":"RZV: live or non-live, how many doses, which groups (Saudi MOH)?","a":"Non-live, two-dose series; adults 50+ and immunocompromised adults 18+."}]},{"id":"s5","title":"Toxin diseases: diphtheria and tetanus","src":"Slides 17–18, 36–37","blocks":[{"t":"dcards","items":[{"name":"Diphtheria","agent":"Toxigenic **Corynebacterium diphtheriae**","clue":"Thick **grey-white {pseudomembrane|pseudomembrane}** in the throat that may obstruct the airway; toxin can damage the **heart and peripheral nerves**","spread":"Respiratory droplets and secretions","prec":"Respiratory: **Droplet**. Cutaneous: **Contact**","vaccine":"Diphtheria **toxoid** in combination vaccines: **{dtap|DTaP}** (young children); **Tdap / Td** (older age groups)","note":"Assess airway promptly; avoid unnecessary throat manipulation. Suspected respiratory disease → urgent **antibiotics + diphtheria antitoxin** (before lab confirmation).","src":"Slides 17–18"},{"name":"Tetanus","agent":"**Clostridium tetani** spores enter through wounds or breaks in the skin","clue":"Toxin blocks inhibitory nerve signals → **rigidity and painful spasms**, **lockjaw**, swallowing difficulty, respiratory compromise","spread":"**Does not spread from person to person**","prec":"Standard; urgent hospital care and close airway monitoring","vaccine":"Tetanus **toxoid** (tetanus-containing vaccine); **TIG** for selected wounds","note":"After a wound: clean it, review wound type and vaccination history, give a tetanus-containing vaccine when indicated; TIG may also be needed for selected dirty or major wounds and susceptible patients. **TIG = passive; vaccine = active.**","src":"Slides 36–37"}]},{"t":"p","x":"In DTaP and Tdap, **D** = diphtheria, **T** = tetanus, **aP** = acellular pertussis. DTaP and Tdap differ in formulation and in the age groups for which they are appropriate (notes)."},{"t":"chain","items":["Dirty wound","Vaccine (active immunity, builds over time)","+ TIG if indicated (passive, immediate)","Both may be needed together"]}],"recall":[{"q":"Classic sign of diphtheria and its danger?","a":"Adherent grey-white pseudomembrane in the throat → airway obstruction; toxin can damage heart and nerves."},{"q":"Diphtheria precautions: respiratory vs cutaneous?","a":"Respiratory: droplet. Cutaneous: contact."},{"q":"Does tetanus spread person to person?","a":"No. Spores enter through wounds."},{"q":"After a dirty wound, why give both vaccine and TIG?","a":"TIG gives immediate passive antibodies; the vaccine builds active immunity."}]},{"id":"s6","title":"Hepatitis A and B","src":"Slides 19–21","blocks":[{"t":"table","cap":"Hepatitis A vs B (don't mix them up)","quiz":true,"head":["Feature","Hepatitis A","Hepatitis B"],"rows":[["Main route","**{fecaloral|Fecal–oral}** (contaminated food, water, close contact)","Infected **blood and certain body fluids**, including during birth"],["Illness","Acute: fatigue, nausea, abdominal discomfort, dark urine, jaundice","Acute may be silent or cause fatigue, nausea, jaundice"],["Chronic infection","**No** (treatment mainly supportive)","**Possible**; can lead to cirrhosis and liver cancer"],["Chronicity by age","—","About **90% after infant** infection vs about **5% after adult** infection"],["Vaccine type","**Inactivated**","**Recombinant protein subunit**"],["EMS focus","Hand hygiene; manage contamination","Sharps safety; vaccination; exposure reporting"]]},{"t":"ul","items":["Hepatitis A prevention combines vaccination, hand hygiene, and safe food and water.","Most immunocompetent adults recover from acute HBV infection.","Symptoms alone do not identify the type of hepatitis (notes).","**After an exposure, seek prompt assessment for vaccine and/or immune globulin.** After a needlestick, report immediately (notes)."]}],"recall":[{"q":"Hepatitis A vs B: route, chronicity, vaccine type?","a":"A: fecal–oral, no chronic infection, inactivated vaccine. B: blood/body fluids, chronic possible (highest risk in infancy), recombinant protein subunit vaccine."},{"q":"HBV chronicity: infant vs adult?","a":"About 90% after infant infection vs about 5% after adult infection."}]},{"id":"s7","title":"Influenza, measles, mumps and rubella","src":"Slides 22–24, 27, 32–33","blocks":[{"t":"dcards","items":[{"name":"Influenza","agent":"Influenza virus","clue":"Abrupt cough, fever, headache, fatigue, muscle aches. **Older or immunocompromised may have little or no fever**","spread":"Respiratory droplets","prec":"**Droplet**","vaccine":"**Annual** vaccination; non-live vaccines; a live nasal vaccine for eligible groups (notes)","note":"Complications: pneumonia, worsening of chronic disease. Early antivirals for selected high-risk or severely ill patients.","src":"Slide 22"},{"name":"Measles","agent":"Measles virus","clue":"High fever, cough, runny nose, **red eyes**; **{koplik|Koplik spots}** inside the mouth; rash **starts on the face and spreads downward**","spread":"**Airborne**: virus can remain infectious in the air **up to 2 hours** after the patient leaves","prec":"**Airborne**: fit-tested N95 or equivalent; mask the patient if tolerated; pre-alert","vaccine":"**MMR**: live attenuated (measles, mumps, rubella)","note":"Complications: pneumonia, encephalitis. Suspect early in an unvaccinated patient with fever and rash. A surgical mask on the provider is not sufficient.","src":"Slides 23–24"},{"name":"Mumps","agent":"Mumps virus","clue":"**{parotitis|Parotid} swelling** near the jaw and ear (one or both sides); fever, headache, malaise","spread":"Saliva and respiratory droplets","prec":"**Droplet**","vaccine":"**MMR**","note":"Complications: **orchitis**, meningitis, hearing loss. Care mainly supportive.","src":"Slide 27"},{"name":"Rubella","agent":"Rubella virus","clue":"Mild rash, low fever, **enlarged lymph nodes**; some infections have few or no symptoms","spread":"Respiratory droplets","prec":"**Droplet** (acquired rubella)","vaccine":"**MMR**: live, **not given during pregnancy**; susceptible patients vaccinated **postpartum**","note":"Greatest concern: **pregnancy** → miscarriage, fetal death or **{crs|congenital rubella syndrome}** (hearing loss, eye defects, congenital heart disease). Review immunity before pregnancy.","src":"Slides 32–33"}]},{"t":"table","cap":"Measles vs rubella (don't mix them up)","quiz":true,"head":["","Measles","Rubella"],"rows":[["Precaution","Airborne","Droplet"],["Picture","High fever, cough, coryza, red eyes, Koplik spots, rash face → down","Mild rash, low fever, enlarged lymph nodes; may be silent"],["Main danger","Pneumonia, encephalitis; spreads through the air","Pregnancy: congenital rubella syndrome"],["Vaccine","MMR (live)","MMR (live; not in pregnancy)"]]}],"recall":[{"q":"Measles: where does the rash start, and what is inside the mouth?","a":"Starts on the face and spreads downward; Koplik spots inside the mouth."},{"q":"How long can measles virus stay infectious in the air?","a":"Up to 2 hours after the patient leaves."},{"q":"Mumps complications?","a":"Orchitis, meningitis, hearing loss."},{"q":"Congenital rubella syndrome effects?","a":"Hearing loss, eye defects, congenital heart disease."},{"q":"Why is MMR not given during pregnancy?","a":"It is a live vaccine; susceptible patients are vaccinated postpartum."}]},{"id":"s8","title":"Meningococcal disease, pertussis and polio","src":"Slides 25–26, 28–31","blocks":[{"t":"dcards","items":[{"name":"Meningococcal disease","agent":"**Neisseria meningitidis**: meningitis or bloodstream infection","clue":"Fever, headache, neck stiffness, altered mental status; **non-blanching petechial or purpuric rash**; sepsis and shock can progress rapidly, **sometimes before a rash appears**","spread":"Close contact with respiratory or throat secretions","prec":"**Droplet**; urgent antibiotics","vaccine":"**MenACWY** and **MenB** cover **different serogroups**","note":"**Do not wait for a rash** before recognizing and treating possible sepsis. Unprotected secretion exposure may require **antibiotic prophylaxis** after assessment. Vaccination does not replace assessment after a qualifying exposure. Hajj-related requirements (notes).","src":"Slides 25–26"},{"name":"Pertussis","agent":"**Bordetella pertussis**","clue":"Cold-like start → repeated coughing fits, vomiting or an inspiratory **\"whoop\"**. **Infants may present with apnea** and little obvious cough","spread":"Respiratory droplets","prec":"**Droplet**","vaccine":"**DTaP / Tdap** contain acellular pertussis antigens; **protection can wane**","note":"Early antibiotics reduce severity and transmission; later treatment may not shorten an established cough. Post-exposure prophylaxis for defined high-risk contacts.","src":"Slides 28–29"},{"name":"Polio","agent":"Poliovirus","clue":"Most infections have no obvious symptoms; a small proportion cause **acute flaccid weakness or paralysis**; respiratory muscle involvement can be life-threatening","spread":"Mainly **fecal–oral**","prec":"New acute flaccid weakness: urgent assessment and **notification**","vaccine":"**IPV** (inactivated, injection) or **OPV** (live attenuated, oral drops)","note":"Product choice follows current national policy, not a general preference.","src":"Slides 30–31"}]},{"t":"table","cap":"IPV vs OPV (don't mix them up)","quiz":true,"head":["Feature","{ipv|IPV}","{opv|OPV}"],"rows":[["Type and route","Inactivated; injection","Live attenuated; oral drops"],["Main strength","Strong protection against paralysis","Strong **intestinal immunity** (helps interrupt transmission)"],["Vaccine-virus risk","No replication or vaccine-derived virus","Rare vaccine-associated or derived poliovirus risks"],["Use","Follow national schedules and travel guidance","Depends on national and outbreak programmes"]]}],"recall":[{"q":"Meningococcal disease: what must you NOT wait for?","a":"A rash. Sepsis and shock can progress before a rash appears."},{"q":"How may pertussis present in an infant?","a":"Apnea with little obvious cough (no classic whoop)."},{"q":"IPV vs OPV: main strength of each?","a":"IPV: strong protection against paralysis, no vaccine-virus risk. OPV: strong intestinal immunity, rare vaccine-derived risks."}]},{"id":"s9","title":"Review: precautions and Saudi guidance","src":"Slides 38–39","blocks":[{"t":"table","cap":"Respiratory precautions: key comparisons","quiz":true,"head":["Suspected disease","Additional precautions","Practical reminder"],"rows":[["Measles","Airborne","Fit-tested N95 or equivalent"],["Varicella","Airborne + Contact","Cover lesions; limit exposure"],["Influenza; respiratory diphtheria","Droplet","Mask patient if tolerated"],["Meningococcal disease; mumps; pertussis; acquired rubella","Droplet","Pre-alert and assess relevant exposures"]]},{"t":"note","k":"key","x":"**Standard Precautions always apply.** Follow procedure-specific PPE guidance; aerosol-generating procedures may need extra protection. Rubella here = acquired infection; congenital cases have different requirements (notes)."},{"t":"sort","id":"c6-prec"},{"t":"h","x":"Using vaccination guidance in Saudi Arabia"},{"t":"ul","items":["Use the current **Saudi MOH schedule** for routine childhood doses and catch-up needs.","Review adult vaccination according to age, health conditions, pregnancy, and prior doses.","**Healthcare workers** need documented vaccination and immunity according to occupational-health policy.","Check current **Hajj, Umrah, and travel** requirements for the relevant season and destination.","Use the patient's record plus current guidance; **do not rely on an old schedule image**."]}],"recall":[{"q":"Which two diseases in the review table need airborne precautions?","a":"Measles (airborne) and varicella (airborne + contact)."},{"q":"Which diseases need droplet precautions in the review table?","a":"Influenza, respiratory diphtheria, meningococcal disease, mumps, pertussis, acquired rubella."}]}],"orders":[{"id":"c6-active","sec":"s1","src":"Slide 5","title":"How active immunity develops","steps":["Antigen exposure","Specific B and T lymphocytes are activated","B cells produce antibodies against the antigen","Memory cells remain","Faster response at later exposure"]},{"id":"c6-ems","sec":"s3","src":"Slide 14","title":"EMS approach to suspected infection","steps":["Recognize and assess (history, symptoms, ABCDE)","Protect (Standard + route-specific precautions)","Stabilize and communicate (treat threats, pre-alert, report exposures)"]}],"sorts":[{"id":"c6-types","sec":"s2","src":"Slides 7–12, 21, 31, 35","title":"Which vaccine type?","cats":["Live attenuated","Inactivated","Toxoid","Subunit / recombinant","Polysaccharide","Conjugate"],"items":[["MMR",0],["Varicella vaccine",0],["OPV",0],["IPV",1],["Hepatitis A vaccine",1],["Tetanus vaccine",2],["Diphtheria vaccine",2],["Hepatitis B vaccine",3],["Acellular pertussis",3],["Recombinant zoster vaccine (RZV)",3],["PPSV23",4],["Vi typhoid vaccine",4],["Hib",5],["PCV",5],["MenACWY",5]]},{"id":"c6-prec","sec":"s9","src":"Slides 16, 18, 22, 24, 26–29, 32, 38","title":"Additional precautions for each disease","cats":["Airborne","Airborne + Contact","Droplet","Contact"],"items":[["Measles",0],["Varicella",1],["Influenza",2],["Respiratory diphtheria",2],["Cutaneous diphtheria",3],["Meningococcal disease",2],["Mumps",2],["Pertussis",2],["Acquired rubella",2]]}],"questions":[{"id":"c6q1","sec":"s1","q":"Passive immunity:","o":["Gives immediate but temporary protection with ready-made antibodies","Develops over days to weeks, is long-lasting and creates immune memory","Is produced by vaccination","Lasts for life after one dose"],"x":"Slide 4.","src":"Slide 4"},{"id":"c6q2","sec":"s1","q":"Which is an example of passive immunity?","o":["Maternal antibodies crossing the placenta","Natural infection with measles","MMR vaccination","A hepatitis B vaccine series"],"x":"Slides 4, 6.","src":"Slides 4, 6"},{"id":"c6q3","sec":"s1","q":"An antigen is:","o":["A substance the immune system can recognize","A ready-made antibody given to provide immediate protection","A memory cell","A vaccine preservative"],"x":"Slide 3.","src":"Slide 3"},{"id":"c6q4","sec":"s1","q":"Which cells support a faster response to a later exposure?","o":["Memory cells","Red blood cells","Platelets","Maternal antibodies"],"x":"Slide 5.","src":"Slide 5"},{"id":"c6q5","sec":"s1","q":"HBIG and TIG are examples of:","o":["Immune globulin (passive immunity)","Live attenuated vaccines","Toxoid vaccines","Conjugate vaccines"],"x":"Slide 6.","src":"Slide 6"},{"id":"c6q6","sec":"s1","q":"Vaccination is which level of prevention?","o":["Primary prevention","Secondary prevention","Tertiary prevention","Post-exposure treatment"],"x":"Slide 3: act before disease occurs.","src":"Slide 3"},{"id":"c6q7","sec":"s1","q":"Which statement about the first vaccine dose is correct?","o":["Protection is not immediate after the first dose","Protection is complete immediately","Boosters are never needed","It works as passive immunity"],"x":"Slide 5.","src":"Slide 5"},{"id":"c6q8","sec":"s2","q":"MMR and varicella vaccines are:","o":["Live attenuated","Inactivated","Toxoid","Polysaccharide"],"x":"Slides 7–8.","src":"Slides 7–8"},{"id":"c6q9","sec":"s2","q":"Which vaccine type uses an inactivated bacterial toxin?","o":["Toxoid","Conjugate","Subunit","Live attenuated"],"x":"Slides 7, 10.","src":"Slides 7, 10"},{"id":"c6q10","sec":"s2","q":"IPV and hepatitis A vaccines are:","o":["Inactivated","Live attenuated","Toxoid","Conjugate"],"x":"Slides 7, 9.","src":"Slides 7, 9"},{"id":"c6q11","sec":"s2","q":"Live attenuated vaccines are generally avoided in:","o":["Pregnancy and severe immunosuppression","Healthy adults","Healthcare workers who care for immunocompromised patients","Travellers to Hajj"],"x":"Slide 8.","src":"Slide 8"},{"id":"c6q12","sec":"s2","q":"Which statement about live attenuated vaccines is correct?","o":["The vaccine organism replicates to stimulate immunity","They cannot replicate, so they are safe in pregnancy and immunosuppression","They contain only capsule sugars","They are toxins treated to remove harm"],"x":"Slide 8: live attenuated does not mean unable to replicate.","src":"Slide 8"},{"id":"c6q13","sec":"s2","q":"Hepatitis B vaccine is an example of:","o":["A recombinant protein subunit vaccine","A live attenuated vaccine","A toxoid vaccine","A plain polysaccharide vaccine"],"x":"Slides 7, 11, 21.","src":"Slides 7, 11, 21"},{"id":"c6q14","sec":"s2","q":"Plain polysaccharide vaccines give a weak response in children younger than:","o":["2 years","6 months","5 years","12 years"],"x":"Slide 12.","src":"Slide 12"},{"id":"c6q15","sec":"s2","q":"Conjugate vaccines work better in infants because they:","o":["Link capsule sugar to a protein and recruit T-cell help","Contain live organisms","Contain capsule sugar alone, which infants respond to strongly without T cells","Give ready-made antibodies"],"x":"Slide 12.","src":"Slide 12"},{"id":"c6q16","sec":"s2","q":"Which is a CONJUGATE vaccine?","o":["Hib","PPSV23","Vi typhoid vaccine","IPV"],"x":"Slides 7, 12: Hib, PCV, MenACWY.","src":"Slide 12"},{"id":"c6q17","sec":"s2","q":"\"Recombinant\" describes:","o":["How an antigen is made (in engineered cells)","A weakened living organism that replicates to stimulate immunity","A vaccine given orally","An inactivated toxin"],"x":"Slides 7, 11.","src":"Slides 7, 11"},{"id":"c6q18","sec":"s3","q":"Which is part of safe vaccination practice?","o":["Maintain the cold chain and document each dose","Use any available schedule image","Skip assessment after a severe allergic reaction","Give every vaccine to every immunocompromised patient"],"x":"Slide 13.","src":"Slide 13"},{"id":"c6q19","sec":"s3","q":"In the EMS approach to suspected infection, \"Protect\" means:","o":["Apply Standard Precautions and add route-specific precautions","Treat immediate threats and pre-alert the hospital","Use the ABCDE assessment","Report exposures to occupational health"],"x":"Slide 14.","src":"Slide 14"},{"id":"c6q58","sec":"s3","q":"A patient had a severe allergic reaction to a previous dose or component of a vaccine. Safe practice requires:","o":["Assessment before any further dose","Giving the next dose at a lower volume without assessment","Giving the next dose as scheduled with no change","Switching to a live attenuated vaccine instead"],"x":"Slide 13.","src":"Slide 13"},{"id":"c6q59","sec":"s3","q":"What is the FIRST step of the EMS approach to suspected infection?","o":["Recognize and assess","Protect the team with precautions","Stabilize and communicate with the hospital","Report the exposure to occupational health"],"x":"Slide 14: recognize and assess → protect → stabilize and communicate.","src":"Slide 14"},{"id":"c6q20","sec":"s4","q":"A varicella rash is characterized by:","o":["Spots, blisters and crusts at different stages at the same time","A one-sided rash along a dermatome","A rash that starts on the face and spreads downward over several days","A non-blanching purpuric rash"],"x":"Slide 15.","src":"Slide 15"},{"id":"c6q21","sec":"s4","q":"Suspected chickenpox requires:","o":["Airborne and Contact Precautions (plus Standard)","Droplet Precautions only, with a surgical mask on the crew","Contact Precautions only","Standard Precautions only"],"x":"Slides 16, 38.","src":"Slides 16, 38"},{"id":"c6q22","sec":"s4","q":"Varicella patients are usually contagious:","o":["From before the rash until all lesions crust","Only after the rash appears","Only while they have fever","For 24 hours after the first lesion"],"x":"Slide 16.","src":"Slide 16"},{"id":"c6q23","sec":"s4","q":"Shingles results from:","o":["Reactivation of latent varicella-zoster virus","A first infection with a new virus","A bacterial skin infection","A reaction to the varicella vaccine"],"x":"Slide 34.","src":"Slide 34"},{"id":"c6q24","sec":"s4","q":"Persistent nerve pain after shingles is called:","o":["Postherpetic neuralgia","Orchitis","Encephalitis","Lockjaw"],"x":"Slide 34.","src":"Slide 34"},{"id":"c6q25","sec":"s4","q":"The recombinant zoster vaccine (RZV) is:","o":["Non-live, given as a two-dose series","Live attenuated, one dose","A toxoid, given yearly","A substitute for the varicella vaccine"],"x":"Slide 35.","src":"Slide 35"},{"id":"c6q26","sec":"s4","q":"Per the Saudi MOH guidance cited in the lecture, RZV is for adults aged ___ and immunocompromised adults aged ___.","o":["50+; 18+","65+; 18+","50+; 30+","18+; 12+"],"x":"Slide 35.","src":"Slide 35"},{"id":"c6q27","sec":"s4","q":"A susceptible contact exposed to VZV from a shingles patient may develop:","o":["Chickenpox","Shingles","Measles","Mumps"],"x":"Slide 35.","src":"Slide 35"},{"id":"c6q28","sec":"s5","q":"A thick grey-white adherent pseudomembrane in the throat suggests:","o":["Diphtheria","Mumps","Pertussis","Influenza"],"x":"Slide 17.","src":"Slide 17"},{"id":"c6q29","sec":"s5","q":"Suspected respiratory diphtheria requires urgent:","o":["Antibiotics and diphtheria antitoxin","MMR vaccination","Antivirals only","Immune globulin for hepatitis B"],"x":"Slide 18.","src":"Slide 18"},{"id":"c6q30","sec":"s5","q":"Cutaneous diphtheria requires:","o":["Contact Precautions","Airborne Precautions","Droplet Precautions","No precautions"],"x":"Slide 18.","src":"Slide 18"},{"id":"c6q31","sec":"s5","q":"Which statement about tetanus is correct?","o":["It does not spread from person to person","It spreads by respiratory droplets","It needs airborne precautions","It is caused by a virus"],"x":"Slide 36.","src":"Slide 36"},{"id":"c6q32","sec":"s5","q":"The tetanus toxin causes rigidity and spasms by:","o":["Blocking inhibitory nerve signals","Destroying the liver","Forming a throat pseudomembrane","Infecting the parotid gland"],"x":"Slide 36.","src":"Slide 36"},{"id":"c6q33","sec":"s5","q":"After a dirty major wound in a susceptible patient, TIG provides:","o":["Passive antibodies, while the vaccine builds active immunity","Active immunity that develops over several weeks and lasts for life","A live attenuated organism","Antibiotic prophylaxis"],"x":"Slide 37.","src":"Slide 37"},{"id":"c6q34","sec":"s5","q":"In \"DTaP\", \"aP\" stands for:","o":["Acellular pertussis","Active polio","Attenuated pneumococcus","Antitoxin protein"],"x":"Slide 18 notes.","src":"Slide 18"},{"id":"c6q35","sec":"s6","q":"Hepatitis A spreads mainly by:","o":["The fecal–oral route","Blood and body fluids","Airborne droplet nuclei","Mosquito bites"],"x":"Slide 19.","src":"Slide 19"},{"id":"c6q36","sec":"s6","q":"Which statement about hepatitis A is correct?","o":["It does not cause chronic infection","It commonly becomes chronic in adults","Its vaccine is recombinant subunit","It spreads mainly through needlesticks"],"x":"Slide 19, 21.","src":"Slides 19, 21"},{"id":"c6q37","sec":"s6","q":"The risk of chronic hepatitis B after infection in infancy is about:","o":["90%","5%","50%","25%"],"x":"Slide 20: ~90% after infant infection vs ~5% after adult infection.","src":"Slide 20"},{"id":"c6q38","sec":"s6","q":"The EMS focus for hepatitis B is:","o":["Sharps safety, vaccination and exposure reporting","Hand hygiene and managing fecal contamination","Airborne precautions","Annual vaccination"],"x":"Slide 21.","src":"Slide 21"},{"id":"c6q39","sec":"s6","q":"Chronic hepatitis B can lead to:","o":["Cirrhosis and liver cancer","Congenital rubella syndrome","Postherpetic neuralgia","Acute flaccid paralysis"],"x":"Slide 20.","src":"Slide 20"},{"id":"c6q40","sec":"s7","q":"Older or immunocompromised patients with influenza may:","o":["Have little or no fever","Always have a high fever","Develop Koplik spots","Develop a pseudomembrane"],"x":"Slide 22.","src":"Slide 22"},{"id":"c6q41","sec":"s7","q":"Koplik spots inside the mouth are a feature of:","o":["Measles","Rubella","Mumps","Varicella"],"x":"Slide 23.","src":"Slide 23"},{"id":"c6q42","sec":"s7","q":"Measles virus can remain infectious in the air for up to:","o":["2 hours after the patient leaves","10 minutes","24 hours","2 days"],"x":"Slide 24.","src":"Slide 24"},{"id":"c6q43","sec":"s7","q":"For suspected measles, the provider needs:","o":["A fit-tested N95 or equivalent respirator","A surgical mask on the provider and gloves for contact","Gloves only","No PPE if vaccinated"],"x":"Slide 24: a surgical mask on the provider is not sufficient.","src":"Slide 24"},{"id":"c6q44","sec":"s7","q":"Swelling near the jaw and ear with fever suggests:","o":["Mumps","Diphtheria","Measles","Tetanus"],"x":"Slide 27: parotid swelling.","src":"Slide 27"},{"id":"c6q45","sec":"s7","q":"A complication of mumps is:","o":["Orchitis","Postherpetic neuralgia","Liver cancer","Pseudomembrane"],"x":"Slide 27: orchitis, meningitis, hearing loss.","src":"Slide 27"},{"id":"c6q46","sec":"s7","q":"The greatest concern with rubella is:","o":["Infection during pregnancy","Airway obstruction","Chronic liver disease","Paralysis"],"x":"Slides 32–33.","src":"Slides 32–33"},{"id":"c6q47","sec":"s7","q":"Congenital rubella syndrome effects include:","o":["Hearing loss, eye defects and congenital heart disease","Lockjaw and spasms","Orchitis, meningitis and permanent hearing loss in the newborn","Cirrhosis and jaundice"],"x":"Slide 33.","src":"Slide 33"},{"id":"c6q48","sec":"s7","q":"A susceptible pregnant patient needs rubella protection. When can MMR be given?","o":["Postpartum, because MMR is live","Immediately during pregnancy","In the second trimester only","Never"],"x":"Slide 33.","src":"Slide 33"},{"id":"c6q49","sec":"s8","q":"In suspected meningococcal disease, which is correct?","o":["Do not wait for a rash before treating possible sepsis","Treat only after the rash appears","Airborne precautions are required","Vaccination replaces assessment after exposure"],"x":"Slides 25–26.","src":"Slides 25–26"},{"id":"c6q50","sec":"s8","q":"MenACWY and MenB vaccines:","o":["Cover different serogroups","Cover exactly the same serogroups","Are live attenuated","Are toxoids"],"x":"Slide 26.","src":"Slide 26"},{"id":"c6q51","sec":"s8","q":"An infant with pertussis may present with:","o":["Apnea with little obvious cough","A one-sided blistering rash","Parotid swelling","Lockjaw"],"x":"Slide 28.","src":"Slide 28"},{"id":"c6q52","sec":"s8","q":"Antibiotics for pertussis are most useful when:","o":["Started early","Started after weeks of coughing","Given only to adults","Combined with MMR"],"x":"Slide 29: later treatment may not shorten an established cough.","src":"Slide 29"},{"id":"c6q53","sec":"s8","q":"Poliovirus spreads mainly by:","o":["The fecal–oral route","Airborne droplet nuclei","Blood exposure","Skin contact with blisters"],"x":"Slide 30.","src":"Slide 30"},{"id":"c6q54","sec":"s8","q":"Which polio vaccine gives strong intestinal immunity but carries rare vaccine-derived risks?","o":["OPV","IPV","Both equally","Neither"],"x":"Slide 31.","src":"Slide 31"},{"id":"c6q55","sec":"s8","q":"IPV is:","o":["Inactivated and given by injection","Live attenuated oral drops","A toxoid","A conjugate vaccine"],"x":"Slide 31.","src":"Slide 31"},{"id":"c6q56","sec":"s9","q":"According to the review table, which disease needs DROPLET precautions?","o":["Pertussis","Measles","Varicella","None of them"],"x":"Slide 38.","src":"Slide 38"},{"id":"c6q57","sec":"s9","q":"Which is correct about using vaccination guidance in Saudi Arabia?","o":["Use the patient's record plus current MOH guidance, not an old schedule image","Use the most recent schedule image you have saved, even if it is a few years old","Hajj requirements never change","Healthcare workers do not need documented immunity"],"x":"Slide 39.","src":"Slide 39"},{"id":"c6q60","sec":"s9","q":"Which disease needs Airborne PLUS Contact precautions in the review table?","o":["Varicella","Measles","Mumps","Influenza"],"x":"Slide 38.","src":"Slide 38"},{"id":"c6q61","sec":"s9","q":"Healthcare workers need documented vaccination and immunity according to:","o":["Occupational-health policy","Their own preference and travel plans","An old vaccination schedule image","The request of each patient they treat"],"x":"Slide 39.","src":"Slide 39"}],"cards":[{"sec":"s1","f":"Active vs passive immunity","b":"Active: own response, days–weeks, memory (vaccine, infection). Passive: ready-made antibodies, immediate, temporary (maternal antibodies, immune globulin)."},{"sec":"s1","f":"HBIG / TIG","b":"Hepatitis B immune globulin / tetanus immune globulin: passive, rapid protection after selected exposures."},{"sec":"s2","f":"Live attenuated: examples and caution","b":"MMR, varicella (also OPV). Organism replicates. Avoid in pregnancy and severe immunosuppression."},{"sec":"s2","f":"Inactivated: examples","b":"IPV, hepatitis A. Cannot replicate; may need several doses."},{"sec":"s2","f":"Toxoid: examples and target","b":"Tetanus, diphtheria. Target = the toxin (antibodies neutralize it)."},{"sec":"s2","f":"Subunit / recombinant: examples","b":"Hepatitis B, acellular pertussis, HPV, recombinant zoster."},{"sec":"s2","f":"Polysaccharide vs conjugate","b":"Polysaccharide: sugar alone, T-cell independent, weak \u003c2 y (PPSV23, Vi typhoid). Conjugate: sugar + protein, T-cell help, works in infancy (Hib, PCV, MenACWY)."},{"sec":"s3","f":"EMS approach to suspected infection","b":"Recognize & assess → Protect → Stabilize & communicate."},{"sec":"s4","f":"Varicella","b":"VZV primary infection; itchy rash in crops, all stages; airborne + contact; contagious before rash until crusted; live vaccine."},{"sec":"s4","f":"Shingles","b":"VZV reactivation; painful one-sided dermatomal rash; postherpetic neuralgia; RZV non-live 2 doses (50+, immunocompromised 18+)."},{"sec":"s5","f":"Diphtheria","b":"C. diphtheriae; grey-white pseudomembrane, airway; toxin → heart/nerves; droplet (resp) / contact (skin); antibiotics + antitoxin; toxoid (DTaP/Tdap/Td)."},{"sec":"s5","f":"Tetanus","b":"C. tetani spores via wounds; toxin blocks inhibitory signals → rigidity, spasms, lockjaw; not person to person; vaccine ± TIG."},{"sec":"s6","f":"Hepatitis A vs B","b":"A: fecal–oral, no chronic, inactivated vaccine. B: blood/body fluids, chronic (90% infant vs 5% adult), recombinant subunit vaccine."},{"sec":"s7","f":"Influenza","b":"Abrupt cough, fever, aches (may lack fever in elderly/immunocompromised); droplet; annual vaccine."},{"sec":"s7","f":"Measles","b":"Fever, cough, coryza, red eyes, Koplik spots, rash face → down; airborne (N95), air infectious up to 2 h; MMR live."},{"sec":"s7","f":"Mumps","b":"Parotid swelling; droplet; orchitis, meningitis, hearing loss; MMR."},{"sec":"s7","f":"Rubella","b":"Mild rash, low fever, lymph nodes; droplet; pregnancy → CRS (hearing, eyes, heart); MMR not in pregnancy, give postpartum."},{"sec":"s8","f":"Meningococcal disease","b":"N. meningitidis; fever, neck stiffness, non-blanching rash, rapid sepsis (don't wait for rash); droplet; MenACWY vs MenB; prophylaxis after exposure."},{"sec":"s8","f":"Pertussis","b":"B. pertussis; cold-like → coughing fits, whoop; infants apnea; droplet; early antibiotics; DTaP/Tdap (wanes)."},{"sec":"s8","f":"Polio + IPV vs OPV","b":"Fecal–oral; mostly silent; acute flaccid paralysis. IPV: inactivated injection, protects vs paralysis. OPV: live oral, intestinal immunity, rare vaccine-derived risk."},{"sec":"s9","f":"Review: airborne vs droplet diseases","b":"Airborne: measles; varicella (+contact). Droplet: influenza, respiratory diphtheria, meningococcal, mumps, pertussis, acquired rubella."}]}],"glossary":{"active":["Active immunity","المناعة النشطة","الجسم يصنع استجابته بنفسه (لقاح أو عدوى طبيعية). تحتاج أيام لأسابيع، وتدوم طويلاً مع ذاكرة مناعية."],"agent":["Infectious agent","العامل المُعدي","أول حلقة في سلسلة العدوى: بكتيريا، فيروسات، فطريات، طفيليات، بريونات."],"agp":["Aerosol-generating procedure","إجراء مولّد للرذاذ","إجراءات مثل تنظير القصبات، شفط مجرى الهواء، التنبيب الرغامي؛ تحتاج حماية كاملة كل مرة."],"aiir":["Airborne infection isolation room (AIIR)","غرفة عزل الانتقال الهوائي","غرفة بضغط سلبي، الهواء يطلع عبر فلتر HEPA أو للخارج."],"airborne":["Airborne transmission","الانتقال الهوائي","جزيئات ≤5 ميكرون (نوى القطيرات) تبقى معلّقة في الهواء وتنتقل بعيد لساعات: السل، الحصبة، جدري الماء."],"airbornep":["Airborne precautions","احتياطات الانتقال الهوائي","كمامة N95 مختبرة الملاءمة عليك، كمامة جراحية على المريض، غرفة ضغط سلبي."],"antigen":["Antigen","المستضد","مادة يقدر الجهاز المناعي يتعرّف عليها؛ اللقاح يقدّمها بدون المرض الطبيعي."],"antiseptic":["Antiseptic","مطهّر للأنسجة الحية","يُستخدم على الأنسجة الحية خاصة الجلد، مثل تحضير الجلد قبل الكانيولا."],"antisepticwash":["Antiseptic hand wash","غسل اليدين بمطهّر","صابون فيه مادة مطهّرة مع الماء: يزيل ويقتل."],"apic":["APIC","جمعية مختصي مكافحة العدوى وعلم الأوبئة","Association for Professionals in Infection Control & Epidemiology؛ كفاءاتها الأساسية 4 مجالات."],"autoclave":["Autoclave","الأوتوكلاف (جهاز التعقيم بالبخار)","يعقّم ببخار تحت ضغط، دورات شائعة 121 أو 132 درجة مئوية."],"bacteriostatic":["Bacteriostatic","مثبّط لنمو البكتيريا","يوقف نمو البكتيريا بدل ما يقتلها (مثل هيكساكلوروفين)."],"biofilm":["Biofilm","الغشاء الحيوي","طبقة حماية تكوّنها الميكروبات وتقاوم عملية التطهير أو التعقيم."],"booster":["Booster dose","جرعة معزّزة","جرعة إضافية تقوّي الحماية بعد السلسلة الأولية."],"carrier":["Asymptomatic carrier","حامل للمرض بدون أعراض","شخص يحمل الميكروب بدون أ
