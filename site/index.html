zed containers; dispensers at the point of care","CDC IA · WHO IB/IA"]]},{"t":"note","k":"ems","x":"In EMS (added for EMS 313 in the lecture) the **point of care is the side of the stretcher**: a pocket bottle for every provider and a dispenser mounted in the patient compartment, not in a cabinet in the cab."},{"t":"h","x":"When should a paramedic perform hand hygiene?"},{"t":"twocol","a":{"h":"Before","items":["Patient contact","IV insertion","Medication preparation","Airway procedures","Handling clean equipment"]},"b":{"h":"After","items":["Patient contact","Blood or body-fluid exposure","Removing gloves","Touching contaminated equipment","Cleaning the ambulance","Contact with the patient environment"]}},{"t":"order","id":"c2-moments"},{"t":"table","cap":"Right method · right timing · right technique","head":["Right method","Right timing","Right technique"],"rows":[["Rub by default; wash when soiled, after C. difficile or norovirus","Before as much as after; five moments, every call","The six rubbing steps; until dry for the rub, 40 to 60 seconds at the sink"]]},{"t":"note","k":"key","x":"You cannot control what the patient carries or how long microorganisms survive on skin. **You can always control step 4.**"}],"recall":[{"q":"List the WHO five moments.","a":"1 Before touching the patient · 2 Before a clean/aseptic procedure · 3 After body-fluid exposure risk · 4 After touching the patient · 5 After touching the patient's surroundings."},{"q":"Is compliance higher before or after patient contact? Why?","a":"After. Providers protect themselves more than the patient."},{"q":"Where is the \"point of care\" in EMS?","a":"The side of the stretcher: pocket bottle per provider + dispenser in the patient compartment."}]},{"id":"s9","title":"Common EMS mistakes and scenarios","src":"Slides 29–33","blocks":[{"t":"note","k":"added","x":"Slides 29 and 30 (common EMS mistakes, practical scenarios) are marked in the lecture \"ADDED FOR EMS 313 · NOT IN ORIGINAL CHAPTER 2\"."},{"t":"table","cap":"Common EMS hand-hygiene mistakes and fixes","quiz":true,"head":["Mistake","Fix"],"rows":[["Changing gloves without hand hygiene","Hand hygiene before and after every pair"],["Alcohol rub on visibly bloody hands","Soap and water first; alcohol does not work through blood"],["Touching a personal phone during patient care","Phone stays out of the patient compartment, or is disinfected after every patient"],["Rubbing while walking, dry in 10 seconds","Enough product, all surfaces, until dry: about 30 seconds"],["Wiping gloves to keep them on for the next task","Gloves are single use: remove, discard, hand hygiene"],["Refilling half-empty bottles; storing rub in a hot cabin","Pre-filled bottles only; store away from heat"]]},{"t":"h","x":"Practical scenarios (slide 30)"},{"t":"p","x":"The slide gives the scenarios without answers. The model answers below are **applied from other Chapter 2 slides**, which are cited after each point."},{"t":"case","title":"Respiratory patient","src":"Slide 30 · answer from slides 4, 22, 24, 27","x":"A patient with pneumonia coughs continuously during a 20-minute transport. You adjust his oxygen mask twice and hold the rail on every turn.","q":"Which moments of hand hygiene apply? Which surfaces need cleaning before the next patient?","a":"**Moments:** moment 1 before and moment 4 after each time you touch him to adjust the oxygen mask; moment 5 after holding the rail, because the rail is part of the patient's surroundings (slide 27). Moment 3 also applies if your hands may have touched his respiratory secretions (inferred from slides 4 and 27). Gloves do not replace any of these (slide 22). **Surfaces:** a coughing patient's droplets land on the rails, the monitor and the oxygen tubing (slide 4). Before the next patient, clean the high-touch surfaces you touched, such as stretcher rails and straps, monitor and cables, door handles and grab rails, and clean your hands too: consecutive patients share every surface you touched unless the surfaces and your hands were cleaned (slide 24)."},{"t":"case","title":"IV insertion in a moving ambulance","src":"Slide 30 · answer from slides 15–17, 22, 27","x":"You need an IV in a stable patient during transport. There is no sink. Your hands are not visibly soiled.","q":"Which method, when, and what do you do with the gloves before and after?","a":"**Method:** alcohol-based hand rub. No sink is needed and the hands are not visibly soiled, so the field default applies (slide 15). **When:** before the IV insertion (slide 27 lists \"IV insertion\" under Before; as a clean or aseptic procedure it also fits WHO moment 2, inferred from slide 27) and again after removing the gloves (slide 27). **Gloves:** hand hygiene → put on gloves → insert the IV → remove gloves → hand hygiene (slide 22). Cover all surfaces and rub until dry, 20 to 30 seconds; never wipe or shake the hands to dry them faster (slides 16–17)."},{"t":"case","title":"Needlestick during a trauma call","src":"Slide 30 · answer from slides 8–9, 22, 27, 29","x":"While securing the IV in a bleeding patient, the needle pricks your finger through the glove.","q":"What are your immediate actions in the first minute? What follows?","a":"**What Chapter 2 covers (inferred from the slides cited):** remove and discard the pricked glove, because gloves are single use (slides 22, 29). Blood on the hand means visibly soiled hands, so wash with **soap and water**, not alcohol rub: alcohol does not work through blood, and blood must be removed before any antiseptic can work properly (slides 8, 9, 29). Hand hygiene is required after blood or body-fluid exposure and after removing gloves (slide 27), and again before a new pair (slide 22). **What follows:** Chapter 2 gives no needlestick or exposure-reporting steps; see the note below."},{"t":"note","k":"added","x":"The \"what follows\" part of the needlestick scenario is **not in Chapter 2**. It is covered in the Vaccines lecture (Unit 6): after a needlestick injury, report the exposure immediately and seek prompt assessment for vaccine and/or immune globulin. The assessment considers the type of exposure, the vaccination history and the documented vaccine response (Vaccines slide 21 and its speaker notes; slide 14: \"report exposures\")."},{"t":"h","x":"Key takeaways"},{"t":"ul","items":["Hand hygiene is one of the most important infection-prevention practices.","Hand hygiene protects the patient and the provider.","Alcohol-based hand rub and soap and water are not interchangeable in every situation.","Gloves do not replace hand hygiene.","Hands and equipment can transmit microorganisms between patients.","Hand hygiene is a clinical patient-safety intervention, not just a routine task."]}],"recall":[{"q":"Fix for \"rubbing while walking, dry in 10 seconds\"?","a":"Enough product, all surfaces, until dry: about 30 seconds."},{"q":"Fix for \"wiping gloves to keep them on\"?","a":"Gloves are single use: remove, discard, hand hygiene."},{"q":"IV in a moving ambulance, no sink, hands not soiled: which method and which glove sequence?","a":"Alcohol-based hand rub (slide 15); hand hygiene → gloves → IV → remove gloves → hand hygiene (slide 22)."}]}],"orders":[{"id":"c2-hands","sec":"s2","src":"Slide 7","title":"Five steps for transmission through hands","steps":["Microorganisms on the patient's skin, surfaces or equipment","They transfer to the provider's hands","They survive on the hands for at least several minutes","Hand hygiene is missed, done badly or with the wrong agent","Contaminated hands touch the next patient or equipment"]},{"id":"c2-six","sec":"s5","src":"Slide 16","title":"The six rubbing steps (2 to 7)","steps":["Palm to palm","Right palm over the back of the left hand, fingers interlaced (and vice versa)","Palm to palm with fingers interlaced","Backs of fingers against the opposite palm, fingers interlocked","Rotational rubbing of each thumb held in the other palm","Rotational rubbing of the fingertips in the opposite palm"]},{"id":"c2-wash","sec":"s5","src":"Slide 16","title":"Hand washing with soap and water: whole procedure","steps":["Wet hands with water","Apply enough soap to cover all hand surfaces","Six rubbing steps (2 to 7)","Rinse hands with water","Dry thoroughly with a single-use towel","Use the towel to turn off the tap"]},{"id":"c2-gloves","sec":"s7","src":"Slide 22","title":"The correct glove sequence, every time","steps":["Hand hygiene","Put on gloves","Patient care","Remove gloves","Hand hygiene"]},{"id":"c2-moments","sec":"s8","src":"Slide 27","title":"WHO five moments, in order","steps":["Before touching the patient","Before a clean or aseptic procedure","After body-fluid exposure risk","After touching the patient","After touching the patient's surroundings"]}],"sorts":[{"id":"c2-method","sec":"s4","src":"Slides 11–12, 15","title":"Alcohol rub or soap and water?","cats":["Alcohol-based hand rub","Soap and water"],"items":[["Between routine patient contacts, hands look clean",0],["Blood on your wrist after removing gloves",1],["Patient with known C. difficile, hands look clean",1],["Norovirus outbreak call",1],["Before an IV in a moving ambulance, no sink, hands not soiled",0],["Diarrhoea call",1],["After touching the stretcher rail (no visible soil)",0],["Hands visibly dirty with faeces",1]]}],"questions":[{"id":"c2q1","sec":"s1","q":"Which organizations recommend hand hygiene as the first line of infection prevention?","o":["CDC (2002) and WHO (2009)","APIC (2002) and CBIC (2009)","FDA (1994) and CDC (2007)","WHO (2002) and NIOSH (2009)"],"x":"The slide names the CDC (2002) and the WHO (2009). The other pairs mix in agencies or years the slide does not give for this recommendation; FDA 1994 is the triclosan ruling on slide 14 (slide 3).","src":"Slide 3"},{"id":"c2q2","sec":"s1","q":"What is the average hand hygiene compliance of healthcare workers in observational studies?","o":["40%","81%","5%","60%"],"x":"The average is 40%. 5% and 81% are the two ends of the range, not the average (slide 3).","src":"Slide 3"},{"id":"c2q3","sec":"s1","q":"Category IB means a recommendation is:","o":["Strongly recommended, supported by some studies and strong reasoning","Strongly recommended, supported by strong studies","Optional, based on expert opinion and local preference rather than evidence","Less binding than a Category IA recommendation"],"x":"IB = strongly recommended, supported by some studies and strong reasoning; \"strong studies\" describes IA. IA and IB are equally binding, because the letter shows the strength of the evidence, not of the rule (slide 3).","src":"Slide 3"},{"id":"c2q4","sec":"s1","q":"In the 1847 Vienna hospital, why was the death rate higher on the doctors' ward?","o":["Doctors came directly from the autopsy room to deliver babies","Midwives performed autopsies before deliveries and did not wash their hands","Doctors washed with an antiseptic solution that irritated the mothers' skin","The midwives' ward already used antiseptic hand washing"],"x":"Doctors came straight from the autopsy room to deliver babies; midwives did not perform autopsies and had a much lower death rate. Compulsory antiseptic hand washing was the later intervention that made deaths fall, not the cause (slide 5).","src":"Slide 5"},{"id":"c2q5","sec":"s1","q":"According to the lecture, the main difficulty with hand hygiene today is:","o":["Behaviour, not knowledge","Lack of evidence that hand washing saves lives","Cost of alcohol rub","Lack of approved agents"],"x":"The evidence has been clear for more than 170 years, so the difficulty is behaviour, not knowledge or a lack of evidence (slide 5).","src":"Slide 5"},{"id":"c2q6","sec":"s1","q":"Which statement about microorganisms on hands is correct?","o":["Wet hands transfer more microorganisms than dry hands","Microorganisms die within a few seconds on the dry skin of the hands","More contacts per hour lower the risk","Moisture reduces transfer between surfaces"],"x":"Moisture increases transfer: wet hands move more microorganisms than dry ones. Microorganisms survive on hands for several minutes, and more contacts per hour mean more risk (slide 4).","src":"Slide 4"},{"id":"c2q7","sec":"s2","q":"Transient flora is:","o":["On the surface layers, easily removed, most often the cause of HAI","Attached to the deeper skin layers, difficult to remove, and normal and protective","Normal and protective permanent skin bacteria","Removed by surgical scrubbing with brushes, not by washing"],"x":"Transient flora sits on the surface layers, is easily removed by hand washing and is most often the cause of HAI. Deeper, hard-to-remove, \"normal and protective\" flora is resident flora (slide 6).","src":"Slide 6"},{"id":"c2q8","sec":"s2","q":"Which body area carries the highest risk for colonisation?","o":["Perineal and groin area","Armpits","Fingertips and under the nails","Upper limbs"],"x":"Highest risk: the perineal and groin area, then armpits, trunk and upper limbs (slide 6). Fingertips and under the nails are the area most often missed during hand hygiene (slide 17), not the highest colonisation risk.","src":"Slide 6"},{"id":"c2q9","sec":"s2","q":"Which of the five steps of hand transmission does the provider fully control?","o":["Step 4: performing hand hygiene","Step 1: organisms on the patient","Step 3: survival on the hands","Step 2: transfer to the hands"],"x":"You cannot control what the patient carries or how long microorganisms survive, but step 4 (hand hygiene) is the only step the provider fully controls. Break it and the chain stops (slides 7, 28).","src":"Slide 7"},{"id":"c2q10","sec":"s2","q":"Which factor is NOT listed as increasing transfer of transient flora?","o":["The age of the provider","The type of microorganism","The number present","The level of moisture"],"x":"Slide 6 lists three factors: the type of microorganism, the number present and the level of moisture. The provider's age is not one of them (slide 6).","src":"Slide 6"},{"id":"c2q11","sec":"s3","q":"Hand washing with plain soap and water:","o":["Removes dirt and transient flora but does not kill","Kills spores and non-enveloped viruses that alcohol misses","Has substantial residual activity","Reduces resident flora for hours"],"x":"Plain soap works by detergent action: it removes dirt and transient flora but has little or no antimicrobial activity. It has no residual activity, and spores are removed by washing and rinsing, not killed (slides 8–9, 15).","src":"Slides 8–9"},{"id":"c2q12","sec":"s3","q":"Surgical hand antisepsis differs from routine hand hygiene because it:","o":["Includes the forearms and reduces resident flora","Uses plain soap without an antiseptic agent","Is done after removing sterile gloves, at the end of the operation","Uses brushes and long scrub times"],"x":"Surgical hand antisepsis uses antiseptic agents on the hands and forearms before sterile procedures; it removes transient flora and reduces resident flora. Brushes and long scrubs are not recommended (slides 8, 19, 20).","src":"Slides 8, 19"},{"id":"c2q13","sec":"s3","q":"What is the effective alcohol concentration for hand rubs?","o":["60% to 95%","30% to 50%","95% to 100%","10% to 30%"],"x":"Alcohol is effective at 60% to 95% mixed with water. Above 95% is less effective because the reaction needs water (slide 10).","src":"Slide 10"},{"id":"c2q14","sec":"s3","q":"Why is alcohol above 95% LESS effective?","o":["The protein-denaturing reaction needs water","It is too irritating to use on the skin","It evaporates too slowly and leaves the hands wet","It is inactivated by hand creams"],"x":"Alcohol kills by denaturing proteins, and that reaction needs water; without water, alcohol evaporates before it can denature proteins. Inactivation by hand creams belongs to chlorhexidine (slides 10, 13).","src":"Slide 10"},{"id":"c2q15","sec":"s3","q":"Which agent has SUBSTANTIAL residual activity and is minimally affected by blood?","o":["Chlorhexidine gluconate","Alcohol","Plain soap","Quaternary ammonium compounds"],"x":"CHG has substantial residual activity and is minimally affected by blood. Alcohol has no residual activity and is less effective with blood present; quats are decreased by blood (slides 11, 13, 14).","src":"Slide 13"},{"id":"c2q16","sec":"s3","q":"Chlorhexidine can be inactivated by:","o":["Natural soaps and hand creams (anionic emulsifying agents)","Blood and other organic material such as body fluids on the hands","Water used to rinse","Non-ionic surfactants"],"x":"Natural soaps and hand creams (anionic emulsifying agents) inactivate CHG, while blood barely affects it. Non-ionic surfactants neutralise PCMX, not CHG (slide 13).","src":"Slide 13"},{"id":"c2q17","sec":"s3","q":"Which agent is toxic, absorbed through the skin, and not generally recognised by the FDA as safe and effective as an antiseptic hand wash, especially for infant bathing?","o":["Hexachlorophene","Triclosan","Chloroxylenol (PCMX)","Povidone-iodine"],"x":"Hexachlorophene is toxic and absorbed through the skin, and the infant-bathing warning is its FDA position. For PCMX and triclosan the FDA says there is not enough data to classify them (slides 13, 14).","src":"Slide 13"},{"id":"c2q18","sec":"s3","q":"Most iodophor hand-hygiene formulations contain:","o":["7.5% to 10% povidone-iodine","0.2% to 2% povidone-iodine","60% to 95% povidone-iodine","1% povidone-iodine"],"x":"Most iodophor formulations contain 7.5% to 10% povidone-iodine. 0.2% to 2% is the triclosan range, 60% to 95% is alcohol and 1% is the chlorhexidine eye warning (slides 10, 13, 14).","src":"Slide 14"},{"id":"c2q19","sec":"s3","q":"Triclosan is LESS effective against:","o":["Gram-negative organisms, especially Pseudomonas aeruginosa","Gram-positive organisms including MRSA","Mycobacteria and Candida","Any organism when organic matter such as blood is present on the skin"],"x":"Triclosan is most effective against gram-positive organisms including MRSA, reasonably effective against mycobacteria and Candida, and not substantially affected by organic matter. Its weak spot is gram-negative organisms, especially Pseudomonas aeruginosa (slide 14).","src":"Slide 14"},{"id":"c2q20","sec":"s3","q":"Quaternary ammonium compounds (as hand agents) are:","o":["More effective against gram-negative, less against gram-positive","Highly effective against mycobacteria, fungi and gram-positive bacteria","Unaffected by blood and other organic matter on the hands","Compatible with anionic detergents"],"x":"As hand agents, quats are more effective against gram-negative and less against gram-positive bacteria. They are minimally effective against mycobacteria and fungi, are decreased by blood and are not compatible with anionic detergents (slide 14).","src":"Slide 14"},{"id":"c2q21","sec":"s3","q":"Conjunctivitis and severe corneal damage have been reported with:","o":["1% chlorhexidine","70% alcohol","10% povidone-iodine","2% triclosan"],"x":"The eye warning belongs to 1% chlorhexidine: keep it away from the eyes. 7.5–10% is the povidone-iodine range and 0.2–2% the triclosan range, with no eye warning given (slides 13, 14).","src":"Slide 13"},{"id":"c2q22","sec":"s3","q":"Chloroxylenol (PCMX) compared with chlorhexidine:","o":["Has less residual activity and needs a longer time to work","Has more residual activity than chlorhexidine and acts faster on the skin","Is classified by the FDA as safe and effective","Is strongly inactivated by blood and organic matter"],"x":"PCMX needs a longer time to work and has less residual activity than chlorhexidine. It is only minimally affected by organic matter, and the FDA has not enough information to classify it as safe and effective (slide 13).","src":"Slide 13"},{"id":"c2q23","sec":"s4","q":"Alcohol-based hand rub is POOR against:","o":["C. difficile spores and norovirus","MRSA and other MDROs","Mycobacterium tuberculosis","Influenza, HIV and other enveloped viruses"],"x":"Alcohol is poor against bacterial spores (C. difficile), protozoan cysts and non-enveloped viruses such as norovirus. It does cover MDROs, TB and enveloped viruses such as influenza and HIV (slides 10, 11).","src":"Slide 11"},{"id":"c2q24","sec":"s4","q":"An elderly patient with C. difficile is transported; your hands look clean after removing gloves. Best action?","o":["Wash hands with soap and water","Apply alcohol-based hand rub for 20 seconds","Apply alcohol-based hand rub twice","No hand hygiene is needed because gloves were worn"],"x":"Alcohol is poor against C. difficile spores, however long or often you rub, so soap and water is needed even when hands look clean; gloves do not replace hand hygiene. Knowledge check 1 (slide 12); answer derived from slides 11, 15 and 22, as the speaker notes are not in the file.","src":"Slides 11–12"},{"id":"c2q25","sec":"s4","q":"Which statement about alcohol-based hand rub is correct?","o":["It has no residual activity; the effect ends when hands are dry","It is the best choice when hands are visibly soiled with blood or faeces","It removes spores by mechanical action","Its activity is increased by blood on the hands"],"x":"Alcohol has no persistent or residual activity: the effect ends when the hands are dry. It is less effective with blood present, so visibly soiled hands need soap and water (slides 8, 11).","src":"Slide 11"},{"id":"c2q26","sec":"s4","q":"How long does a complete soap-and-water hand wash take (WHO)?","o":["40 to 60 seconds","20 to 30 seconds","10 to 15 seconds","2 to 3 minutes"],"x":"A full soap-and-water hand wash takes 40 to 60 seconds; 20 to 30 seconds is the alcohol hand rub (WHO) (slides 15, 17).","src":"Slides 15, 17"},{"id":"c2q27","sec":"s4","q":"The default hand hygiene method in the field is:","o":["Alcohol-based hand rub","Plain soap and water","Antiseptic hand wash","Surgical hand antisepsis"],"x":"Alcohol-based hand rub is the field default because it is fast and needs no sink. Switch to soap and water when hands are visibly soiled or after C. difficile or norovirus exposure (slide 15).","src":"Slide 15"},{"id":"c2q28","sec":"s5","q":"If your hands are dry 10 seconds after a hand rub, it means:","o":["You used too little product","The product worked very fast","You completed the rub correctly","The alcohol concentration was too low"],"x":"If your hands are dry in 10 seconds, you used too little. A correct rub covers all surfaces and continues until dry, 20 to 30 seconds (slides 16, 17, 29).","src":"Slide 17"},{"id":"c2q29","sec":"s5","q":"Which of these is one of the areas most often missed during hand hygiene?","o":["Fingertips and under the nails","The palms (palm to palm, step 2)","The forearms","The elbows"],"x":"Slide 17 lists four commonly missed areas: fingertips and under the nails (step 7), thumbs (step 6), between the fingers (steps 3 and 4), and backs of the hands and wrists. Palms, forearms and elbows are not on the list (slide 17).","src":"Slide 17"},{"id":"c2q30","sec":"s5","q":"In soap-and-water hand washing, why use the towel to turn off the tap?","o":["You touched the tap with contaminated hands before washing","Running water spreads resident flora onto the hands","It speeds up drying of the hands","The paper towel adds residual antiseptic activity to the clean hands"],"x":"You turned the tap on with contaminated hands before washing, so touching it again with clean hands brings the contamination back (slide 17).","src":"Slide 17"},{"id":"c2q31","sec":"s5","q":"What is the CDC minimum rubbing time quoted in the source deck?","o":["At least 15 seconds","At least 60 seconds","At least 5 seconds","At least 2 minutes"],"x":"At least 15 seconds of rubbing is the CDC minimum quoted in the source deck. The WHO times are 20–30 seconds for a rub and 40–60 seconds for a wash (slide 17).","src":"Slide 17"},{"id":"c2q32","sec":"s6","q":"Why add chlorhexidine to an alcohol surgical hand rub?","o":["It keeps working for hours as resident flora regrows inside gloves","It speeds up drying of the hands","It removes visible soil and blood from the forearms before the alcohol is applied","It replaces the need for a prewash"],"x":"Alcohol kills fast but stops working when dry, and a long operation inside a warm, moist glove lets resident flora regrow; chlorhexidine keeps working for hours (slide 19).","src":"Slide 19"},{"id":"c2q33","sec":"s6","q":"A surgical team needs skin protection through a three-hour operation inside sterile gloves. Which property matters most?","o":["Residual (persistent) activity, for example from chlorhexidine","Fast onset of action","A pleasant fragrance","The highest possible alcohol concentration, ideally above 95% (99%)"],"x":"Only residual activity keeps working for hours inside the glove. Fast onset ends when the alcohol dries, and alcohol above 95% is less effective. Final knowledge check Q4 (slide 32); answer derived from slides 10 and 19.","src":"Slides 19, 32"},{"id":"c2q34","sec":"s6","q":"Why are brushes and long scrub times NOT recommended for surgical antisepsis?","o":["They damage skin and bring resident flora up, so counts rise","They remove too much transient flora, leaving the hands without protection","They inactivate chlorhexidine","They spread transient flora from the forearms back onto the hands"],"x":"Scrubbing damages the skin and brings resident flora up from the deeper layers, so the bacterial count rises instead of falling. The product's contact time does the work (slide 20).","src":"Slide 20"},{"id":"c2q35","sec":"s6","q":"In settings that require surgical hand antisepsis, artificial nails are:","o":["Prohibited (WHO IB)","Allowed if short","Allowed with double gloving","Allowed after a 5-minute scrub"],"x":"Artificial nails are prohibited in settings that require surgical hand antisepsis (WHO IB). The slide gives no exception for length, gloving or scrub time (slide 20).","src":"Slide 20"},{"id":"c2q36","sec":"s7","q":"Never top up a partly full hand-rub dispenser. This is Category:","o":["IA","IB","II","IC"],"x":"Not topping up a partly full dispenser is Category IA, because of the contamination risk; use pre-filled bags or bottles. Low irritation, asking the staff and teaching skin care are IB (slide 21).","src":"Slide 21"},{"id":"c2q37","sec":"s7","q":"A paramedic removes gloves between two patients and immediately puts on a new pair without hand hygiene. This is:","o":["Not acceptable: hand hygiene is required after removing gloves and before new ones","Acceptable, because the new gloves are clean","Acceptable, because the first patient had no known infection and the gloves looked clean","Acceptable if the first pair was worn less than ten minutes"],"x":"New gloves do not make contaminated hands clean: hands become contaminated while removing gloves, so hand hygiene is needed before the next pair. Knowledge check 2 (slide 23); answer derived from slide 22 (HH → gloves → care → remove → HH).","src":"Slides 22–23"},{"id":"c2q38","sec":"s7","q":"Which is one of the four glove rules (CDC and WHO, IB)?","o":["Never wash gloves for re-use","Wash gloves with alcohol between tasks","One pair may be used for two patients from the same family","Gloves may replace hand hygiene for short contacts"],"x":"The four rules: remove gloves after caring for the patient, dispose of them after use, never use the same pair for more than one patient, never wash gloves for re-use. Gloves do not replace hand hygiene (slide 22).","src":"Slide 22"},{"id":"c2q39","sec":"s7","q":"Why does cost NOT come first when choosing a hand-hygiene product?","o":["A cheap product that dries the skin lowers compliance","Expensive products contain more alcohol","Staff choose a product by its price, not by its feel or fragrance","Cheap products usually have more residual activity than expensive ones"],"x":"A cheap product that dries the skin lowers compliance and ends up costing more; feel, fragrance and skin tolerance decide whether staff use it (slide 21, CDC IB · WHO II).","src":"Slide 21"},{"id":"c2q40","sec":"s8","q":"Observation studies show hand hygiene compliance is LOWER:","o":["Before patient contact than after","Among nurses than physicians","By day than at night","After a dirty task than a clean one"],"x":"Compliance is lower before patient contact than after, because providers protect themselves more than the patient. The other options are reversed: compliance is lower among physicians, at night and after a clean task (slide 25).","src":"Slide 25"},{"id":"c2q41","sec":"s8","q":"\"Gloves are enough\" is classified as which type of barrier to compliance?","o":["Beliefs","System","Culture"],"x":"\"Gloves are enough\" is a Beliefs barrier, like \"patient seen as low risk\" and forgetfulness. System barriers are things like distant sinks and lack of time; Culture barriers are things like no role model and no feedback (slide 25).","src":"Slide 25"},{"id":"c2q42","sec":"s8","q":"You unload the stretcher, wipe the rails and adjust monitor cables but never touch the patient. Is hand hygiene required before the next call?","o":["Yes, contact with the patient's surroundings and equipment requires it","No, because there was no direct patient contact","No, because the rails were wiped with disinfectant before you touched the cables","Only if the patient had a known infection"],"x":"Touching the patient's surroundings is WHO moment 5, and equipment carries microorganisms to the next patient, so hand hygiene is required without any patient contact. Knowledge check 3 (slide 31); answer derived from slides 24 and 27.","src":"Slides 27, 31"},{"id":"c2q43","sec":"s8","q":"WHO moment 5 is:","o":["After touching the patient's surroundings","Before touching the patient","Before a clean or aseptic procedure","After body-fluid exposure risk"],"x":"Moment 5 is after touching the patient's surroundings. Moment 1 is before touching the patient, moment 2 before a clean or aseptic procedure, moment 3 after body-fluid exposure risk and moment 4 after touching the patient (slide 27).","src":"Slide 27"},{"id":"c2q44","sec":"s8","q":"Which hand-hygiene recommendation is WHO Category IA?","o":["Education that targets the barriers to compliance","Making compliance an institutional priority with funding","Asking staff about the feel and fragrance of products","Teaching staff skin care to reduce irritation"],"x":"Education that targets the barriers is WHO IA (slide 26). Institutional priority is CDC and WHO IB (slide 26); asking the staff and teaching skin care are IB (slide 21).","src":"Slides 21, 26"},{"id":"c2q45","sec":"s9","q":"A colleague buys 99% alcohol believing it is stronger than the unit's 70% hand rub. What should you tell him?","o":["Concentrations above 95% are less effective because alcohol needs water","He is right; a higher alcohol concentration always kills more microorganisms faster","Both work the same; the difference is only price","99% is better only for visibly soiled hands"],"x":"Alcohol needs water to denature proteins, so concentrations above 95% are less effective; 60–95% is the effective range. Visibly soiled hands need soap and water whatever the concentration. Final knowledge check Q5 (slides 8, 10, 32).","src":"Slides 10, 32"},{"id":"c2q46","sec":"s9","q":"The fix for \"rubbing while walking, dry in 10 seconds\" is:","o":["Enough product, all surfaces, until dry: about 30 seconds","Rub for 5 seconds, then shake or wipe the hands dry to save time between calls","Switch to wiping hands on a towel","Use 99% alcohol so it dries faster"],"x":"The fix is enough product, all surfaces, rubbed until dry: about 30 seconds (slide 29). Never wipe or shake the hands to speed up drying (slide 17), and alcohol above 95% is less effective (slide 10).","src":"Slide 29"},{"id":"c2q47","sec":"s9","q":"The fix for \"wiping gloves to keep them on for the next task\" is:","o":["Gloves are single use: remove, discard, then hand hygiene","Wipe them with alcohol rub and continue with the next task","Wash them with soap and water between tasks","Put a second clean pair over the first pair"],"x":"Gloves are single use: remove, discard, then hand hygiene (slide 29). Gloves are never washed for re-use or used for more than one patient (slide 22).","src":"Slide 29"},{"id":"c2q48","sec":"s9","q":"Which statement is one of the chapter's key takeaways?","o":["Hand hygiene is a patient-safety intervention, not just a routine task","Gloves can replace hand hygiene for short patient contacts","Alcohol-based hand rub and soap and water are interchangeable in every situation","Equipment cannot transmit microorganisms between patients"],"x":"The takeaways say hand hygiene is a clinical patient-safety intervention. The other three reverse takeaways: gloves do not replace hand hygiene, rub and soap are not interchangeable in every situation, and hands and equipment can transmit microorganisms (slide 33).","src":"Slide 33"},{"id":"c2q49","sec":"s9","q":"The fix for \"refilling half-empty bottles; storing rub in a hot cabin\" is:","o":["Pre-filled bottles only; store away from heat","Top up the bottle at the station, not in the ambulance","Refill the bottle once it is less than a quarter full","Store the rub in the cab so it stays close to the crew"],"x":"Never top up a partly full dispenser, anywhere (contamination risk, IA): use pre-filled bottles. Alcohol is flammable and volatile, so store it away from heat; the point of care is the patient compartment, not the cab (slides 11, 21, 26, 29).","src":"Slides 21, 29"},{"id":"c2q50","sec":"s6","q":"For surgical hand antisepsis, slide 19 gives which concentration range for alcohol COMBINED with a quaternary ammonium compound, hexachlorophene or chlorhexidine gluconate?","o":["50% to 95%","60% to 95%","70% to 99%","30% to 50%"],"x":"Combined with a quat, hexachlorophene or CHG, the range starts lower, at 50% to 95%. 60% to 95% is the range for alcohol alone, so do not mix up the two (slide 19).","src":"Slide 19"},{"id":"c2q51","sec":"s1","q":"Category IA and Category IB recommendations are equally binding.","o":["True","False"],"a":0,"fix":true,"x":"True. Both are strongly recommended and equally binding; the letter shows the strength of the evidence, not the strength of the rule (slide 3).","src":"Slide 3"},{"id":"c2q52","sec":"s2","q":"Resident flora is most often the cause of healthcare-associated infection.","o":["True","False"],"a":1,"fix":true,"x":"False. Transient flora (surface layers, picked up from the last patient or equipment) is most often the cause; resident flora is less often the cause (slide 6).","src":"Slide 6"},{"id":"c2q53","sec":"s3","q":"Repeated washing with plain soap can paradoxically increase bacterial counts on the skin.","o":["True","False"],"a":0,"fix":true,"x":"True. Slide 9 lists this among the limitations of plain soap, with skin irritation and dryness from frequent use (slide 9).","src":"Slide 9"},{"id":"c2q54","sec":"s4","q":"Alcohol-based hand rub keeps working (residual activity) after the hands are dry.","o":["True","False"],"a":1,"fix":true,"x":"False. Alcohol has no persistent or residual activity: the effect ends when the hands are dry. That is why chlorhexidine is added for long operations (slides 11, 15, 19).","src":"Slides 11, 15"},{"id":"c2q55","sec":"s5","q":"Hand rub and hand washing use the same six rubbing steps (steps 2 to 7).","o":["True","False"],"a":0,"fix":true,"x":"True. Steps 2 to 7 are identical in both. Only the start (product vs wetting and soap) and the end (rub until dry vs rinse, dry and turn off the tap with the towel) differ (slide 16).","src":"Slide 16"},{"id":"c2q56","sec":"s6","q":"Long scrub times are necessary for effective surgical hand antisepsis.","o":["True","False"],"a":1,"fix":true,"x":"False. Long scrub times are not necessary (CDC and WHO IB): scrub for the time the manufacturer suggests. Long scrubbing damages the skin and brings resident flora up (slide 20).","src":"Slide 20"},{"id":"c2q57","sec":"s7","q":"Wearing gloves reduces the need for hand hygiene.","o":["True","False"],"a":1,"fix":true,"x":"False. WHO Category IB: the use of gloves does not reduce the need for hand hygiene. Gloves can have tiny holes, and hands become contaminated while removing them (slide 22).","src":"Slide 22"},{"id":"c2q58","sec":"s8","q":"Hand hygiene compliance falls as the number of hand-hygiene opportunities per hour rises.","o":["True","False"],"a":0,"fix":true,"x":"True. Compliance falls as the opportunities per hour rise, which is exactly when it matters most (slide 25).","src":"Slide 25"},{"id":"c2q59","sec":"s9","q":"Respiratory patient (slide 30): during transport you hold the stretcher rail on every turn, without touching the patient at that moment. Which WHO moment covers hand hygiene after holding the rail?","o":["Moment 5: after touching the patient's surroundings","Moment 4: after touching the patient and his oxygen mask","Moment 1: before touching the patient","Moment 2: before a clean or aseptic procedure"],"x":"The rail is part of the patient's surroundings, so moment 5 applies; compare knowledge check 3 (slides 27, 31). Moments 1 and 4 apply each time you touch the patient to adjust his mask. Applied from slide 27; slide 30 gives no answer key.","src":"Slides 27, 30"},{"id":"c2q60","sec":"s9","q":"IV insertion in a moving ambulance (slide 30): no sink, hands not visibly soiled. Which sequence fits the lecture?","o":["Hand rub → gloves → insert IV → remove gloves → hand rub","Gloves → insert IV → remove gloves → hand rub","Hand rub → gloves → insert IV → keep gloves on for the next task","Gloves only, then soap and water at the hospital sink"],"x":"With no sink and clean-looking hands, alcohol rub is the method (slide 15). Hand hygiene comes before the gloves and after removing them (slide 22), and gloves are single use, not kept for the next task (slide 29). Applied from these slides; slide 30 gives no answer key.","src":"Slides 15, 22, 30"},{"id":"c2q61","sec":"s9","q":"Needlestick during a trauma call (slide 30): after you remove the pricked glove, there is blood on your hand. Which hand-hygiene step fits Chapter 2?","o":["Wash with soap and water, because blood-soiled hands need washing","Rub with alcohol-based hand rub, because it is fast and kills","Put a new glove on over the hand and continue care","Wipe the hand with a chlorhexidine wipe, since blood barely affects it"],"x":"Blood on the hands means visibly soiled hands, which need soap and water: blood must be removed before any antiseptic can work, and alcohol does not work through blood (slides 8, 9, 29). Inferred from these slides; Ch2 has no needlestick protocol.","src":"Slides 8–9, 29, 30"},{"id":"c2q62","sec":"s5","q":"While an alcohol hand rub is drying, which rule applies?","o":["Keep rubbing; never wipe or shake the hands to speed up drying","Wipe the hands on a single-use towel once the six steps are done","Shake the hands after 10 seconds so the alcohol evaporates evenly","Rinse the hands with water once the product feels sticky"],"x":"Keep rubbing until the hands are dry and never wipe or shake them, because the product must finish working. The single-use towel belongs to the soap-and-water wash, not the rub (slides 16, 17).","src":"Slides 16–17"},{"id":"c2q63","sec":"s7","q":"Which is one of the reasons the lecture gives for why gloves are NOT enough?","o":["Hands become contaminated while the gloves are being removed","Gloves inactivate the alcohol rub applied before them","Gloves lose their protection after ten minutes of wear","The dry space inside a glove kills resident flora on the skin"],"x":"Slide 22 gives three reasons: tiny holes you cannot see, contamination of the hands during glove removal, and a warm, moist space inside the glove that lets bacteria multiply. So the inside of a glove is warm and moist, not dry (slide 22).","src":"Slide 22"},{"id":"p1q2","sec":"s3","q":"Chlorhexidine gluconate is only minimally affected by the presence of blood and other organic materials.","o":["True","False"],"fix":true,"x":"True. Being minimally affected by organic material such as blood is one of CHG's listed advantages (slide 13).","src":"Slide 13","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":2}},{"id":"p1q3","sec":"s3","q":"Formulations with a 100% alcohol content have the most effective antimicrobial properties.","o":["True","False"],"a":1,"fix":true,"x":"False. Above 95% is less effective because the reaction needs water (slide 10).","src":"Slide 10","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":3}},{"id":"p1q6","sec":"s3","q":"Alcohols have antimicrobial properties because they denature proteins that are in the pathogens.","o":["True","False"],"fix":true,"x":"True. Ethanol or isopropanol denatures (breaks down) the proteins of microorganisms (slide 10).","src":"Slide 10","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":6}},{"id":"p1q9","sec":"s3","q":"All of the following hand hygiene agents have some persistent activity after handwashing EXCEPT:","o":["Alcohols","Hexachlorophene","Chlorhexidine gluconate","Triclosan"],"x":"Alcohol has no persistent or residual activity (slide 11). CHG, hexachlorophene and triclosan do (slides 13–14).","src":"Slides 11, 13–14","past":{"file":"Quiz 1 , ch 1&2 (45).pdf","n":9}}],"cards":[{"sec":"s1","f":"Hand hygiene is recommended as the first line of infection prevention by…","b":"CDC (2002) and WHO (2009).","src":"Slide 3"},{"sec":"s1","f":"IA vs IB","b":"IA: strongly recommended, strong studies. IB: strongly recommended, some studies + strong reasoning. Equally binding.","src":"Slide 3"},{"sec":"s1","f":"Average HCW hand hygiene compliance","b":"40% (range 5%–81%).","src":"Slide 3"},{"sec":"s1","f":"1847 Vienna: what happened?","b":"Doctors came from autopsies → high maternal deaths. Compulsory antiseptic hand washing → deaths fell sharply. First trial of antiseptic vs plain soap.","src":"Slide 5"},{"sec":"s2","f":"Transient flora","b":"Surface layers, easily removed, most often causes HAI, picked up from last patient/stretcher/monitor.","src":"Slide 6"},{"sec":"s2","f":"Resident flora","b":"Deeper layers, difficult to remove, less often causes HAI, normal and protective.","src":"Slide 6"},{"sec":"s2","f":"Highest-risk body area for colonisation","b":"Perineal and groin area (then armpits, trunk, upper limbs).","src":"Slide 6"},{"sec":"s3","f":"Plain soap: kills or removes?","b":"Removes (detergent action). Does not kill. Correct choice for visibly soiled hands.","src":"Slides 8–9"},{"sec":"s3","f":"Alcohol: mechanism and effective range","b":"Denatures microbial proteins; 60%–95% with water. >95% less effective (needs water).","src":"Slide 10"},{"sec":"s3","f":"CHG: four strengths?","b":"Works well vs gram-positive · effective vs enveloped viruses · substantial residual activity · minimally affected by organic material such as blood.","src":"Slide 13"},{"sec":"s3","f":"CHG: less effective against which three?","b":"Gram-negative bacteria · fungi · non-enveloped viruses.","src":"Slide 13"},{"sec":"s3","f":"CHG: TB and spores?","b":"Minimally effective against M. tuberculosis; does not kill spores.","src":"Slide 13"},{"sec":"s3","f":"CHG: inactivated by? Eye caution?","b":"Inactivated by natural soaps and hand creams (anionic emulsifying agents). Conjunctivitis and severe corneal damage reported with 1% chlorhexidine: keep away from the eyes.","src":"Slide 13"},{"sec":"s3","f":"PCMX (chloroxylenol): strengths?","b":"Good activity vs gram-negative bacteria, mycobacteria and certain viruses; only minimally affected by organic matter such as blood.","src":"Slide 13"},{"sec":"s3","f":"PCMX: weaknesses?","b":"Contradictory data on effectiveness · needs a longer time to work · less residual activity than chlorhexidine · neutralised by non-ionic surfactants.","src":"Slide 13"},{"sec":"s3","f":"PCMX: FDA position?","b":"Not enough information available to classify it as safe and effective.","src":"Slide 13"},{"sec":"s3","f":"Hexachlorophene: strengths?","b":"Bacteriostatic · good activity vs S. aureus · cumulative effect with repeated use · residual activity.","src":"Slide 13"},{"sec":"s3","f":"Hexachlorophene: weaknesses?","b":"Less effective vs gram-negative, fungi and mycobacteria; only modestly effective after a single use; toxic, absorbed through the skin.","src":"Slide 13"},{"sec":"s3","f":"Hexachlorophene: FDA position?","b":"Not generally recognised as safe and effective as an antiseptic hand wash, especially for infant bathing.","src":"Slide 13"},{"sec":"s3","f":"Iodophors: povidone-iodine in most hand-hygiene formulations?","b":"7.5% to 10%.","src":"Slide 14"},{"sec":"s3","f":"Iodine and iodophors: spectrum?","b":"Gram-positive and gram-negative bacteria (including some spore-forming bacteria), mycobacteria, viruses and fungi.","src":"Slide 14"},{"sec":"s3","f":"Iodophors: effectiveness depends on?","b":"pH, temperature, exposure time, and the amount and type of inorganic material present.","src":"Slide 14"},{"sec":"s3","f":"Iodine vs iodophors: skin effects?","b":"Iodine causes skin irritation and discolouration; iodophors are less irritating than free iodine.","src":"Slide 14"},{"sec":"s3","f":"Triclosan: form and concentration?","b":"Non-ionic, colourless; 0.2% to 2% in antimicrobial soaps.","src":"Slide 14"},{"sec":"s3","f":"Triclosan: spectrum?","b":"Most effective vs gram-positive including MRSA; reasonably effective vs mycobacteria and Candida; less effective vs gram-negative, especially Pseudomonas aeruginosa.","src":"Slide 14"},{"sec":"s3","f":"Triclosan: persistence, organic matter, FDA?","b":"Some persistent activity on the skin; not substantially affected by organic matter; FDA 1994: insufficient data to classify as safe and effective.","src":"Slide 14"},{"sec":"s3","f":"Quats (hand agent): spectrum?","b":"More effective vs gram-negative; some activity vs lipophilic viruses; less effective vs gram-positive; minimally effective vs mycobacteria and fungi.","src":"Slide 14"},{"sec":"s3","f":"Quats (hand agent): what reduces or blocks them?","b":"Effectiveness decreased by organic matter such as blood; not compatible with anionic detergents.","src":"Slide 14"},{"sec":"s4","f":"Three situations where alcohol fails","b":"Visibly soiled hands · C. difficile · non-enveloped viruses (norovirus) → soap and water.","src":"Slide 11"},{"sec":"s4","f":"Hand rub time vs hand wash time","b":"Rub 20–30 s (until dry). Wash 40–60 s. (CDC minimum ≥15 s of rubbing.)","src":"Slides 15, 17"},{"sec":"s5","f":"Most often missed areas","b":"Fingertips/under nails (step 7), thumbs (step 6), between fingers (steps 3–4), backs of hands and wrists.","src":"Slide 17"},{"sec":"s5","f":"Hand rub: two rules","b":"Dry in 10 seconds = you used too little. Never wipe or shake the hands to speed up drying: the product must finish working.","src":"Slide 17"},{"sec":"s6","f":"Surgical hand antisepsis: what is it?","b":"Pre-operative cleansing of the hands and forearms with antiseptic agents; removes transient flora and reduces resident flora.","src":"Slide 19"},{"sec":"s6","f":"Surgical antisepsis: alcohol alone vs combined","b":"60–95% alcohol alone; 50–95% when combined with a quat, hexachlorophene or CHG.","src":"Slide 19"},{"sec":"s6","f":"Surgical antisepsis: brushes and long scrubs?","b":"Brushes not recommended (WHO IB); long scrub times not necessary (CDC and WHO IB). Scrubbing damages the skin and brings resident flora up.","src":"Slide 20"},{"sec":"s6","f":"Before putting on sterile gloves, use…","b":"An antimicrobial soap or an alcohol-based hand rub with persistent activity [CDC and WHO, IB]; dry hands and forearms thoroughly first.","src":"Slides 19–20"},{"sec":"s7","f":"Glove sequence","b":"Hand hygiene → put on gloves → patient care → remove gloves → hand hygiene.","src":"Slide 22"},{"sec":"s7","f":"Why gloves are not enough","b":"Tiny holes; contamination during removal; warm moist glove lets bacteria multiply. WHO IB: gloves do not reduce the need for HH.","src":"Slide 22"},{"sec":"s7","f":"Four glove rules (CDC and WHO, IB)","b":"Remove after caring for the patient · dispose after use · never use the same pair for more than one patient · never wash gloves for re-use.","src":"Slide 22"},{"sec":"s7","f":"Partly full dispenser: rule and category?","b":"Never top it up (contamination risk); use pre-filled bags or bottles. Category IA.","src":"Slide 21"},{"sec":"s8","f":"WHO five moments: 1 and 2?","b":"1 Before touching the patient · 2 Before a clean or aseptic procedure.","src":"Slide 27"},{"sec":"s8","f":"WHO five moments: 3, 4 and 5?","b":"3 After body-fluid exposure risk · 4 After touching the patient · 5 After touching the patient's surroundings.","src":"Slide 27"},{"sec":"s8","f":"Compliance: lower before or after patient contact? Why?","b":"Lower before contact than after: providers protect themselves more than the patient.","src":"Slide 25"},{"sec":"s8","f":"Compliance: night or day? Physicians or nurses? Clean or dirty task?","b":"Lower at night, among physicians, and after a clean task. It also falls as opportunities per hour rise.","src":"Slide 25"},{"sec":"s8","f":"Barriers to compliance: three groups? Where does \"Gloves are enough\" belong?","b":"System · Beliefs · Culture. \"Gloves are enough\" is a Beliefs barrier.","src":"Slide 25"},{"sec":"s9","f":"Fix: alcohol rub on visibly bloody hands?","b":"Soap and water first; alcohol does not work through blood.","src":"Slide 29"},{"sec":"s9","f":"Fix: changing gloves without hand hygiene?","b":"Hand hygiene before and after every pair.","src":"Slide 29"},{"sec":"s9","f":"Fix: touching a personal phone during patient care?","b":"Phone stays out of the patient compartment, or is disinfected after every patient.","src":"Slide 29"}]},{"id":"ch3","n":3,"title":"Modes of Transmission, PPE & Isolation","ar":"طرق انتقال العدوى، معدات الوقاية الشخصية، والعزل","file":"EMS313_Ch03.pdf","sections":[{"id":"s1","title":"Three routes: contact, droplet, airborne","src":"Slides 3–6","blocks":[{"t":"note","k":"ems","x":"The patient for the whole lecture: **Ahmed, 34**, from shared workers' accommodation. Cough for three weeks, fever, night sweats, weight loss. He coughs through a 25-minute transport. Before you touch him: no mask, a surgical mask, or an N95?"},{"t":"h","x":"Contact"},{"t":"table","cap":"Contact transmission","quiz":true,"head":["Type","How"],"rows":[["{direct|Direct}","Skin to skin. From the patient to you, and from you to the next patient."],["{indirect|Indirect}","Through a stretcher rail, a cuff, a monitor cable, or a hand that touched them."]]},{"t":"p","x":"Indirect contact is the route that **hand hygiene (Chapter 2)** and **equipment cleaning (Chapter 4)** exist to break. Ahmed: before he coughs at all, his hands, his blanket and the rail he holds are contact routes."},{"t":"svg","id":"routes"},{"t":"h","x":"Droplet"},{"t":"ul","items":["**{droplet|Droplets}** are **larger than 5 µm**, made by coughing, sneezing and talking. They travel a short distance (**about 2 metres**) and drop.","How far depends on: the **force** of the cough, the **density** of the drops, **temperature**, **humidity**, **air circulation**, and how long the germ stays infectious.","Examples: **pertussis** (whooping cough), **influenza**, **rhinovirus**, **SARS coronavirus**, **group A streptococcus**, **Neisseria meningitidis**."]},{"t":"note","k":"ems","x":"Stand two metres away and droplets never reach you. **In an ambulance you are never two metres away.** If Ahmed has influenza, his cough reaches everyone in the compartment. That alone needs a mask."},{"t":"h","x":"Airborne"},{"t":"ul","items":["**{airborne|Airborne}** particles are **5 µm or smaller**: **{nuclei|droplet nuclei}**, the dried residue of droplets. Light enough to float and move with the air, across the room, along the corridor, **for hours**.","Spread this way (Box 3.1): **tuberculosis, measles (rubeola), chickenpox (varicella)**."]},{"t":"table","cap":"Droplet vs airborne (don't mix them up)","quiz":true,"head":["","Droplet","Airborne"],"rows":[["Size","Larger than 5 µm","5 µm or smaller"],["Distance","About 2 metres, then falls","Far, stays suspended"],["Your mask","{surgicalmask|Surgical mask}","{n95|N95 respirator}, {fittest|fit-tested}"]]},{"t":"chain","items":["3 weeks cough + night sweats + weight loss","Think tuberculosis","Airborne until proven otherwise","Surgical mask is not enough → N95"]},{"t":"note","k":"conflict","x":"Droplet distance: the lecture says **about 2 metres** (slides 3, 5, 6). A past quiz option says \"3–6 feet\" (Quiz 2, Q6). The site uses the lecture value. See the \"Differences from the lecture\" page."}],"recall":[{"q":"Droplet vs airborne: particle size, distance and mask?","a":"Droplet >5 µm, ~2 m then falls, surgical mask. Airborne ≤5 µm (droplet nuclei), far/stays suspended, fit-tested N95."},{"q":"Name the airborne diseases in Box 3.1.","a":"Tuberculosis, measles (rubeola), chickenpox (varicella)."},{"q":"Name the droplet examples on slide 5.","a":"Pertussis, influenza, rhinovirus, SARS coronavirus, group A streptococcus, Neisseria meningitidis."},{"q":"What factors decide how far droplets travel?","a":"Force of the cough, density of the drops, temperature, humidity, air circulation, how long the germ stays infectious."}]},{"id":"s2","title":"PPE: when, and in what order","src":"Slides 7–9","blocks":[{"t":"p","x":"{ppe|PPE} (gloves, gown, mask, eye protection) is a **barrier between the germ and your skin, airways and clothes**."},{"t":"twocol","a":{"h":"Put it on","items":["Whenever **blood or body fluids could reach you**."]},"b":{"h":"Take it off","items":["Take it off and throw it away **before you leave the patient's room**.","In the ambulance, the patient's room is the **patient compartment**. PPE comes off at the door, before the cab."]}},{"t":"h","x":"Putting on (donning): Gown → Mask → Eyes → Gloves"},{"t":"order","id":"c3-don"},{"t":"table","cap":"Donning details","quiz":true,"head":["Step","Item","How"],"rows":[["0","Hand hygiene","Hand hygiene first, before the gown"],["1","Gown","Cover arms and front, neck to mid-thigh. Tie at neck and waist"],["2","Mask or respirator","Ties at the crown and the neck. Fit the nose piece. Seal-check a respirator"],["3","Goggles or face shield","Over the eyes, or the whole face"],["4","Gloves","Pull the cuffs over the gown sleeves"]]},{"t":"h","x":"Taking off (doffing): the front of everything is contaminated"},{"t":"order","id":"c3-doff"},{"t":"table","cap":"Doffing details","quiz":true,"head":["Step","Item","How"],"rows":[["1","Gloves","Peel off without touching the outside"],["2","Goggles or face shield","By the headband or ear pieces"],["3","Gown","Untie, peel down from the shoulders, roll inside out"],["4","Mask or respirator","By the ties. Do not touch the front"],["5","Hand hygiene","Then, and only then, the cab and the report"]]},{"t":"twocol","a":{"h":"Clean parts","items":["Ties, ear loops, headband: you may touch them with bare hands"]},"b":{"h":"Contaminated parts","items":["The front of the mask, the goggles, the shield, the gown, the gloves"]}},{"t":"mistakes","intro":"Spot the mistake (slide 9): After handover, Khalid pulls his mask down under his chin, removes his gloves, then his gown, and walks to the cab to write the report. Tap each action to see what is wrong.","lines":[["He pulls his mask down under his chin (first).",true,"Gloves come off first; the mask comes off last, by the ties, without touching the front."],["He removes his gloves, then his gown.",true,"Goggles/face shield are removed after gloves and before the gown."],["He walks to the cab to write the report.",true,"Hand hygiene is the final step; only then the cab and the report."]]}],"recall":[{"q":"Donning order?","a":"Hand hygiene → gown → mask/respirator → goggles/face shield → gloves."},{"q":"Doffing order?","a":"Gloves → goggles/face shield → gown → mask/respirator → hand hygiene."},{"q":"Which parts are \"clean\" and may be touched with bare hands?","a":"Ties, ear loops, headband."},{"q":"In the ambulance, where does PPE come off?","a":"At the door of the patient compartment, before the cab."}]},{"id":"s3","title":"Gloves, gowns, eye protection and masks","src":"Slides 10–13","blocks":[{"t":"h","x":"Gloves: latex or nitrile, never vinyl"},{"t":"p","x":"Wear gloves whenever you could touch **blood or body fluids, mucous membranes, broken skin, or other infectious material** [IB/IC]. Gloves do not replace hand hygiene: hand hygiene before, hand hygiene after, a new pair for every patient."},{"t":"h","x":"Gowns"},{"t":"ul","items":["An **isolation gown, not a lab coat or jacket**. Covers the arms and the front, from the neck to mid-thigh. Always with gloves.","**Wear it [IB/IC]** when the task could soil your clothes, and for direct contact with a patient whose secretions are not contained.","**Two rules people miss:** do not gown just for entering a high-risk unit [IB]; take the gown off and clean your hands before you leave the room [IB/IC]."]},{"t":"h","x":"Eyes, nose and mouth"},{"t":"ul","items":["Choose a mask, goggles, a face shield, or a combination, for the task and the risk [IB/IC].","**Best eye protection: a {faceshield|face shield} from the top of the head to the chin.** It must be comfortable, adjustable, and not block your side vision (NIOSH).","**{agp|Aerosol-generating procedures}: full protection every time**: bronchoscopy, suctioning the airway, endotracheal intubation."]},{"t":"note","k":"ems","x":"If Ahmed needs suctioning or intubation on the way, the risk changes: **respirator, full face shield, gown, gloves**."},{"t":"table","cap":"Three kinds of mask, and only one stops airborne germs","quiz":true,"head":["","Surgical mask","Procedure / isolation mask","N95 respirator (\"TB mask\")"],"rows":[["FDA","Cleared by the FDA","Not cleared by the FDA","—"],["Property","Fluid-resistant","No fluid-resistance standard","Filters tiny particles; must be fit-tested"],["Stops","Droplets and splashes","Droplet barrier","The only one for airborne germs: TB, measles, chickenpox"]]},{"t":"note","k":"key","x":"After use the **front is contaminated**. Remove a mask by the ties or ear loops, with bare hands, **after the gloves are off**."}],"recall":[{"q":"Which glove materials are acceptable?","a":"Latex or nitrile, never vinyl."},{"q":"When should you wear a gown?","a":"When the task could soil your clothes, and for direct contact with a patient whose secretions are not contained."},{"q":"Name the three aerosol-generating procedures on slide 12.","a":"Bronchoscopy, suctioning the airway, endotracheal intubation."},{"q":"Surgical vs procedure mask?","a":"Surgical: FDA-cleared, fluid-resistant, stops droplets and splashes. Procedure/isolation: not FDA-cleared, droplet barrier, no fluid-resistance standard."}]},{"id":"s4","title":"Standard and transmission-based precautions","src":"Slides 14–17","blocks":[{"t":"table","cap":"Two tiers","quiz":true,"head":["","Tier 1: {standard|Standard precautions}","Tier 2: {tbp|Transmission-based precautions}"],"rows":[["Who","Every patient, every time","Patients who have, or are suspected to have, a highly transmissible or important pathogen"],["What","Treat all blood, body fluids, secretions and excretions (**except sweat**), broken skin and mucous membranes as infectious","Contact, droplet or airborne"]]},{"t":"note","k":"key","x":"**Tier 2 is added to Tier 1, never instead of it.** Ahmed: standard precautions from the first touch; airborne precautions added the moment the history is heard."},{"t":"table","cap":"Contact · Droplet · Airborne precautions (don't mix them up)","quiz":true,"head":["","{contactp|Contact}","{dropletp|Droplet}","{airbornep|Airborne}"],"rows":[["On you","Gown and gloves on entry, off before leaving","Surgical mask on entry [IB]","Fit-tested N95 or higher [IB]"],["On the patient","—","Surgical mask when moved, plus cough etiquette [IB]","Surgical mask until inside the room [IB/IC]"],["Room","Single room if possible; room cleaned at least daily","Private room preferred; no special air handling, no respirator needed","Negative-pressure isolation room ({aiir|AIIR}); air out through {hepa|HEPA} or to the outside"],["Equipment / staff","Equipment stays with the patient, or is cleaned between patients","—","Non-immune staff stay away from measles, chickenpox, smallpox [IB]"],["When / germs","Draining wounds, faecal incontinence, any discharge that could contaminate the environment","Pertussis, influenza, meningococcus, group A streptococcus","Tuberculosis, measles, chickenpox"]]},{"t":"p","x":"Contact precautions: all measures are **HICPAC/CDC Category IB**. Droplet spread needs close contact with respiratory secretions; the drops do not stay infectious over distance, so **the air itself is not the problem**. The **patient's mask matters as much as yours**: it stops droplets at the source."},{"t":"note","k":"ems","x":"**Umm Saad, 78**, long-term care facility, draining leg wound, notes say **{mrsa|MRSA}**: gown and gloves before the stretcher, a cuff that stays with her, the ambulance cleaned before the next call, MRSA stated at handover."},{"t":"note","k":"ems","x":"If Ahmed had **influenza**: surgical mask on the crew, surgical mask on Ahmed, and you would be done."},{"t":"note","k":"warn","x":"**No isolation room available:** mask on the patient, and keep the room empty for **about an hour** afterwards [IB/IC]. **The ambulance has no negative pressure:** mask on Ahmed, N95 on the crew, exhaust fan on, hospital pre-alerted, compartment aired after."},{"t":"note","k":"conflict","x":"Time a room stays contaminated: Ch3 slide 17 says keep the room empty for **about an hour**. The vaccines lecture (slide 24) says measles virus can remain infectious in the air for **up to 2 hours** after the patient leaves. Both are shown with their sources."}],"recall":[{"q":"What does standard precautions treat as infectious? What is the exception?","a":"All blood, body fluids, secretions and excretions, broken skin and mucous membranes, except sweat."},{"q":"Contact precautions: four measures?","a":"Single room if possible; gown and gloves on entry, off before leaving; equipment stays with patient or cleaned between patients; room cleaned at least daily."},{"q":"Droplet precautions: what goes on you and on the patient?","a":"Surgical mask on you on entry; surgical mask on the patient when moved, plus cough etiquette."},{"q":"Airborne precautions: the room?","a":"Negative-pressure AIIR; air exhausted through HEPA or to the outside."}]},{"id":"s5","title":"Which precaution? Isolation vs quarantine","src":"Slides 18–21","blocks":[{"t":"sort","id":"c3-which"},{"t":"note","k":"added","x":"The answers to slide 18 are \"in the speaker notes\", which are not in the PDF. The answers here link each clue to a disease using the vaccines lecture (whoop = pertussis, slide 28; fever + stiff neck + purple rash = meningococcal, slide 25; rash that begins on the face = measles, slide 23; itchy blistering rash = varicella, slides 15–16) and the precaution lists on Ch3 slides 15–17."},{"t":"table","cap":"Isolation is for the ill. Quarantine is for the exposed.","quiz":true,"head":["","{isolation|Isolation}","{quarantine|Quarantine}"],"rows":[["Who","The person is already **ill or diagnosed**","The person was **exposed and may become ill**"],["Where / when","Usually **in hospital, during treatment**","For a well-defined group and a dangerous, highly contagious disease"],["How long","As long as the patient is infectious","Contact with others is limited until it is clear they did not catch it"]]},{"t":"note","k":"ems","x":"After the call: Ahmed's tuberculosis is confirmed. He is **isolated** in the hospital's negative-pressure room until no longer infectious. The crew were exposed; they are not ill, so they are **not isolated**. They are screened and followed up."},{"t":"h","x":"The system: none of this works unless the service pays for it and teaches it"},{"t":"twocol","a":{"h":"Administrators [IB/IC]","items":["Put prevention of transmission into the safety objectives","Make it a priority, with the money and the people to run the programme"]},"b":{"h":"Education on PPE and precautions","items":["Task-specific","At orientation, then updated","For everyone","Built on adult learning","In a language and reading level staff understand"]}},{"t":"p","x":"Fit-testing, respirators in every vehicle, face shields at the stretcher, gowns that fit, someone whose job it is to check: **these are administrative decisions**."},{"t":"table","cap":"The whole chapter in five questions","head":["Question","Answer"],"rows":[["How does it spread?","Contact, droplet or airborne. The route decides everything else."],["What barrier do I need?","Gloves, gown, mask or respirator, eye protection. Chosen for the task, removed in order."],["Which precaution?","Standard for everyone. Contact, droplet or airborne added on suspicion."],["Who is separated from whom?","Isolation for the ill, quarantine for the exposed, contact precautions for resistant organisms."],["What must the service provide?","Objectives, budget, equipment, fit-testing and training for everyone."]]},{"t":"note","k":"key","x":"\"**The precaution starts on suspicion, not on diagnosis.**\""}],"recall":[{"q":"Isolation vs quarantine in one line each?","a":"Isolation: the ill/diagnosed, usually in hospital during treatment, as long as infectious. Quarantine: the exposed who may become ill, contact limited until clear."},{"q":"When does a precaution start?","a":"On suspicion, not on diagnosis."},{"q":"What precautions are used for resistant organisms (e.g. MRSA, VRE)?","a":"Contact precautions."}]}],"orders":[{"id":"c3-don","sec":"s2","src":"Slide 8","title":"Putting on PPE (donning)","steps":["Hand hygiene","Gown","Mask or respirator","Goggles or face shield","Gloves"]},{"id":"c3-doff","sec":"s2","src":"Slide 9","title":"Taking off PPE (doffing)","steps":["Gloves","Goggles or face shield","Gown","Mask or respirator","Hand hygiene"]}],"sorts":[{"id":"c3-which","sec":"s5","src":"Slide 18 (+ vaccines slides 15–28)","title":"Which precaution? Contact, droplet or airborne","cats":["Contact","Droplet","Airborne"],"items":[["A child with a barking cough and a whoop for two weeks",1],["A man with fever, stiff neck and a purple rash",1],["A care-home resident with faecal incontinence and a known VRE",0],["A student with fever, cough and a rash that began on the face",2],["An adult with fever, body aches and a dry cough in flu season",1],["An adult with a month of cough and a friend recently treated for TB",2],["A dialysis patient with a heavily draining catheter-site infection",0],["A young adult with an itchy blistering rash all over the body",2]]},{"id":"c3-route","sec":"s1","src":"Slides 4–6","title":"Which route?","cats":["Contact","Droplet","Airborne"],"items":[["Tuberculosis",2],["Measles (rubeola)",2],["Chickenpox (varicella)",2],["Pertussis",1],["Influenza",1],["Neisseria meningitidis",1],["Group A streptococcus",1],["Rhinovirus",1],["A stretcher rail touched by the last patient",0],["Skin to skin from patient to provider",0]]}],"questions":[{"id":"c3q1","sec":"s1","q":"Which statement about droplets is correct?","o":["They are larger than 5 µm and fall within about 2 metres","They are 5 µm or smaller and stay suspended for hours","They need negative-pressure rooms","They are stopped only by an N95 respirator"],"x":"Slide 5.","src":"Slide 5"},{"id":"c3q2","sec":"s1","q":"Droplet nuclei are:","o":["The dried residue of droplets, 5 µm or smaller","Large drops produced by sneezing that fall within about 2 metres","Particles larger than 5 µm","Organisms on a stretcher rail"],"x":"Slide 6.","src":"Slide 6"},{"id":"c3q3","sec":"s1","q":"Which group lists ONLY airborne diseases (Box 3.1)?","o":["Tuberculosis, measles, chickenpox","Influenza, pertussis, measles","Tuberculosis, influenza, MRSA","Chickenpox, meningococcus, rhinovirus"],"x":"Slide 6.","src":"Slide 6"},{"id":"c3q4","sec":"s1","q":"Which infection is spread by DROPLETS according to slide 5?","o":["Neisseria meningitidis","Tuberculosis","Measles","Chickenpox"],"x":"Slide 5 droplet examples: pertussis, influenza, rhinovirus, SARS-CoV, group A strep, N. meningitidis.","src":"Slide 5"},{"id":"c3q5","sec":"s1","q":"Touching a stretcher rail that the last patient held is:","o":["Indirect contact","Direct contact","Droplet transmission","Airborne transmission"],"x":"Slide 4.","src":"Slide 4"},{"id":"c3q6","sec":"s1","q":"Ahmed: 3 weeks of cough, night sweats and weight loss. What respiratory protection does the crew need?","o":["Fit-tested N95 respirator","Surgical mask","Procedure mask","No mask if 2 metres away"],"x":"Slide 6: think TB; airborne until proven otherwise; a surgical mask is not enough.","src":"Slide 6"},{"id":"c3q7","sec":"s1","q":"Which factor does NOT determine how far droplets travel?","o":["The patient's blood type","Force of the cough","Humidity","Air circulation"],"x":"Slide 5 lists force, density, temperature, humidity, air circulation, infectious time.","src":"Slide 5"},{"id":"c3q8","sec":"s2","q":"PPE should be put on whenever:","o":["Blood or body fluids could reach you","The patient has a confirmed diagnosis","You enter the ambulance cab","The patient requests it"],"x":"Slide 7.","src":"Slide 7"},{"id":"c3q9","sec":"s2","q":"The correct DONNING sequence after hand hygiene is:","o":["Gown → mask → goggles → gloves","Gloves → gown → mask → goggles","Mask → gown → gloves → goggles","Goggles → mask → gown → gloves"],"x":"Slide 8.","src":"Slide 8"},{"id":"c3q10","sec":"s2","q":"The correct DOFFING sequence is:","o":["Gloves → goggles → gown → mask → hand hygiene","Mask → gloves → gown → goggles → hand hygiene","Gown → gloves → mask → goggles → hand hygiene","Gloves → mask → gown → goggles → hand hygiene"],"x":"Slide 9.","src":"Slide 9"},{"id":"c3q11","sec":"s2","q":"Which part of PPE may be touched with bare hands during removal?","o":["Ties, ear loops and headband","The front of the mask","The outside of the gloves","The front of the gown"],"x":"Slide 9: clean parts.","src":"Slide 9"},{"id":"c3q12","sec":"s2","q":"In the ambulance, PPE is removed:","o":["At the patient compartment door, before the cab","In the cab, after writing the patient report and before hand hygiene","At the hospital entrance","After returning to the station"],"x":"Slide 7.","src":"Slide 7"},{"id":"c3q13","sec":"s2","q":"When donning gloves, the cuffs should be:","o":["Pulled over the gown sleeves","Tucked under the gown sleeves","Folded back to the wrist","Taped to the gown"],"x":"Slide 8.","src":"Slide 8"},{"id":"c3q14","sec":"s3","q":"Which glove material should NOT be used?","o":["Vinyl","Nitrile","Latex","Both latex and nitrile"],"x":"Slide 10: latex or nitrile, never vinyl.","src":"Slide 10"},{"id":"c3q15","sec":"s3","q":"Which statement about gowns is correct?","o":["Do not gown just for entering a high-risk unit","A lab coat is an acceptable isolation gown","Gowns are kept on when leaving the room","Gowns are worn without gloves"],"x":"Slide 11 [IB].","src":"Slide 11"},{"id":"c3q16","sec":"s3","q":"The best eye protection according to NIOSH is:","o":["A face shield from the top of the head to the chin","Prescription eyeglasses","A surgical mask with ear loops","Goggles or prescription glasses with no side protection, worn under a mask"],"x":"Slide 12.","src":"Slide 12"},{"id":"c3q17","sec":"s3","q":"Which is an aerosol-generating procedure listed on slide 12?","o":["Endotracheal intubation","Blood pressure measurement","IV cannulation","Splinting"],"x":"Slide 12: bronchoscopy, suctioning the airway, endotracheal intubation.","src":"Slide 12"},{"id":"c3q18","sec":"s3","q":"Which mask is cleared by the FDA and fluid-resistant?","o":["Surgical mask","Procedure/isolation mask","Cloth mask","Any mask with ear loops"],"x":"Slide 13.","src":"Slide 13"},{"id":"c3q19","sec":"s3","q":"The only mask that protects against airborne germs is the:","o":["N95 respirator, fit-tested","Surgical mask","Procedure mask","Isolation mask"],"x":"Slide 13.","src":"Slide 13"},{"id":"c3q20","sec":"s4","q":"Standard precautions treat all body fluids as infectious EXCEPT:","o":["Sweat","Saliva","Urine","Blood"],"x":"Slide 14.","src":"Slide 14"},{"id":"c3q21","sec":"s4","q":"Transmission-based precautions are:","o":["Added to standard precautions, never instead of them","Used instead of standard precautions","Used only after laboratory confirmation of the pathogen at the hospital","Applied to every patient every time"],"x":"Slide 14.","src":"Slide 14"},{"id":"c3q22","sec":"s4","q":"Contact precautions include:","o":["Gown and gloves on entry; equipment stays with the patient","An N95 respirator on entry","A negative-pressure room with air exhausted through a HEPA filter","A surgical mask on the patient only"],"x":"Slide 15.","src":"Slide 15"},{"id":"c3q23","sec":"s4","q":"For droplet precautions, which is correct?","o":["No special air handling and no respirator are needed","A negative-pressure room with HEPA-filtered exhaust air is required","The patient wears an N95 respirator","Only gloves are needed"],"x":"Slide 16.","src":"Slide 16"},{"id":"c3q24","sec":"s4","q":"Airborne infection isolation rooms (AIIR) exhaust air:","o":["Through HEPA filters or to the outside","Into the hospital corridor through the open door","Back into the same room","Into the ambulance bay"],"x":"Slide 17.","src":"Slide 17"},{"id":"c3q25","sec":"s4","q":"If no isolation room is available for an airborne patient, what does slide 17 advise?","o":["Mask the patient and keep the room empty for about an hour afterwards","Keep the door open so the corridor ventilates the room, and use droplet precautions","Use droplet precautions instead","Delay transport until a room is free"],"x":"Slide 17 [IB/IC].","src":"Slide 17"},{"id":"c3q26","sec":"s4","q":"Umm Saad (MRSA, draining leg wound) requires which precautions?","o":["Contact","Droplet","Airborne","Standard only"],"x":"Slide 15.","src":"Slide 15"},{"id":"c3q27","sec":"s4","q":"Non-immune staff should stay away from patients with:","o":["Measles, chickenpox, smallpox","Influenza, pertussis, MRSA","Hepatitis A and B","Group A streptococcus"],"x":"Slide 17 [IB].","src":"Slide 17"},{"id":"c3q28","sec":"s5","q":"A person who was exposed to a dangerous contagious disease and may become ill is placed in:","o":["Quarantine","Isolation","Contact precautions","A negative-pressure operating room"],"x":"Slide 19.","src":"Slide 19"},{"id":"c3q29","sec":"s5","q":"The crew who transported Ahmed (confirmed TB) are not ill. They are:","o":["Screened and followed up, not isolated","Isolated in a negative-pressure room","Quarantined in hospital during treatment","Placed on contact precautions"],"x":"Slide 19.","src":"Slide 19"},{"id":"c3q30","sec":"s5","q":"Fit-testing, respirators in every vehicle and gowns that fit are:","o":["Administrative decisions","Personal choices of each paramedic","Patient responsibilities","Optional extras"],"x":"Slide 20.","src":"Slide 20"},{"id":"c3q31","sec":"s5","q":"A care-home resident with faecal incontinence and known VRE needs:","o":["Contact precautions","Droplet precautions","Airborne precautions","Quarantine"],"x":"Slide 15: faecal incontinence / discharge that could contaminate the environment.","src":"Slides 15, 18"},{"id":"c3q32","sec":"s5","q":"According to the lecture, a precaution starts:","o":["On suspicion, not on diagnosis","After laboratory confirmation","After hospital handover","Only when the patient has a fever"],"x":"Slide 21.","src":"Slide 21"},{"id":"p2q1","sec":"s1","q":"Which of the following is an example of direct transmission?","o":["Skin-to-skin contact with the patient","Standing next to contaminated bed linens","Inhaling particles of infectious material","Releasing droplets into the air when sneezing"],"x":"Slide 4: direct = skin to skin, patient to you.","src":"Slide 4","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":1,"edit":"Modified: the quiz's option \"Contacting infectious blood with a wound\" was replaced with the lecture's definition of direct contact (\"skin to skin\"), because the lecture does not classify blood-to-wound contact."}},{"id":"p2q2","sec":"s1","q":"The respiratory droplets involved in droplet transmission are ______ than the droplet nuclei (airborne) involved in airborne transmission.","o":["bigger","smaller","the same","no different"],"x":"Droplets >5 µm; droplet nuclei ≤5 µm (slides 5–6).","src":"Slides 5–6","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":2}},{"id":"p2q3","sec":"s4","q":"As a supervisor at an EMS centre during a disaster event, you are told a newly admitted patient requires Contact Precautions. What is the most appropriate placement?","o":["In a single patient room","In a room with a decontamination station immediately outside the door","No specific type of room is preferred","In a room with negative pressure ventilation"],"x":"Slide 15: single room if possible. (Negative pressure is for airborne.)","src":"Slide 15","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":3}},{"id":"p2q4","sec":"s1","q":"Which of the following statements are true about infectious droplets? i. The velocity and mechanism by which droplets are propelled may impact how far they travel. ii. The density of respiratory secretions may impact how far they travel. iii. Air circulation may impact how far they travel. iv. The force by which the susceptible host inhales may impact how far they travel.","o":["I, II, and III","I, II, III, and IV","II, III, and IV"],"fix":true,"x":"Slide 5: force of the cough, density, temperature, humidity, air circulation. Nothing about how hard the host inhales.","src":"Slide 5","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":4,"edit":"Only three options were visible in the screenshot; the question uses those three."}},{"id":"p2q5","sec":"s3","q":"Your paramedic team suggests that all staff routinely wear gowns for every patient interaction in the ICU, regardless of diagnosis. Most appropriate response?","o":["Do not support it: routine gowning in high-risk units is not recommended; gowns are for contact/transmission-based indications","Support it: it is unlikely to reduce infection but reassures staff","Do not support it: it is not cost-effective even though it reduces transmission","Support it: routine gowning in all high-risk environments is recommended by CDC and HICPAC"],"x":"Slide 11: do not gown just for entering a high-risk unit [IB].","src":"Slide 11","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":5}},{"id":"p2q7","sec":"s2","q":"HICPAC recommends that personal protective equipment (PPE) be used when there is a potential for ______.","o":["blood or body fluid exposure","water","soil and dirt spots","unclean surface"],"x":"Slide 7.","src":"Slide 7","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":7}},{"id":"p2q8","sec":"s5","q":"Quarantine usually occurs in hospital while the patient is receiving treatment.","o":["True","False"],"a":1,"fix":true,"x":"False. That describes ISOLATION (slide 19).","src":"Slide 19","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":8}},{"id":"p2q9","sec":"s4","q":"Standard precautions are used with every patient.","o":["True","False"],"fix":true,"x":"True: every patient, every time (slide 14).","src":"Slide 14","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":9}},{"id":"p2q11","sec":"s4","q":"Diseases transmitted via droplet transmission require special air handling to avoid contamination of the ventilation system.","o":["True","False"],"a":1,"fix":true,"x":"False. Droplet precautions: no special air handling (slide 16).","src":"Slide 16","past":{"file":"Quiz 2, ch 2&3 (45).pdf","n":11}},{"id":"p2q14","sec":"s1","q":"Which of the following is an example of indirect transmission?","o":["Contact with contaminated bed linens","Looking at infected patients with HIV","Releasing droplets into the air when sneezing","Inhalation of particles of infectious material"],"x":"Slide 4: indirect = through an object (rail, cuff, cable; Ahmed's blanket).","src":"Slide
